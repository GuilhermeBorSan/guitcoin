<script>
(function () {
  if (location.hostname !== "localhost" && location.hostname !== "127.0.0.1") return;
  document.documentElement.classList.add("gc-iphone-preview");
  var root = document.getElementById("root");
  var stage = document.createElement("div");
  stage.className = "gc-phone-stage";
  var phone = document.createElement("div");
  phone.className = "gc-phone";
  root.parentNode.insertBefore(stage, root);
  phone.appendChild(root);
  stage.appendChild(phone);
  var fit = function () {
    var s = Math.min(1, (window.innerHeight - 36) / 852, (window.innerWidth - 36) / 393);
    phone.style.transform = "translateZ(0) scale(" + s + ")";
    stage.style.width = (393 * s) + "px";
    stage.style.height = (852 * s) + "px";
  };
  fit();
  window.addEventListener("resize", fit);
})();
</script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef } = React;

/* ---------------------------------------------------------------
   Guitcoin: app autônomo de controle financeiro pessoal. Estruturado
   seguindo o mesmo padrão de Guitchelin/Letterborgs (arquivo único, sem
   build, Supabase). Persistência isolada no hook useGcData abaixo (as telas
   não sabem de onde vêm os dados). Exige login. Fase 0: só shell + auth,
   ainda sem tabelas/telas de verdade (ver CLAUDE.md > Roadmap).
----------------------------------------------------------------*/

// ---- Ícones (SVG inline, mesmo IconBase da família Gg/Lb) ----
function IconBase({ size = 24, strokeWidth = 2, fill = "none", className, style, children }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke="currentColor"
      strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round"
      className={className} style={style}>{children}</svg>
  );
}
const X = (p) => <IconBase {...p}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></IconBase>;
const Check = (p) => <IconBase {...p}><polyline points="20 6 9 17 4 12"/></IconBase>;
const Plus = (p) => <IconBase {...p}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></IconBase>;
const Pencil = (p) => <IconBase {...p}><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></IconBase>;
const Trash2 = (p) => <IconBase {...p}><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></IconBase>;
const LogOut = (p) => <IconBase {...p}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></IconBase>;
const ChevronDown = (p) => <IconBase {...p}><polyline points="6 9 12 15 18 9"/></IconBase>;
const ChevronLeft = (p) => <IconBase {...p}><polyline points="15 18 9 12 15 6"/></IconBase>;
const ChevronRight = (p) => <IconBase {...p}><polyline points="9 18 15 12 9 6"/></IconBase>;
const Calendar = (p) => <IconBase {...p}><rect x="3" y="4" width="18" height="18" rx="2.5"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></IconBase>;
const BarChart3 = (p) => <IconBase {...p}><rect x="4" y="12" width="4" height="8" rx="1.5" fill="currentColor" stroke="none"/><rect x="10" y="5" width="4" height="15" rx="1.5" fill="currentColor" stroke="none"/><rect x="16" y="9" width="4" height="11" rx="1.5" fill="currentColor" stroke="none"/></IconBase>;
const TrendingUp = (p) => <IconBase {...p}><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></IconBase>;
const FileText = (p) => <IconBase {...p}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></IconBase>;
const Repeat = (p) => <IconBase {...p}><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></IconBase>;
const Gift = (p) => <IconBase {...p}><polyline points="20 12 20 22 4 22 4 12"/><rect x="2" y="7" width="20" height="5"/><line x1="12" y1="22" x2="12" y2="7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></IconBase>;
const Menu = (p) => <IconBase {...p}><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></IconBase>;

// Marca (círculo + cifrão), mesmo papel do GgFlower no Guitchelin: usada no
// topbar e como ícone do botão que abre/fecha a gaveta lateral (outline
// fechado, preenchido aberto).
function GcCoin({ outline = false, size = 22 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none">
      <circle cx="12" cy="12" r="10" fill={outline ? "none" : "var(--gc-accent)"} stroke={outline ? "currentColor" : "var(--gc-accent)"} strokeWidth="1.6" />
      <path d="M14.6 8.5h-4.2a1.9 1.9 0 0 0 0 3.8h3.2a1.9 1.9 0 0 1 0 3.8h-4.5"
        stroke={outline ? "currentColor" : "#fff"} strokeWidth="1.6" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
      <line x1="12" y1="6.1" x2="12" y2="17.9" stroke={outline ? "currentColor" : "#fff"} strokeWidth="1.6" strokeLinecap="round"/>
    </svg>
  );
}

// ---- Helpers ----
let _uid = 0;
function uid() { _uid += 1; return "gc-" + Date.now().toString(36) + "-" + _uid.toString(36); }
function todayISO() {
  const d = new Date();
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}
const MONTH_LABELS = ["Jan", "Fev", "Mar", "Abr", "Mai", "Jun", "Jul", "Ago", "Set", "Out", "Nov", "Dez"];
// competência = "YYYY-MM" (mês de referência de um lançamento/instância).
function competenciaAtual() { return todayISO().slice(0, 7); }
function competenciaLabel(comp) {
  const [y, m] = (comp || "").split("-").map(Number);
  return m ? `${MONTH_LABELS[m - 1]} ${y}` : comp;
}
// Preview local: localhost entra direto no app com dados fictícios, sem
// gravar no Supabase de produção. Em guitcoin.vercel.app isso fica off.
const GC_IS_LOCAL = ["localhost", "127.0.0.1"].includes(location.hostname);

// ---- Cliente Supabase (auth + dados). TODO: preencher com o projeto
// próprio do Guitcoin depois de provisionado no painel (ver CLAUDE.md >
// Roadmap) — hoje são placeholders, então fora do localhost o login não vai
// funcionar até isso ser feito. ----
const GC_SUPABASE_URL = "https://SEU-PROJETO.supabase.co";
const GC_SUPABASE_ANON_KEY = "SUA-ANON-KEY-AQUI";
// "lock" passthrough: o supabase-js usa navigator.locks pra coordenar o
// refresh do token, mas em alguns navegadores iOS/PWA esse lock trava e o
// getSession() nunca resolve (app preso em "Carregando..."). App de um
// usuário só, sem múltiplas abas concorrentes: passar direto é seguro e
// evita a trava (mesmo workaround do Guitchelin).
const gcAuthLock = async (_name, _acquireTimeout, fn) => fn();
const gcSupabase = window.supabase && !GC_IS_LOCAL
  ? window.supabase.createClient(GC_SUPABASE_URL, GC_SUPABASE_ANON_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, lock: gcAuthLock },
    })
  : null;

// Corre uma promessa contra um timeout. Auth do supabase-js pode travar sem
// nunca rejeitar (deadlock do navigator.locks); isso garante que a tela não
// fique presa pra sempre.
function gcWithTimeout(promise, ms, label) {
  let t;
  const timeout = new Promise((_, reject) => { t = setTimeout(() => reject(new Error(label || "timeout")), ms); });
  return Promise.race([promise, timeout]).finally(() => clearTimeout(t));
}

// Traduz o erro cru do Supabase/Postgres numa dica acionável em pt-BR.
function gcWriteErrorMsg(error, verbo) {
  const msg = String((error && error.message) || error || "");
  if (/row-level security/i.test(msg)) {
    return `Não consegui ${verbo}: parece que a sessão expirou. Saia e entre de novo.`;
  }
  if (/does not exist|could not find|schema cache/i.test(msg)) {
    return `Não consegui ${verbo}: falta rodar o supabase/schema.sql mais recente no SQL Editor.`;
  }
  return `Não consegui ${verbo}. Tenta de novo em alguns segundos.`;
}

// ---- Sessão (login por e-mail/senha). App exige login; sem sessão não há
// leitura/escrita nas tabelas (RLS por user_id = auth.uid()). ----
function useGcSession() {
  const [session, setSession] = useState(GC_IS_LOCAL ? { user: { id: "demo-local", email: "demo@local" } } : undefined);
  useEffect(() => {
    if (GC_IS_LOCAL) return;
    if (!gcSupabase) { setSession(null); return; }
    gcSupabase.auth.getSession()
      .then(({ data }) => setSession(data.session ?? null))
      .catch((e) => { console.error(e); setSession(prev => prev === undefined ? null : prev); });
    const { data: sub } = gcSupabase.auth.onAuthStateChange((_event, s) => setSession(s ?? null));
    // Watchdog: se o auth travar na inicialização, não deixa o app preso em
    // "Carregando..." pra sempre. Cai pro login depois de alguns segundos.
    const watchdog = setTimeout(() => setSession(prev => prev === undefined ? null : prev), 6000);
    return () => { clearTimeout(watchdog); sub.subscription.unsubscribe(); };
  }, []);
  return session;
}

// ---- Dados (Supabase). Fase 0: ainda sem tabelas — elas entram junto com a
// tela que as usa, nas próximas fases (ver CLAUDE.md > Modelo de dados /
// Roadmap). Por ora só expõe loading/error, já no formato final do hook, pra
// as próximas fases só acrescentarem arrays + verbos aqui dentro. ----
function useGcData(session) {
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);
  return { loading, error, dismissError: () => setError(null) };
}

/* ---------------------------------------------------------------
   PRIMITIVAS DE UI (Modal, Field, Segmented, TabBar, EmptyState) — prefixo
   lb-, copiadas do Letterborgs (fonte das versões completas, o Guitchelin
   ficou com recortes parciais). Sem dependência de i18n aqui.
----------------------------------------------------------------*/
function Field({ label, children, select, wide, headline }) {
  return (
    <label className={"lb-field" + (select ? " select" : "") + (wide ? " wide" : "") + (headline ? " headline" : "")}>
      <span className="lb-field-label">{label}</span>
      {children}
    </label>
  );
}

function Segmented({ options, value, onChange, wrap, pairs, ariaLabel }) {
  return (
    <div className={"lb-segmented" + (wrap ? " wrap" : "") + (pairs ? " pairs" : "")} role="tablist" aria-label={ariaLabel}>
      {options.map(opt => (
        <button key={opt.value} type="button" role="tab" aria-selected={value === opt.value}
          className={(value === opt.value ? "active" : "") + (opt.muted ? " muted" : "")}
          onClick={() => onChange(opt.value)}>
          {opt.icon}{opt.label}
        </button>
      ))}
    </div>
  );
}

function TabBar({ options, value, onChange, ariaLabel }) {
  return (
    <div className="lb-tabbar" role="tablist" aria-label={ariaLabel}>
      {options.map(opt => (
        <button key={opt.value} type="button" role="tab" aria-selected={value === opt.value}
          className={value === opt.value ? "active" : ""} onClick={() => onChange(opt.value)}>
          {opt.label}
        </button>
      ))}
    </div>
  );
}

function Modal({ title, onClose, onRequestClose, children, wide, flush }) {
  const panelRef = useRef(null);
  const requestClose = () => (onRequestClose ? onRequestClose() : onClose());
  const requestCloseRef = useRef(requestClose);
  requestCloseRef.current = requestClose;
  useEffect(() => {
    const onKey = (e) => { if (e.key === "Escape") requestCloseRef.current(); };
    document.addEventListener("keydown", onKey);
    const prevOverflow = document.body.style.overflow;
    document.body.style.overflow = "hidden";
    const panel = panelRef.current;
    const prevFocus = document.activeElement;
    const focusables = panel ? Array.from(panel.querySelectorAll(
      'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'
    )).filter(el => !el.disabled && el.offsetParent !== null) : [];
    if (focusables.length) focusables[0].focus();
    const trap = (e) => {
      if (e.key !== "Tab" || !focusables.length) return;
      const first = focusables[0];
      const last = focusables[focusables.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    };
    document.addEventListener("keydown", trap);
    return () => {
      document.removeEventListener("keydown", onKey);
      document.removeEventListener("keydown", trap);
      document.body.style.overflow = prevOverflow;
      if (prevFocus && typeof prevFocus.focus === "function") prevFocus.focus();
    };
  }, []);
  return ReactDOM.createPortal(
    <div className="lb-modal-overlay" onMouseDown={(e) => { if (e.target === e.currentTarget) requestClose(); }}>
      <div ref={panelRef} className={"lb-modal" + (wide ? " wide" : "")} role="dialog" aria-modal="true" aria-labelledby="lb-modal-title">
        <div className="lb-modal-header">
          <h3 id="lb-modal-title">{title}</h3>
          <button className="lb-icon-btn" onClick={requestClose} aria-label="Fechar"><X size={20} /></button>
        </div>
        <div className={"lb-modal-body" + (flush ? " flush" : "")}>{children}</div>
      </div>
    </div>,
    document.body
  );
}

function EmptyState({ icon, title, message, action }) {
  return (
    <div className="lb-empty">
      {icon}
      <h4>{title}</h4>
      <p>{message}</p>
      {action}
    </div>
  );
}

/* ---------------------------------------------------------------
   SHELL DO APP (topbar, gaveta lateral, nav inferior + FAB contextual).
   Fase 0: telas ainda são placeholders (EmptyState) — cada uma vira de
   verdade na fase correspondente (ver CLAUDE.md > Roadmap).
----------------------------------------------------------------*/
const GC_NAV_ITEMS = [
  { value: "dashboard", label: "Dashboard", icon: (s) => <BarChart3 size={s} />, group: null },
  { value: "receitas", label: "Receitas", icon: (s) => <TrendingUp size={s} />, group: "Financeiro" },
  { value: "despesas", label: "Despesas", icon: (s) => <FileText size={s} />, group: null },
  { value: "recorrencias", label: "Recorrências", icon: (s) => <Repeat size={s} />, group: "Financeiro" },
  { value: "investimentos", label: "Investimentos", icon: (s) => <TrendingUp size={s} />, group: "Financeiro" },
  { value: "sonhos", label: "Lista de Sonhos", icon: (s) => <Gift size={s} />, group: "Listas" },
];
// Texto do FAB contextual: cada aba terá sua própria ação real nas próximas
// fases (ex.: em Despesas -> nova despesa avulsa / nova recorrência). Por
// ora só explica o que está por vir.
function gcFabHint(subTab) {
  switch (subTab) {
    case "despesas": return "Lançar uma despesa avulsa (Compras) ou criar uma recorrência chega na Fase 2.";
    case "receitas": return "Lançar uma receita do mês chega na Fase 1.";
    case "investimentos": return "Registrar o saldo do mês chega na Fase 3.";
    case "sonhos": return "Adicionar um item à Lista de Sonhos chega na Fase 4.";
    default: return "As ações rápidas chegam junto com cada tela, fase a fase.";
  }
}

function App({ session }) {
  const { loading, error, dismissError } = useGcData(session);
  const [subTab, setSubTab] = useState("dashboard");
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const [fabInfo, setFabInfo] = useState(false);

  useEffect(() => {
    if (!sidebarOpen) return;
    const onKey = (e) => { if (e.key === "Escape") setSidebarOpen(false); };
    document.addEventListener("keydown", onKey);
    return () => document.removeEventListener("keydown", onKey);
  }, [sidebarOpen]);

  const openTab = (tab) => { setSidebarOpen(false); setSubTab(tab); };
  const financeiro = GC_NAV_ITEMS.filter(i => i.group === "Financeiro");
  const listas = GC_NAV_ITEMS.filter(i => i.group === "Listas");
  const current = GC_NAV_ITEMS.find(i => i.value === subTab);

  return (
    <>
      {sidebarOpen && <div className="gc-sidebar-backdrop" onClick={() => setSidebarOpen(false)} />}
      <aside className={"gc-sidebar" + (sidebarOpen ? " open" : "")}>
        <nav className="gc-sidebar-nav">
          <span className="gc-sidebar-label">Financeiro</span>
          {financeiro.map(item => (
            <button key={item.value} type="button" className={"gc-sidebar-link" + (subTab === item.value ? " active" : "")} onClick={() => openTab(item.value)}>
              {item.icon(18)} <span>{item.label}</span>
            </button>
          ))}
          <span className="gc-sidebar-label">Listas</span>
          {listas.map(item => (
            <button key={item.value} type="button" className={"gc-sidebar-link" + (subTab === item.value ? " active" : "")} onClick={() => openTab(item.value)}>
              {item.icon(18)} <span>{item.label}</span>
            </button>
          ))}
        </nav>
        <span className="gc-sidebar-spacer" />
        <button type="button" className="gc-sidebar-link gc-sidebar-signout" onClick={() => { if (!GC_IS_LOCAL && gcSupabase) gcSupabase.auth.signOut(); }} aria-label="Sair">
          <LogOut size={18} /> <span>Sair</span>
        </button>
      </aside>
      <div className="gc-app">
        <header className="gc-topbar">
          <button type="button" className={"gc-sidebar-toggle" + (sidebarOpen ? " open" : "")}
            onClick={() => setSidebarOpen(o => !o)}
            aria-label={sidebarOpen ? "Fechar menu" : "Abrir menu"} aria-expanded={sidebarOpen}>
            <GcCoin outline={!sidebarOpen} />
          </button>
          <span className="gc-brand"><strong>Guitcoin</strong></span>
          <span className="gc-topbar-spacer" />
        </header>

        {GC_IS_LOCAL && (
          <div className="gc-demo-banner">Modo local: dados de exemplo. Nada disso vai pro Supabase.</div>
        )}
        {error && (
          <div className="gc-error-banner" role="alert">
            <span>{error}</span>
            <button type="button" className="gc-error-close" onClick={dismissError} aria-label="Fechar aviso"><X size={16} /></button>
          </div>
        )}

        <main className="gc-main">
          {loading ? (
            <p className="lb-hint gc-empty">Carregando...</p>
          ) : (
            <EmptyState
              icon={current ? current.icon(40) : <BarChart3 size={40} />}
              title={current ? current.label : "Guitcoin"}
              message={
                subTab === "dashboard"
                  ? "Big numbers, fluxo de caixa e gráficos chegam na Fase 5."
                  : `Essa tela ainda está em construção (ver Roadmap no CLAUDE.md).`
              }
            />
          )}
        </main>

        <nav className="gc-bottomnav">
          <button type="button" className={"gc-navbtn" + (subTab === "dashboard" ? " active" : "")} onClick={() => setSubTab("dashboard")}>
            <BarChart3 size={20} /><span>Dashboard</span>
          </button>
          <button type="button" className="gc-navfab" onClick={() => setFabInfo(true)} aria-label="Adicionar">
            <Plus size={26} />
          </button>
          <button type="button" className={"gc-navbtn" + (subTab === "despesas" ? " active" : "")} onClick={() => setSubTab("despesas")}>
            <FileText size={20} /><span>Despesas</span>
          </button>
        </nav>

        {fabInfo && (
          <Modal title="Em construção" onClose={() => setFabInfo(false)}>
            <p className="lb-hint">{gcFabHint(subTab)}</p>
          </Modal>
        )}
      </div>
    </>
  );
}

// ---- Login (e-mail/senha). App é de uso pessoal: sem cadastro pela tela,
// a conta já existe no Supabase. ----
function GcLogin() {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);

  const onSubmit = async (e) => {
    e.preventDefault();
    if (!gcSupabase) { setError("Supabase não está configurado ainda (ver CLAUDE.md > Roadmap)."); return; }
    setBusy(true); setError("");
    try {
      const { error } = await gcWithTimeout(
        gcSupabase.auth.signInWithPassword({ email, password }), 15000, "timeout");
      if (error) setError("E-mail ou senha inválidos.");
    } catch (err) {
      console.error(err);
      setError("A conexão com o login travou. Feche o app por completo (não só minimizar) e abra de novo.");
    } finally {
      setBusy(false);
    }
  };

  return (
    <div className="gc-login-screen">
      <form className="gc-login-card" onSubmit={onSubmit}>
        <span className="gc-brand"><GcCoin size={26} /> <strong>Guitcoin</strong></span>
        <Field label="E-mail">
          <input type="email" required autoFocus value={email} onChange={e => setEmail(e.target.value)} />
        </Field>
        <Field label="Senha">
          <input type="password" required value={password} onChange={e => setPassword(e.target.value)} />
        </Field>
        {error && <p className="gc-login-error">{error}</p>}
        <button type="submit" className="lb-btn primary" disabled={busy}>{busy ? "Entrando..." : "Entrar"}</button>
      </form>
    </div>
  );
}

// ---- Raiz: decide entre carregando / login / app, conforme a sessão. ----
function GcRoot() {
  const session = useGcSession();
  if (session === undefined) return <div className="gc-login-screen"><p className="lb-hint">Carregando...</p></div>;
  if (!session) return <GcLogin />;
  return <App session={session} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<GcRoot />);
</script>

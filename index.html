<script>
(function () {
  if (location.hostname !== "localhost" && location.hostname !== "127.0.0.1") return;
  document.documentElement.classList.add("gc-iphone-preview");
  var root = document.getElementById("root");
  var stage = document.createElement("div");
  stage.className = "gc-phone-stage";
  var phone = document.createElement("div");
  phone.className = "gc-phone";
  root.parentNode.insertBefore(stage, root);
  phone.appendChild(root);
  stage.appendChild(phone);
  var fit = function () {
    var s = Math.min(1, (window.innerHeight - 36) / 852, (window.innerWidth - 36) / 393);
    phone.style.transform = "translateZ(0) scale(" + s + ")";
    stage.style.width = (393 * s) + "px";
    stage.style.height = (852 * s) + "px";
  };
  fit();
  window.addEventListener("resize", fit);
})();

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef } = React;

/* ---------------------------------------------------------------
   Guitcoin: app autônomo de controle financeiro pessoal. Estruturado
   seguindo o mesmo padrão de Guitchelin/Letterborgs (arquivo único, sem
   build, Supabase). Persistência isolada no hook useGcData abaixo (as telas
   não sabem de onde vêm os dados). Exige login. Fase 0: só shell + auth,
   ainda sem tabelas/telas de verdade (ver CLAUDE.md > Roadmap).
----------------------------------------------------------------*/

// ---- Ícones (SVG inline, mesmo IconBase da família Gg/Lb) ----
function IconBase({ size = 24, strokeWidth = 2, fill = "none", className, style, children }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke="currentColor"
      strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round"
      className={className} style={style}>{children}</svg>
  );
}
const X = (p) => <IconBase {...p}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></IconBase>;
const Check = (p) => <IconBase {...p}><polyline points="20 6 9 17 4 12"/></IconBase>;
const Plus = (p) => <IconBase {...p}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></IconBase>;
const Pencil = (p) => <IconBase {...p}><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></IconBase>;
const Trash2 = (p) => <IconBase {...p}><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></IconBase>;
const LogOut = (p) => <IconBase {...p}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></IconBase>;
const ChevronDown = (p) => <IconBase {...p}><polyline points="6 9 12 15 18 9"/></IconBase>;
const ChevronLeft = (p) => <IconBase {...p}><polyline points="15 18 9 12 15 6"/></IconBase>;
const ChevronRight = (p) => <IconBase {...p}><polyline points="9 18 15 12 9 6"/></IconBase>;
const Calendar = (p) => <IconBase {...p}><rect x="3" y="4" width="18" height="18" rx="2.5"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></IconBase>;
const BarChart3 = (p) => <IconBase {...p}><rect x="4" y="12" width="4" height="8" rx="1.5" fill="currentColor" stroke="none"/><rect x="10" y="5" width="4" height="15" rx="1.5" fill="currentColor" stroke="none"/><rect x="16" y="9" width="4" height="11" rx="1.5" fill="currentColor" stroke="none"/></IconBase>;
const TrendingUp = (p) => <IconBase {...p}><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></IconBase>;
const FileText = (p) => <IconBase {...p}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></IconBase>;
const Repeat = (p) => <IconBase {...p}><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></IconBase>;
const Gift = (p) => <IconBase {...p}><polyline points="20 12 20 22 4 22 4 12"/><rect x="2" y="7" width="20" height="5"/><line x1="12" y1="22" x2="12" y2="7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></IconBase>;
const Menu = (p) => <IconBase {...p}><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></IconBase>;

// Marca (círculo + cifrão), mesmo papel do GgFlower no Guitchelin: usada no
// topbar e como ícone do botão que abre/fecha a gaveta lateral (outline
// fechado, preenchido aberto).
function GcCoin({ outline = false, size = 22 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none">
      <circle cx="12" cy="12" r="10" fill={outline ? "none" : "var(--gc-accent)"} stroke={outline ? "currentColor" : "var(--gc-accent)"} strokeWidth="1.6" />
      <path d="M14.6 8.5h-4.2a1.9 1.9 0 0 0 0 3.8h3.2a1.9 1.9 0 0 1 0 3.8h-4.5"
        stroke={outline ? "currentColor" : "#fff"} strokeWidth="1.6" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
      <line x1="12" y1="6.1" x2="12" y2="17.9" stroke={outline ? "currentColor" : "#fff"} strokeWidth="1.6" strokeLinecap="round"/>
    </svg>
  );
}

// ---- Helpers ----
let _uid = 0;
function uid() { _uid += 1; return "gc-" + Date.now().toString(36) + "-" + _uid.toString(36); }
function todayISO() {
  const d = new Date();
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}
const MONTH_LABELS = ["Jan", "Fev", "Mar", "Abr", "Mai", "Jun", "Jul", "Ago", "Set", "Out", "Nov", "Dez"];
// competência = "YYYY-MM" (mês de referência de um lançamento/instância).
function competenciaAtual() { return todayISO().slice(0, 7); }
function competenciaLabel(comp) {
  const [y, m] = (comp || "").split("-").map(Number);
  return m ? `${MONTH_LABELS[m - 1]} ${y}` : comp;
}
function gcShiftCompetencia(comp, delta) {
  const [y, m] = comp.split("-").map(Number);
  const d = new Date(y, m - 1 + delta, 1);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
}
function gcFmtMoney(v) {
  return (v || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
}

// ---- Fórmulas de Receita (funções puras, sem React/Supabase) ----
function gcFindIncomeEntry(entries, sourceId, competencia) {
  return entries.find(e => e.sourceId === sourceId && e.competencia === competencia) || null;
}
function gcFindIncomeProjection(projections, ano) {
  return projections.find(p => p.ano === ano) || null;
}
function gcMonthEntriesTotal(entries, competencia) {
  return entries.filter(e => e.competencia === competencia).reduce((s, e) => s + (e.valor || 0), 0);
}
function gcExtraAcumuladoYTD(entries, sources, ano, ateCompetencia) {
  const extraIds = new Set(sources.filter(s => s.tipo === "extra").map(s => s.id));
  return entries
    .filter(e => extraIds.has(e.sourceId) && e.competencia.startsWith(ano + "-") && e.competencia <= ateCompetencia)
    .reduce((s, e) => s + (e.valor || 0), 0);
}
function gcRendaFixaAnualGarantida(projection) {
  return projection ? (projection.rendaFixaMensalEsperada || 0) * 12 : 0;
}
function gcProjecaoTotalAno(rendaFixaAnual, extraAcumuladoYTD) {
  return rendaFixaAnual + extraAcumuladoYTD;
}

// ---- Fórmulas de Despesas/Recorrência (funções puras) ----
const GC_EXPENSE_GROUPS = [
  { value: "casa", label: "Casa" },
  { value: "pessoal", label: "Pessoal" },
  { value: "pix", label: "PIX" },
  { value: "cartao_fixo", label: "Cartão fixo" },
  { value: "compras", label: "Compras" },
];
function gcExpenseGroupLabel(grupo) {
  return (GC_EXPENSE_GROUPS.find(g => g.value === grupo) || {}).label || grupo;
}
// Custo de vida de UMA instância: a parte que é minha de verdade. Uma conta
// dividida com terceiro (minhaParcelaPct = 0) some do custo de vida sem
// deixar de existir/aparecer com seu checkbox de "pago".
function gcCustoInstance(instance) {
  const pct = instance.minhaParcelaPct != null ? instance.minhaParcelaPct : 100;
  return (instance.valor || 0) * pct / 100;
}
function gcInstancesForCompetencia(instances, competencia) {
  return instances.filter(i => i.competencia === competencia);
}
function gcMonthInstancesTotal(instances, competencia) {
  return gcInstancesForCompetencia(instances, competencia).reduce((s, i) => s + (i.valor || 0), 0);
}
function gcCustoMes(instances, competencia) {
  return gcInstancesForCompetencia(instances, competencia).reduce((s, i) => s + gcCustoInstance(i), 0);
}
function gcGroupInstances(instances, competencia) {
  const doMes = gcInstancesForCompetencia(instances, competencia);
  return GC_EXPENSE_GROUPS
    .map(g => {
      const items = doMes.filter(i => i.grupo === g.value).sort((a, b) => (a.descricao || "").localeCompare(b.descricao || ""));
      return { ...g, items, total: items.reduce((s, i) => s + (i.valor || 0), 0) };
    })
    .filter(g => g.items.length > 0);
}
// Uma instância nova gerada a partir de um template (ainda sem id salvo).
function gcNovaInstanciaDeTemplate(t, competencia) {
  return {
    id: uid(), templateId: t.id, grupo: t.grupo, descricao: t.nome, competencia,
    valor: t.valorPadrao || 0, pago: false,
    compartilhado: !!t.compartilhado, compartilhadoCom: t.compartilhadoCom || "",
    minhaParcelaPct: t.minhaParcelaPct != null ? t.minhaParcelaPct : 100,
  };
}
// Geração LAZY das instâncias que faltam, até `competenciaLimite` (nunca
// adianta meses futuros — ver CLAUDE.md/plano). Mensal: todo mês entre
// data_inicio e min(competenciaLimite, data_fim). Anual: só o mês
// mes_cobranca do ano de competenciaLimite.
function gcGenerateMissingInstances(templates, instances, competenciaLimite) {
  const existentes = new Set(instances.map(i => (i.templateId || "") + "|" + i.competencia));
  const novas = [];
  for (const t of templates) {
    if (t.ativo === false || !t.dataInicio) continue;
    if (t.frequencia === "anual") {
      const ano = competenciaLimite.slice(0, 4);
      const comp = `${ano}-${String(t.mesCobranca || 1).padStart(2, "0")}`;
      if (comp > competenciaLimite || comp < t.dataInicio) continue;
      if (t.dataFim && comp > t.dataFim) continue;
      const key = t.id + "|" + comp;
      if (!existentes.has(key)) { novas.push(gcNovaInstanciaDeTemplate(t, comp)); existentes.add(key); }
    } else {
      const fim = t.dataFim && t.dataFim < competenciaLimite ? t.dataFim : competenciaLimite;
      let comp = t.dataInicio;
      let guard = 0;
      while (comp <= fim && guard < 600) {
        const key = t.id + "|" + comp;
        if (!existentes.has(key)) { novas.push(gcNovaInstanciaDeTemplate(t, comp)); existentes.add(key); }
        comp = gcShiftCompetencia(comp, 1);
        guard++;
      }
    }
  }
  return novas;
}

// ---- Fórmulas de Investimentos (funções puras) ----
// A CONFIRMAR COM O GUI: bate exatamente com a planilha
// (saldoEmCaixa/1000*100 ≈ 5177.32% quando saldoEmCaixa = 51773.18), mas o
// significado da base R$1.000 não está documentado em lugar nenhum. Fica
// como constante nomeada e editável até confirmar — nunca embutir a razão
// /1000*100 direto numa função (ver CLAUDE.md > Fórmulas).
const GC_PODER_COMPRA_BASE = 1000;
function gcFindInvestmentSnapshot(snapshots, competencia) {
  return snapshots.find(s => s.competencia === competencia) || null;
}
// Saldo em Caixa = saldo do snapshot mais recente (é um valor que o próprio
// Gui digita todo mês, não é derivado de receitas/despesas — pode até cair,
// ex. um saque).
function gcSaldoEmCaixa(snapshots) {
  if (!snapshots.length) return 0;
  const maisRecente = snapshots.slice().sort((a, b) => a.competencia.localeCompare(b.competencia)).slice(-1)[0];
  return maisRecente.saldo || 0;
}
function gcPoderDeCompra(saldoEmCaixa) {
  return (saldoEmCaixa / GC_PODER_COMPRA_BASE) * 100;
}

// ---- Fórmulas do Dashboard (funções puras) ----
function gcMonthsOfYear(ano) {
  return Array.from({ length: 12 }, (_, i) => `${ano}-${String(i + 1).padStart(2, "0")}`);
}
function gcReceitaPorMes(incomeEntries, ano) {
  return gcMonthsOfYear(ano).map(mes => ({ mes, total: gcMonthEntriesTotal(incomeEntries, mes) }));
}
// "Gastos" no Dashboard usa o custo pós-divisão (mesma fórmula do Custo de
// Vida) — uma conta dividida com terceiro não deveria inflar o fluxo de
// caixa pessoal, mesmo comportamento que a planilha original tinha ao
// zerar as células "bruno".
function gcCustoPorMes(expenseInstances, ano) {
  return gcMonthsOfYear(ano).map(mes => ({ mes, total: gcCustoMes(expenseInstances, mes) }));
}
function gcSaldoLiquidoPorMes(receitaPorMes, custoPorMes) {
  return receitaPorMes.map((r, i) => ({ mes: r.mes, total: r.total - custoPorMes[i].total }));
}
function gcFaturamentoAnual(incomeEntries, ano) {
  return gcReceitaPorMes(incomeEntries, ano).reduce((s, m) => s + m.total, 0);
}
function gcCustoDeVidaAnual(expenseInstances, ano) {
  return gcCustoPorMes(expenseInstances, ano).reduce((s, m) => s + m.total, 0);
}
function gcTaxaDePoupanca(faturamentoAnual, custoDeVidaAnual) {
  return faturamentoAnual > 0 ? (faturamentoAnual - custoDeVidaAnual) / faturamentoAnual : 0;
}
function gcMediaMensalDeGastos(custoDeVidaAnual) {
  return custoDeVidaAnual / 12;
}
// Investimentos é um SALDO (net worth), não um fluxo: um mês sem snapshot
// novo carrega o último valor conhecido adiante (mesmo raciocínio de
// gcSaldoEmCaixa, mês a mês).
function gcInvestimentosPorMes(snapshots, ano) {
  const ordenados = snapshots.slice().sort((a, b) => a.competencia.localeCompare(b.competencia));
  return gcMonthsOfYear(ano).map(mes => {
    const conhecido = ordenados.filter(s => s.competencia <= mes).slice(-1)[0];
    return { mes, total: conhecido ? conhecido.saldo : 0 };
  });
}

// ---- Fórmulas de Lista de Sonhos (funções puras) ----
const GC_WISHLIST_CATEGORIES = ["CASA", "LUNA", "VESTUÁRIO", "TECH", "CARE", "MISC"];
// Agrupa por categoria (só os ainda não comprados contam no subtotal/total,
// mesmo espírito do "SubTotal"/"Total" da planilha), preservando a ordem
// das categorias seed e anexando categorias custom no fim.
function gcWishlistGroups(items) {
  const ativos = items.filter(i => !i.comprado);
  const extras = Array.from(new Set(items.map(i => i.categoria))).filter(c => !GC_WISHLIST_CATEGORIES.includes(c));
  const categorias = [...GC_WISHLIST_CATEGORIES, ...extras];
  const groups = categorias
    .map(categoria => {
      const its = ativos.filter(i => i.categoria === categoria).sort((a, b) => (a.produto || "").localeCompare(b.produto || ""));
      return { categoria, items: its, subtotal: its.reduce((s, i) => s + (i.preco || 0), 0) };
    })
    .filter(g => g.items.length > 0);
  const total = groups.reduce((s, g) => s + g.subtotal, 0);
  return { groups, total };
}
// Preview local: localhost entra direto no app com dados fictícios, sem
// gravar no Supabase de produção. Em guitcoin.vercel.app isso fica off.
const GC_IS_LOCAL = ["localhost", "127.0.0.1"].includes(location.hostname);

// ---- Cliente Supabase (auth + dados). TODO: preencher com o projeto
// próprio do Guitcoin depois de provisionado no painel (ver CLAUDE.md >
// Roadmap) — hoje são placeholders, então fora do localhost o login não vai
// funcionar até isso ser feito. ----
const GC_SUPABASE_URL = "https://SEU-PROJETO.supabase.co";
const GC_SUPABASE_ANON_KEY = "SUA-ANON-KEY-AQUI";
// "lock" passthrough: o supabase-js usa navigator.locks pra coordenar o
// refresh do token, mas em alguns navegadores iOS/PWA esse lock trava e o
// getSession() nunca resolve (app preso em "Carregando..."). App de um
// usuário só, sem múltiplas abas concorrentes: passar direto é seguro e
// evita a trava (mesmo workaround do Guitchelin).
const gcAuthLock = async (_name, _acquireTimeout, fn) => fn();
const gcSupabase = window.supabase && !GC_IS_LOCAL
  ? window.supabase.createClient(GC_SUPABASE_URL, GC_SUPABASE_ANON_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, lock: gcAuthLock },
    })
  : null;

// Corre uma promessa contra um timeout. Auth do supabase-js pode travar sem
// nunca rejeitar (deadlock do navigator.locks); isso garante que a tela não
// fique presa pra sempre.
function gcWithTimeout(promise, ms, label) {
  let t;
  const timeout = new Promise((_, reject) => { t = setTimeout(() => reject(new Error(label || "timeout")), ms); });
  return Promise.race([promise, timeout]).finally(() => clearTimeout(t));
}

// Traduz o erro cru do Supabase/Postgres numa dica acionável em pt-BR.
function gcWriteErrorMsg(error, verbo) {
  const msg = String((error && error.message) || error || "");
  if (/row-level security/i.test(msg)) {
    return `Não consegui ${verbo}: parece que a sessão expirou. Saia e entre de novo.`;
  }
  if (/does not exist|could not find|schema cache/i.test(msg)) {
    return `Não consegui ${verbo}: falta rodar o supabase/schema.sql mais recente no SQL Editor.`;
  }
  return `Não consegui ${verbo}. Tenta de novo em alguns segundos.`;
}

// ---- Sessão (login por e-mail/senha). App exige login; sem sessão não há
// leitura/escrita nas tabelas (RLS por user_id = auth.uid()). ----
function useGcSession() {
  const [session, setSession] = useState(GC_IS_LOCAL ? { user: { id: "demo-local", email: "demo@local" } } : undefined);
  useEffect(() => {
    if (GC_IS_LOCAL) return;
    if (!gcSupabase) { setSession(null); return; }
    gcSupabase.auth.getSession()
      .then(({ data }) => setSession(data.session ?? null))
      .catch((e) => { console.error(e); setSession(prev => prev === undefined ? null : prev); });
    const { data: sub } = gcSupabase.auth.onAuthStateChange((_event, s) => setSession(s ?? null));
    // Watchdog: se o auth travar na inicialização, não deixa o app preso em
    // "Carregando..." pra sempre. Cai pro login depois de alguns segundos.
    const watchdog = setTimeout(() => setSession(prev => prev === undefined ? null : prev), 6000);
    return () => { clearTimeout(watchdog); sub.subscription.unsubscribe(); };
  }, []);
  return session;
}

// ---- Mapeamento de linhas (Supabase snake_case <-> JS camelCase). Cada
// tabela ganha seu par gcRowToX/gcXToRow, todo campo traduzido à mão (mesmo
// padrão do Guitchelin). ----
const gcRowToIncomeSource = (row) => ({ id: row.id, nome: row.nome, tipo: row.tipo || "work", ativo: row.ativo !== false, ordem: row.ordem || 0 });
const gcIncomeSourceToRow = (s) => ({ id: s.id, nome: s.nome, tipo: s.tipo || "work", ativo: s.ativo !== false, ordem: s.ordem || 0 });
const gcRowToIncomeEntry = (row) => ({ id: row.id, sourceId: row.source_id, competencia: row.competencia, valor: Number(row.valor) || 0 });
const gcIncomeEntryToRow = (e) => ({ id: e.id, source_id: e.sourceId, competencia: e.competencia, valor: e.valor || 0 });
const gcRowToIncomeProjection = (row) => ({ id: row.id, ano: String(row.ano), rendaFixaMensalEsperada: Number(row.renda_fixa_mensal_esperada) || 0 });
const gcIncomeProjectionToRow = (p) => ({ id: p.id, ano: Number(p.ano), renda_fixa_mensal_esperada: p.rendaFixaMensalEsperada || 0 });
const gcRowToExpenseTemplate = (row) => ({
  id: row.id, nome: row.nome, grupo: row.grupo, frequencia: row.frequencia || "mensal",
  mesCobranca: row.mes_cobranca || null, diaVencimento: row.dia_vencimento || null,
  valorPadrao: Number(row.valor_padrao) || 0, compartilhado: !!row.compartilhado,

  ativo: row.ativo !== false, dataInicio: row.data_inicio, dataFim: row.data_fim || null,
  observacao: row.observacao || "",
});
const gcExpenseTemplateToRow = (t) => ({
  id: t.id, nome: t.nome, grupo: t.grupo, frequencia: t.frequencia || "mensal",
  mes_cobranca: t.mesCobranca || null, dia_vencimento: t.diaVencimento || null,

const gcRowToExpenseInstance = (row) => ({
  id: row.id, templateId: row.template_id || null, grupo: row.grupo, descricao: row.descricao,
  competencia: row.competencia, valor: Number(row.valor) || 0, pago: !!row.pago,

const gcExpenseInstanceToRow = (i) => ({

const gcRowToInvestmentSnapshot = (row) => ({ id: row.id, competencia: row.competencia, saldo: Number(row.saldo) || 0, observacao: row.observacao || "" });
const gcInvestmentSnapshotToRow = (s) => ({ id: s.id, competencia: s.competencia, saldo: s.saldo || 0, observacao: s.observacao || null });
const gcRowToWishlistItem = (row) => ({

// ---- Dados (Supabase: tabelas de Receita nesta fase; Despesas/
// Recorrências/Investimentos/Sonhos entram nas próximas). Isolado aqui: as
// telas só conhecem saveIncomeSource/deleteIncomeSource/saveIncomeEntry/
// deleteIncomeEntry/saveIncomeProjection e os arrays incomeSources/
// incomeEntries/incomeProjections. ----
function useGcData(session) {
  const [incomeSources, setIncomeSources] = useState(GC_IS_LOCAL ? GC_DEMO_DATA.incomeSources : []);
  const [incomeEntries, setIncomeEntries] = useState(GC_IS_LOCAL ? GC_DEMO_DATA.incomeEntries : []);
  const [incomeProjections, setIncomeProjections] = useState(GC_IS_LOCAL ? GC_DEMO_DATA.incomeProjections : []);
  const [expenseTemplates, setExpenseTemplates] = useState(GC_IS_LOCAL ? GC_DEMO_DATA.expenseTemplates : []);
  // Em modo demo, já nasce com as instâncias que a própria geração lazy
  // criaria (mesma função usada em produção) + as compras avulsas seed —
  // serve de teste vivo do motor de recorrência a cada load da página.
  const [expenseInstances, setExpenseInstances] = useState(() => {
    if (!GC_IS_LOCAL) return [];
    const avulsas = GC_DEMO_DATA.expenseInstancesAvulsas || [];
    const geradas = gcGenerateMissingInstances(GC_DEMO_DATA.expenseTemplates, avulsas, competenciaAtual());
    return [...avulsas, ...geradas];
  });
  const [investmentSnapshots, setInvestmentSnapshots] = useState(GC_IS_LOCAL ? GC_DEMO_DATA.investmentSnapshots : []);
  const [wishlistItems, setWishlistItems] = useState(GC_IS_LOCAL ? GC_DEMO_DATA.wishlistItems : []);
  const [loading, setLoading] = useState(!GC_IS_LOCAL);
  const [error, setError] = useState(null);

  const loadData = async () => {
    if (GC_IS_LOCAL || !gcSupabase) { setLoading(false); return; }
    setLoading(true);
    try {
      const [srcRes, entRes, projRes, tplRes, instRes, invRes, wishRes] = await Promise.all([
        gcSupabase.from("income_sources").select("*").order("ordem", { ascending: true }),
        gcSupabase.from("income_entries").select("*").order("competencia", { ascending: true }),
        gcSupabase.from("income_projections").select("*").order("ano", { ascending: true }),
        gcSupabase.from("expense_templates").select("*").order("nome", { ascending: true }),
        gcSupabase.from("expense_instances").select("*").order("competencia", { ascending: true }),
        gcSupabase.from("investment_snapshots").select("*").order("competencia", { ascending: true }),
        gcSupabase.from("wishlist_items").select("*").order("produto", { ascending: true }),
      ]);
      if (srcRes.error) throw srcRes.error;
      if (entRes.error) throw entRes.error;
      if (projRes.error) throw projRes.error;
      if (tplRes.error) throw tplRes.error;
      if (instRes.error) throw instRes.error;
      if (invRes.error) throw invRes.error;
      if (wishRes.error) throw wishRes.error;
      const templates = (tplRes.data || []).map(gcRowToExpenseTemplate);
      let instances = (instRes.data || []).map(gcRowToExpenseInstance);
      // Geração lazy: cria só as instâncias que faltam até o mês atual e já
      // grava de volta, pra não repetir o cálculo em todo load.
      const novas = gcGenerateMissingInstances(templates, instances, competenciaAtual());
      if (novas.length) {
        const { error: genErr } = await gcSupabase.from("expense_instances").upsert(novas.map(gcExpenseInstanceToRow));
        if (genErr) console.error(genErr);
        else instances = [...instances, ...novas];
      }
      setIncomeSources((srcRes.data || []).map(gcRowToIncomeSource));
      setIncomeEntries((entRes.data || []).map(gcRowToIncomeEntry));
      setIncomeProjections((projRes.data || []).map(gcRowToIncomeProjection));
      setExpenseTemplates(templates);
      setExpenseInstances(instances);
      setInvestmentSnapshots((invRes.data || []).map(gcRowToInvestmentSnapshot));
      setWishlistItems((wishRes.data || []).map(gcRowToWishlistItem));
    } catch (err) {
      console.error(err);
      setError(gcWriteErrorMsg(err, "carregar os dados"));
    } finally {
      setLoading(false);
    }
  };

  useEffect(() => { loadData(); }, [session]);

  const saveIncomeSource = async (source) => {
    setIncomeSources(prev => prev.some(s => s.id === source.id) ? prev.map(s => s.id === source.id ? source : s) : [...prev, source]);
    if (GC_IS_LOCAL) return true;
    const { error: err } = await gcSupabase.from("income_sources").upsert(gcIncomeSourceToRow(source));
    if (err) { console.error(err); setError(gcWriteErrorMsg(err, "salvar a fonte de receita")); await loadData(); return false; }
    return true;
  };

  const deleteIncomeSource = async (id) => {
    setIncomeSources(prev => prev.filter(s => s.id !== id));
    setIncomeEntries(prev => prev.filter(e => e.sourceId !== id));
    if (GC_IS_LOCAL) return true;
    const { error: err } = await gcSupabase.from("income_sources").delete().eq("id", id);
    if (err) { console.error(err); setError(gcWriteErrorMsg(err, "excluir a fonte de receita")); await loadData(); return false; }
    return true;
  };

  const saveIncomeEntry = async (entry) => {
    setIncomeEntries(prev => prev.some(e => e.id === entry.id) ? prev.map(e => e.id === entry.id ? entry : e) : [...prev, entry]);
    if (GC_IS_LOCAL) return true;
    const { error: err } = await gcSupabase.from("income_entries").upsert(gcIncomeEntryToRow(entry));
    if (err) { console.error(err); setError(gcWriteErrorMsg(err, "salvar a receita do mês")); await loadData(); return false; }
    return true;
  };

  const deleteIncomeEntry = async (id) => {
    setIncomeEntries(prev => prev.filter(e => e.id !== id));
    if (GC_IS_LOCAL) return true;
    const { error: err } = await gcSupabase.from("income_entries").delete().eq("id", id);
    if (err) { console.error(err); setError(gcWriteErrorMsg(err, "excluir a receita do mês")); await loadData(); return false; }
    return true;
  };

  const saveIncomeProjection = async (projection) => {
    setIncomeProjections(prev => prev.some(p => p.id === projection.id) ? prev.map(p => p.id === projection.id ? projection : p) : [...prev, projection]);
    if (GC_IS_LOCAL) return true;
    const { error: err } = await gcSupabase.from("income_projections").upsert(gcIncomeProjectionToRow(projection));
    if (err) { console.error(err); setError(gcWriteErrorMsg(err, "salvar a projeção")); await loadData(); return false; }
    return true;
  };

  const saveExpenseTemplate = async (t) => {
    setExpenseTemplates(prev => prev.some(x => x.id === t.id) ? prev.map(x => x.id === t.id ? t : x) : [...prev, t]);
    if (GC_IS_LOCAL) return true;
    const { error: err } = await gcSupabase.from("expense_templates").upsert(gcExpenseTemplateToRow(t));
    if (err) { console.error(err); setError(gcWriteErrorMsg(err, "salvar a recorrência")); await loadData(); return false; }
    return true;
  };

  // Apagar um template não apaga o histórico já gerado: as instâncias ficam
  // órfãs (templateId null), igual ao "on delete set null" da FK no banco.
  const deleteExpenseTemplate = async (id) => {
    setExpenseTemplates(prev => prev.filter(t => t.id !== id));
    setExpenseInstances(prev => prev.map(i => i.templateId === id ? { ...i, templateId: null } : i));
    if (GC_IS_LOCAL) return true;
    const { error: err } = await gcSupabase.from("expense_templates").delete().eq("id", id);
    if (err) { console.error(err); setError(gcWriteErrorMsg(err, "excluir a recorrência")); await loadData(); return false; }
    return true;
  };

  const saveExpenseInstance = async (inst) => {
    setExpenseInstances(prev => prev.some(i => i.id === inst.id) ? prev.map(i => i.id === inst.id ? inst : i) : [...prev, inst]);
    if (GC_IS_LOCAL) return true;
    const { error: err } = await gcSupabase.from("expense_instances").upsert(gcExpenseInstanceToRow(inst));
    if (err) { console.error(err); setError(gcWriteErrorMsg(err, "salvar a despesa")); await loadData(); return false; }
    return true;
  };

  const deleteExpenseInstance = async (id) => {
    setExpenseInstances(prev => prev.filter(i => i.id !== id));
    if (GC_IS_LOCAL) return true;
    const { error: err } = await gcSupabase.from("expense_instances").delete().eq("id", id);
    if (err) { console.error(err); setError(gcWriteErrorMsg(err, "excluir a despesa")); await loadData(); return false; }
    return true;
  };

  const toggleExpenseInstancePago = async (id) => {
    let next = null;
    setExpenseInstances(prev => prev.map(i => { if (i.id !== id) return i; next = { ...i, pago: !i.pago }; return next; }));
    if (GC_IS_LOCAL) return true;
    if (!next) return false;
    const { error: err } = await gcSupabase.from("expense_instances").update({ pago: next.pago }).eq("id", id);
    if (err) { console.error(err); setError(gcWriteErrorMsg(err, "marcar a despesa como paga")); await loadData(); return false; }
    return true;
  };

  const saveInvestmentSnapshot = async (snapshot) => {
    setInvestmentSnapshots(prev => prev.some(s => s.id === snapshot.id) ? prev.map(s => s.id === snapshot.id ? snapshot : s) : [...prev, snapshot]);
    if (GC_IS_LOCAL) return true;
    const { error: err } = await gcSupabase.from("investment_snapshots").upsert(gcInvestmentSnapshotToRow(snapshot));
    if (err) { console.error(err); setError(gcWriteErrorMsg(err, "salvar o saldo")); await loadData(); return false; }
    return true;
  };

  const saveWishlistItem = async (item) => {
    setWishlistItems(prev => prev.some(i => i.id === item.id) ? prev.map(i => i.id === item.id ? item : i) : [...prev, item]);
    if (GC_IS_LOCAL) return true;
    const { error: err } = await gcSupabase.from("wishlist_items").upsert(gcWishlistItemToRow(item));
    if (err) { console.error(err); setError(gcWriteErrorMsg(err, "salvar o item")); await loadData(); return false; }
    return true;
  };

  const deleteWishlistItem = async (id) => {
    setWishlistItems(prev => prev.filter(i => i.id !== id));
    if (GC_IS_LOCAL) return true;
    const { error: err } = await gcSupabase.from("wishlist_items").delete().eq("id", id);
    if (err) { console.error(err); setError(gcWriteErrorMsg(err, "excluir o item")); await loadData(); return false; }
    return true;
  };

  const toggleWishlistComprado = async (id) => {
    let next = null;
    setWishlistItems(prev => prev.map(i => { if (i.id !== id) return i; next = { ...i, comprado: !i.comprado }; return next; }));
    if (GC_IS_LOCAL) return true;
    if (!next) return false;
    const { error: err } = await gcSupabase.from("wishlist_items").update({ comprado: next.comprado }).eq("id", id);
    if (err) { console.error(err); setError(gcWriteErrorMsg(err, "marcar o item como comprado")); await loadData(); return false; }
    return true;
  };

  return {
    incomeSources, incomeEntries, incomeProjections, expenseTemplates, expenseInstances, investmentSnapshots, wishlistItems,
    loading, error, dismissError: () => setError(null),
    saveIncomeSource, deleteIncomeSource, saveIncomeEntry, deleteIncomeEntry, saveIncomeProjection,
    saveExpenseTemplate, deleteExpenseTemplate, saveExpenseInstance, deleteExpenseInstance, toggleExpenseInstancePago,
    saveInvestmentSnapshot, saveWishlistItem, deleteWishlistItem, toggleWishlistComprado,
  };
}

function Field({ label, children, select, wide, headline }) {
  return (
    <label className={"lb-field" + (select ? " select" : "") + (wide ? " wide" : "") + (headline ? " headline" : "")}>
      <span className="lb-field-label">{label}</span>
      {children}
    </label>
  );
}

function Segmented({ options, value, onChange, wrap, pairs, ariaLabel }) {
  return (
    <div className={"lb-segmented" + (wrap ? " wrap" : "") + (pairs ? " pairs" : "")} role="tablist" aria-label={ariaLabel}>
      {options.map(opt => (
        <button key={opt.value} type="button" role="tab" aria-selected={value === opt.value}
          className={(value === opt.value ? "active" : "") + (opt.muted ? " muted" : "")}
          onClick={() => onChange(opt.value)}>
          {opt.icon}{opt.label}
        </button>
      ))}
    </div>
  );
}

function TabBar({ options, value, onChange, ariaLabel }) {
  return (
    <div className="lb-tabbar" role="tablist" aria-label={ariaLabel}>
      {options.map(opt => (
        <button key={opt.value} type="button" role="tab" aria-selected={value === opt.value}
          className={value === opt.value ? "active" : ""} onClick={() => onChange(opt.value)}>
          {opt.label}
        </button>
      ))}
    </div>
  );
}

function Modal({ title, onClose, onRequestClose, children, wide, flush }) {
  const panelRef = useRef(null);
  const requestClose = () => (onRequestClose ? onRequestClose() : onClose());
  const requestCloseRef = useRef(requestClose);
  requestCloseRef.current = requestClose;
  useEffect(() => {
    const onKey = (e) => { if (e.key === "Escape") requestCloseRef.current(); };
    document.addEventListener("keydown", onKey);
    const prevOverflow = document.body.style.overflow;
    document.body.style.overflow = "hidden";
    const panel = panelRef.current;
    const prevFocus = document.activeElement;
    const focusables = panel ? Array.from(panel.querySelectorAll(
      'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'
    )).filter(el => !el.disabled && el.offsetParent !== null) : [];
    if (focusables.length) focusables[0].focus();
    const trap = (e) => {
      if (e.key !== "Tab" || !focusables.length) return;
      const first = focusables[0];
      const last = focusables[focusables.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    };
    document.addEventListener("keydown", trap);
    return () => {
      document.removeEventListener("keydown", onKey);
      document.removeEventListener("keydown", trap);
      document.body.style.overflow = prevOverflow;
      if (prevFocus && typeof prevFocus.focus === "function") prevFocus.focus();
    };
  }, []);
  return ReactDOM.createPortal(
    <div className="lb-modal-overlay" onMouseDown={(e) => { if (e.target === e.currentTarget) requestClose(); }}>
      <div ref={panelRef} className={"lb-modal" + (wide ? " wide" : "")} role="dialog" aria-modal="true" aria-labelledby="lb-modal-title">
        <div className="lb-modal-header">
          <h3 id="lb-modal-title">{title}</h3>
          <button className="lb-icon-btn" onClick={requestClose} aria-label="Fechar"><X size={20} /></button>
        </div>
        <div className={"lb-modal-body" + (flush ? " flush" : "")}>{children}</div>
      </div>
    </div>,
    document.body
  );
}

function EmptyState({ icon, title, message, action }) {
  return (
    <div className="lb-empty">
      {icon}
      <h4>{title}</h4>
      <p>{message}</p>
      {action}
    </div>
  );
}

   TELA: RECEITAS (Fase 1) — cards de projeção do ano + grid mensal por
   fonte de receita, com seletor de mês (mesmo padrão de mês que Despesas
   vai usar na Fase 2).
----------------------------------------------------------------*/
function GcReceitas({ sources, entries, projections, competencia, onCompetenciaChange, onEditSource, onEditProjection, onSaveEntryValor }) {
  const ano = competencia.slice(0, 4);
  const projection = gcFindIncomeProjection(projections, ano);
  const rendaFixaAnual = gcRendaFixaAnualGarantida(projection);
  const extraYTD = gcExtraAcumuladoYTD(entries, sources, ano, competencia);
  const projecaoTotal = gcProjecaoTotalAno(rendaFixaAnual, extraYTD);
  const ativos = sources.filter(s => s.ativo !== false).slice().sort((a, b) => (a.ordem || 0) - (b.ordem || 0));
  const ativoIds = new Set(ativos.map(s => s.id));
  const monthTotal = gcMonthEntriesTotal(entries.filter(e => ativoIds.has(e.sourceId)), competencia);

  return (
    <div className="gc-screen">
      <div className="gc-statcards">
        <button type="button" className="gc-statcard" onClick={onEditProjection}>
          <span className="gc-statcard-num gc-money">{gcFmtMoney(rendaFixaAnual)}</span>
          <span className="gc-statcard-cap">Renda Fixa Anual (Garantida)</span>
        </button>
        <div className="gc-statcard">
          <span className="gc-statcard-num gc-money">{gcFmtMoney(extraYTD)}</span>
          <span className="gc-statcard-cap">Extra Acumulado (YTD)</span>
        </div>
        <div className="gc-statcard">
          <span className="gc-statcard-num gc-money">{gcFmtMoney(projecaoTotal)}</span>
          <span className="gc-statcard-cap">Projeção Total {ano}</span>
        </div>
      </div>

      <div className="gc-month-switch">
        <button type="button" className="lb-icon-btn" onClick={() => onCompetenciaChange(gcShiftCompetencia(competencia, -1))} aria-label="Mês anterior"><ChevronLeft size={20} /></button>
        <span className="gc-month-label">{competenciaLabel(competencia)}</span>
        <button type="button" className="lb-icon-btn" onClick={() => onCompetenciaChange(gcShiftCompetencia(competencia, 1))} aria-label="Próximo mês"><ChevronRight size={20} /></button>
      </div>

      {ativos.length === 0 ? (
        <EmptyState icon={<TrendingUp size={40} />} title="Nenhuma fonte de receita" message="Toque no + pra cadastrar seu salário ou uma renda extra." />
      ) : (
        <div className="gc-list">
          {ativos.map(source => {
            const entry = gcFindIncomeEntry(entries, source.id, competencia);
            return (
              <div className="gc-list-row" key={source.id}>
                <button type="button" className="gc-list-row-main" onClick={() => onEditSource(source)}>
                  <span className={"gc-pill" + (source.tipo === "extra" ? " gc-pill-gold" : "")}>{source.tipo === "extra" ? "Extra" : "Fixa"}</span>
                  <span className="gc-list-row-title">{source.nome}</span>
                </button>
                <input
                  type="number" inputMode="decimal" step="0.01" placeholder="0,00"
                  className="gc-row-valor gc-money"
                  defaultValue={entry ? entry.valor : ""}
                  key={competencia + source.id + (entry ? entry.id : "novo")}
                  onBlur={(e) => {
                    const valor = parseFloat(e.target.value.replace(",", ".")) || 0;
                    if (!entry && valor === 0) return;
                    onSaveEntryValor(source.id, competencia, entry ? entry.id : null, valor);
                  }}
                />
              </div>
            );
          })}
          <div className="gc-list-total">
            <span>Total do mês</span>
            <span className="gc-money">{gcFmtMoney(monthTotal)}</span>
          </div>
        </div>
      )}
    </div>
  );
}

   Dashboard (Saldo em Caixa / Poder de Compra).
----------------------------------------------------------------*/
function GcInvestimentos({ snapshots, competencia, onCompetenciaChange, onSaveSaldo }) {
  const saldoEmCaixa = gcSaldoEmCaixa(snapshots);
  const poderDeCompra = gcPoderDeCompra(saldoEmCaixa);
  const atual = gcFindInvestmentSnapshot(snapshots, competencia);
  const historico = snapshots.slice().sort((a, b) => b.competencia.localeCompare(a.competencia));

  return (
    <div className="gc-screen">
      <div className="gc-statcards gc-statcards-2">
        <div className="gc-statcard">
          <span className="gc-statcard-num gc-money">{gcFmtMoney(saldoEmCaixa)}</span>
          <span className="gc-statcard-cap">Saldo em Caixa</span>
        </div>
        <div className="gc-statcard">
          <span className="gc-statcard-num">{poderDeCompra.toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}%</span>
          <span className="gc-statcard-cap">Poder de Compra</span>
        </div>
      </div>

      <div className="gc-month-switch">
        <button type="button" className="lb-icon-btn" onClick={() => onCompetenciaChange(gcShiftCompetencia(competencia, -1))} aria-label="Mês anterior"><ChevronLeft size={20} /></button>
        <span className="gc-month-label">{competenciaLabel(competencia)}</span>
        <button type="button" className="lb-icon-btn" onClick={() => onCompetenciaChange(gcShiftCompetencia(competencia, 1))} aria-label="Próximo mês"><ChevronRight size={20} /></button>
      </div>

      <Field label={`Saldo em ${competenciaLabel(competencia)}`}>
        <input
          type="number" inputMode="decimal" step="0.01" placeholder="0,00" className="gc-money"
          defaultValue={atual ? atual.saldo : ""}
          key={competencia + (atual ? atual.id : "novo")}
          onBlur={(e) => {
            const saldo = parseFloat(e.target.value.replace(",", ".")) || 0;
            if (!atual && saldo === 0) return;
            onSaveSaldo(competencia, atual ? atual.id : null, saldo);
          }}
        />
      </Field>

      {historico.length === 0 ? (
        <EmptyState icon={<TrendingUp size={40} />} title="Nenhum saldo registrado" message="Lance o saldo do mês acima ou pelo +." />
      ) : (
        <div className="gc-list">
          {historico.map(s => (
            <div className="gc-list-row" key={s.id}>
              <span className="gc-list-row-title" style={{ flex: 1 }}>{competenciaLabel(s.competencia)}</span>
              <span className="gc-row-valor-display gc-money">{gcFmtMoney(s.saldo)}</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ---------------------------------------------------------------
   TELA: DASHBOARD (Fase 5) — big numbers + fluxo de caixa + gráficos, tudo
   derivado das outras telas (nenhum dado próprio). Gráficos em SVG/CSS
   puro, sem biblioteca (mesmo espírito do GgColumns do Guitchelin).
----------------------------------------------------------------*/
function GcColumnsGrouped({ items }) {
  const max = Math.max(...items.flatMap(i => [i.a, i.b]), 1);
  return (
    <div className="gc-cols">
      {items.map(it => (
        <div className="gc-col" key={it.label}>
          <div className="gc-col-track gc-col-track-grouped">
            <div className="gc-col-fill gc-col-fill-a" style={{ height: it.a ? Math.max((it.a / max) * 100, 4) + "%" : "0%" }} />
            <div className="gc-col-fill gc-col-fill-b" style={{ height: it.b ? Math.max((it.b / max) * 100, 4) + "%" : "0%" }} />
          </div>
          <span className="gc-col-label">{it.label}</span>
        </div>
      ))}
    </div>
  );
}

function GcAreaChart({ items }) {
  const max = Math.max(...items.map(i => i.value), 1);
  const w = 300, h = 120, pad = 6;
  const stepX = items.length > 1 ? (w - pad * 2) / (items.length - 1) : 0;
  const pontos = items.map((it, i) => [pad + i * stepX, pad + (h - pad * 2) * (1 - it.value / max)]);
  const linha = pontos.map((p, i) => (i === 0 ? "M" : "L") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  const area = `${linha} L ${pontos[pontos.length - 1][0].toFixed(1)} ${h - pad} L ${pontos[0][0].toFixed(1)} ${h - pad} Z`;
  return (
    <svg viewBox={`0 0 ${w} ${h}`} className="gc-area-chart" preserveAspectRatio="none">
      <path d={area} className="gc-area-fill" />
      <path d={linha} className="gc-area-line" fill="none" />
    </svg>
  );
}

          </button>

          <span className="gc-topbar-spacer" />
        </header>

        {GC_IS_LOCAL && (
          <div className="gc-demo-banner">Modo local: dados de exemplo. Nada disso vai pro Supabase.</div>
        )}
        {error && (
          <div className="gc-error-banner" role="alert">
            <span>{error}</span>
            <button type="button" className="gc-error-close" onClick={dismissError} aria-label="Fechar aviso"><X size={16} /></button>
          </div>
        )}

        <main className="gc-main">
          {loading ? (
            <p className="lb-hint gc-empty">Carregando...</p>
          ) : subTab === "dashboard" ? (
            <GcDashboard
              incomeEntries={incomeEntries} expenseInstances={expenseInstances} investmentSnapshots={investmentSnapshots}
              ano={dashboardAno} onAnoChange={setDashboardAno}
            />
          ) : subTab === "receitas" ? (

              onEditSource={(s) => setSourceForm({ initial: s })}

              onSaveEntryValor={(sourceId, competencia, existingId, valor) => saveIncomeEntry({ id: existingId || uid(), sourceId, competencia, valor })}

          ) : subTab === "despesas" ? (
            <GcDespesas
              instances={expenseInstances} competencia={despesasComp} onCompetenciaChange={setDespesasComp}

              onEditInstance={(inst) => setInstanceForm({ initial: inst })}

            <GcSonhos items={wishlistItems} onToggleComprado={toggleWishlistComprado} onEdit={(item) => setWishlistForm({ initial: item })} />

            <EmptyState
              icon={current ? current.icon(40) : <BarChart3 size={40} />}
              title={current ? current.label : "Guitcoin"}

        <nav className="gc-bottomnav">
          <button type="button" className={"gc-navbtn" + (subTab === "dashboard" ? " active" : "")} onClick={() => setSubTab("dashboard")}>

          <button type="button" className="gc-navfab"

              if (subTab === "receitas") setSourceForm({ initial: null });

              else if (subTab === "recorrencias") setTemplateForm({ initial: null });

          </button>
          <button type="button" className={"gc-navbtn" + (subTab === "despesas" ? " active" : "")} onClick={() => setSubTab("despesas")}>
            <FileText size={20} /><span>Despesas</span>
          </button>
        </nav>

        {fabInfo && (
          <Modal title="Em construção" onClose={() => setFabInfo(false)}>
            <p className="lb-hint">{gcFabHint(subTab)}</p>
          </Modal>
        )}
        {sourceForm && (
          <GcIncomeSourceForm initial={sourceForm.initial} onSave={saveIncomeSource} onDelete={deleteIncomeSource} onClose={() => setSourceForm(null)} />
        )}
        {projectionForm && (
          <GcIncomeProjectionForm ano={projectionForm.ano} initial={projectionForm.initial} onSave={saveIncomeProjection} onClose={() => setProjectionForm(null)} />
        )}
        {despesasFabMenu && (
          <Modal title="O que você quer lançar?" onClose={() => setDespesasFabMenu(false)}>
            <div className="gc-fab-menu">
              <button type="button" className="gc-fab-option" onClick={() => { setDespesasFabMenu(false); setInstanceForm({ initial: null }); }}>
                <FileText size={22} />
                <span className="gc-fab-option-txt"><strong>Despesa avulsa</strong><small>Uma compra pontual (Compras)</small></span>
              </button>
              <button type="button" className="gc-fab-option" onClick={() => { setDespesasFabMenu(false); setTemplateForm({ initial: null }); }}>
                <Repeat size={22} />
                <span className="gc-fab-option-txt"><strong>Nova recorrência</strong><small>Conta fixa, assinatura ou cobrança anual</small></span>
              </button>
            </div>
          </Modal>
        )}
        {instanceForm && (
          <GcExpenseInstanceForm initial={instanceForm.initial} competencia={despesasComp} onSave={saveExpenseInstance} onDelete={deleteExpenseInstance} onClose={() => setInstanceForm(null)} />
        )}
        {templateForm && (
          <GcExpenseTemplateForm initial={templateForm.initial} onSave={saveExpenseTemplate} onDelete={deleteExpenseTemplate} onClose={() => setTemplateForm(null)} />
        )}
        {snapshotForm && (
          <GcInvestmentSnapshotForm initialCompetencia={snapshotForm.initialCompetencia} snapshots={investmentSnapshots} onSave={saveInvestmentSnapshot} onClose={() => setSnapshotForm(null)} />
        )}
        {wishlistForm && (
          <GcWishlistItemForm initial={wishlistForm.initial} onSave={saveWishlistItem} onDelete={deleteWishlistItem} onClose={() => setWishlistForm(null)} />
        )}
      </div>
    </>
  );
}

// ---- Login (e-mail/senha). App é de uso pessoal: sem cadastro pela tela,
// a conta já existe no Supabase. ----
function GcLogin() {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);

  const onSubmit = async (e) => {
    e.preventDefault();
    if (!gcSupabase) { setError("Supabase não está configurado ainda (ver CLAUDE.md > Roadmap)."); return; }
    setBusy(true); setError("");
    try {
      const { error } = await gcWithTimeout(
        gcSupabase.auth.signInWithPassword({ email, password }), 15000, "timeout");
      if (error) setError("E-mail ou senha inválidos.");
    } catch (err) {
      console.error(err);
      setError("A conexão com o login travou. Feche o app por completo (não só minimizar) e abra de novo.");
    } finally {
      setBusy(false);
    }
  };

  return (
    <div className="gc-login-screen">
      <form className="gc-login-card" onSubmit={onSubmit}>
        <span className="gc-brand"><GcCoin size={26} /> <strong>Guitcoin</strong></span>
        <Field label="E-mail">
          <input type="email" required autoFocus value={email} onChange={e => setEmail(e.target.value)} />
        </Field>
        <Field label="Senha">
          <input type="password" required value={password} onChange={e => setPassword(e.target.value)} />
        </Field>
        {error && <p className="gc-login-error">{error}</p>}
        <button type="submit" className="lb-btn primary" disabled={busy}>{busy ? "Entrando..." : "Entrar"}</button>
      </form>
    </div>
  );
}

// ---- Raiz: decide entre carregando / login / app, conforme a sessão. ----
function GcRoot() {
  const session = useGcSession();
  if (session === undefined) return <div className="gc-login-screen"><p className="lb-hint">Carregando...</p></div>;
  if (!session) return <GcLogin />;
  return <App session={session} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<GcRoot />);

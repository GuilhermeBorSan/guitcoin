          <input value={categoria} onChange={e => setCategoria(e.target.value)} list="gc-wishlist-categorias" placeholder="Ex.: TECH" />
          <datalist id="gc-wishlist-categorias">
            {GC_WISHLIST_CATEGORIES.map(c => <option key={c} value={c} />)}
          </datalist>
        </Field>
        <Field label="Preço (opcional)">
          <input type="number" inputMode="decimal" step="0.01" value={preco} onChange={e => setPreco(e.target.value)} />
        </Field>
        <Field label="Marca">
          <input value={marca} onChange={e => setMarca(e.target.value)} />
        </Field>
        <Field label="Modelo">
          <input value={modelo} onChange={e => setModelo(e.target.value)} />
        </Field>
        <Field label="Link" wide>
          <input value={link} onChange={e => setLink(e.target.value)} placeholder="https://..." />
        </Field>
        <Field label="Observação" wide>
          <input value={obs} onChange={e => setObs(e.target.value)} />
        </Field>
        <Field label="Já comprei?" wide>
          <Segmented options={[{ value: "nao", label: "Ainda não" }, { value: "sim", label: "Já comprei" }]} value={comprado ? "sim" : "nao"} onChange={v => setComprado(v === "sim")} />
        </Field>
        <div className="lb-form-footer">
          <div className="lb-form-actions">
            <div className="lb-form-actions-left">
              {initial && (
                <button type="button" className="lb-btn danger icon-only" aria-label="Excluir" onClick={async () => {
                  if (!confirm("Excluir este item da lista?")) return;
                  const ok = await onDelete(initial.id);
                  if (ok !== false) onClose();
                }}>
                  <Trash2 size={16} />
                </button>
              )}
            </div>
            <div className="lb-form-actions-right">
              <button type="button" className="lb-btn ghost" onClick={onClose}>Cancelar</button>
              <button type="submit" className="lb-btn primary" disabled={busy}>{busy ? "Salvando..." : "Salvar"}</button>
            </div>
          </div>
        </div>
      </form>
    </Modal>
  );
}

/* ---------------------------------------------------------------
   TELA: DASHBOARD (Fase 5) — big numbers + fluxo de caixa + gráficos, tudo
   derivado das outras telas (nenhum dado próprio). Gráficos em SVG/CSS
   puro, sem biblioteca (mesmo espírito do GgColumns do Guitchelin).
----------------------------------------------------------------*/
function GcColumnsGrouped({ items }) {
  const max = Math.max(...items.flatMap(i => [i.a, i.b]), 1);
  return (
    <div className="gc-cols">
      {items.map(it => (
        <div className="gc-col" key={it.label}>
          <div className="gc-col-track gc-col-track-grouped">
            <div className="gc-col-fill gc-col-fill-a" style={{ height: it.a ? Math.max((it.a / max) * 100, 4) + "%" : "0%" }} />
            <div className="gc-col-fill gc-col-fill-b" style={{ height: it.b ? Math.max((it.b / max) * 100, 4) + "%" : "0%" }} />
          </div>
          <span className="gc-col-label">{it.label}</span>
        </div>
      ))}
    </div>
  );
}

function GcAreaChart({ items, showValues, janIndex, onClick }) {
  const max = Math.max(...items.map(i => i.value), 1);
  const w = 300, h = 120, padX = 6, padTop = showValues ? 16 : 6, padBottom = 6;
  const stepX = items.length > 1 ? (w - padX * 2) / (items.length - 1) : 0;
  const pontos = items.map((it, i) => [padX + i * stepX, padTop + (h - padTop - padBottom) * (1 - it.value / max)]);
  const linha = pontos.map((p, i) => (i === 0 ? "M" : "L") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  const area = `${linha} L ${pontos[pontos.length - 1][0].toFixed(1)} ${h - padBottom} L ${pontos[0][0].toFixed(1)} ${h - padBottom} Z`;
  const padPct = (padX / w) * 100;
  const lastIdx = pontos.length - 1;
  const wrapProps = onClick ? {
    role: "button",
    tabIndex: 0,
    onClick,
    onKeyDown: (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); onClick(); } },
    className: "gc-area-wrap gc-area-clickable",
    "aria-label": "Abrir Investimentos",
  } : { className: "gc-area-wrap" };
  return (
    <div {...wrapProps}>
      <div className="gc-area-plot">
        <svg viewBox={`0 0 ${w} ${h}`} className="gc-area-chart" preserveAspectRatio="none">
          <path d={area} className="gc-area-fill" />
          <path d={linha} className="gc-area-line" fill="none" />
          {pontos.map((p, i) => (
            <circle key={items[i].id || items[i].label} cx={p[0]} cy={p[1]} r="2.2" className="gc-area-dot" />
          ))}
        </svg>
        {showValues && lastIdx >= 0 && (
          <div className="gc-area-values" aria-hidden="true">
            {janIndex != null && janIndex >= 0 && janIndex !== lastIdx && (
              <span
                className="gc-area-values-jan"
                style={{ left: (pontos[janIndex][0] / w) * 100 + "%", top: (pontos[janIndex][1] / h) * 100 + "%" }}
              >{gcFmtMoneyCompact(items[janIndex].value)}</span>
            )}
            <span
              style={{ left: (pontos[lastIdx][0] / w) * 100 + "%", top: (pontos[lastIdx][1] / h) * 100 + "%" }}
            >{gcFmtMoneyCompact(items[lastIdx].value)}</span>
          </div>
        )}
      </div>
      <div className="gc-area-labels" style={{ paddingLeft: padPct + "%", paddingRight: padPct + "%" }}>
        {items.map(it => (
          <span key={it.id || it.label} className="gc-area-label">{it.label}</span>
        ))}
      </div>
    </div>
  );
}

function GcDashboard({ incomeEntries, expenseInstances, investmentSnapshots, ano, onOpenInvestimentos }) {
  const receitaPorMes = gcReceitaPorMes(incomeEntries, ano);
  const custoPorMes = gcCustoPorMes(expenseInstances, ano);
  const saldoLiquidoPorMes = gcSaldoLiquidoPorMes(receitaPorMes, custoPorMes);
  const investimentosPorMes = gcInvestimentosPorMes(investmentSnapshots, ano);
  // Gráfico só até o último mês com snapshot real do ano (sem carregar saldo adiante).
  const lastSnapAno = investmentSnapshots
    .filter(s => (s.competencia || "").startsWith(String(ano) + "-"))
    .sort((a, b) => a.competencia.localeCompare(b.competencia))
    .slice(-1)[0];
  const lastChartIdx = lastSnapAno ? parseInt(lastSnapAno.competencia.slice(5), 10) - 1 : -1;
  const investChartItems = lastChartIdx >= 0
    ? investimentosPorMes.slice(0, lastChartIdx + 1).map((s, i) => ({ label: MONTH_LABELS[i], value: s.total }))
    : [];
  const faturamentoAnual = gcFaturamentoAnual(incomeEntries, ano);
  const custoDeVidaAnual = gcCustoDeVidaAnual(expenseInstances, ano);
  const taxaDePoupanca = gcTaxaDePoupanca(faturamentoAnual, custoDeVidaAnual);
  const mediaMensalDeGastos = gcMediaMensalDeGastos(custoDeVidaAnual);
  const saldoEmCaixa = gcSaldoEmCaixa(investmentSnapshots);
  const poderDeCompra = gcPoderDeCompra(saldoEmCaixa);
  const fmtPct = (v) => v.toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + "%";

  return (
    <div className="gc-screen">
      <div className="gc-statcards gc-statcards-3">
        <div className="gc-statcard">
          <span className="gc-statcard-num gc-money">{gcFmtMoney(faturamentoAnual)}</span>
          <span className="gc-statcard-cap">Faturamento Anual</span>
        </div>
        <div className="gc-statcard">
          <span className="gc-statcard-num gc-money">{gcFmtMoney(saldoEmCaixa)}</span>
          <span className="gc-statcard-cap">Total Investido</span>
        </div>
        <div className="gc-statcard">
          <span className="gc-statcard-num">{fmtPct(poderDeCompra)}</span>
          <span className="gc-statcard-cap">Poder de Compra</span>
        </div>
        <div className="gc-statcard">
          <span className="gc-statcard-num gc-money gc-num-red">{gcFmtMoney(custoDeVidaAnual)}</span>
          <span className="gc-statcard-cap">Custo de Vida Anual</span>
        </div>
        <div className="gc-statcard">
          <span className="gc-statcard-num">{fmtPct(taxaDePoupanca * 100)}</span>
          <span className="gc-statcard-cap">Taxa de Poupança</span>
        </div>
        <div className="gc-statcard">
          <span className="gc-statcard-num gc-money">{gcFmtMoney(mediaMensalDeGastos)}</span>
          <span className="gc-statcard-cap">Média Mensal de Gastos</span>
        </div>
      </div>

      <div className="gc-dashboard-section">
        <h3 className="gc-section-title">Receita × Gastos</h3>
        <GcColumnsGrouped items={receitaPorMes.map((r, i) => ({ label: MONTH_LABELS[i], a: r.total, b: custoPorMes[i].total }))} />
        <div className="gc-legend">
          <span className="gc-legend-item"><span className="gc-legend-swatch gc-legend-a" /> Receita</span>
          <span className="gc-legend-item"><span className="gc-legend-swatch gc-legend-b" /> Gastos</span>
        </div>
      </div>

      <div className="gc-dashboard-section">
        <h3 className="gc-section-title">Fluxo de Caixa</h3>
        <div className="gc-cashflow-wrap">
          <table className="gc-cashflow-table">
            <thead>
              <tr>
                <th></th>
                <th>Receita</th>
                <th>Gastos</th>
                <th>Saldo líquido</th>
              </tr>
            </thead>
            <tbody>
              {MONTH_LABELS.map((m, i) => (
                <tr key={m}>
                  <td>{m}</td>
                  <td className="gc-money">{gcFmtMoney(receitaPorMes[i].total)}</td>
                  <td className="gc-money">{gcFmtMoney(custoPorMes[i].total)}</td>
                  <td className={"gc-money" + (saldoLiquidoPorMes[i].total < 0 ? " gc-num-red" : "")}>{gcFmtMoney(saldoLiquidoPorMes[i].total)}</td>
                </tr>
              ))}
              <tr className="gc-cashflow-total">
                <td>Total</td>
                <td className="gc-money">{gcFmtMoney(faturamentoAnual)}</td>
                <td className="gc-money">{gcFmtMoney(custoDeVidaAnual)}</td>
                <td className="gc-money">{gcFmtMoney(faturamentoAnual - custoDeVidaAnual)}</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      {investChartItems.length >= 2 && (
        <div className="gc-dashboard-section">
          <h3 className="gc-section-title">Evolução dos Investimentos</h3>
          <GcAreaChart
            items={investChartItems}
            showValues
            janIndex={0}
            onClick={onOpenInvestimentos}
          />
        </div>
      )}
    </div>
  );
}

/* ---------------------------------------------------------------
   TELA: CONTA (bar/restaurante) — calculadora de sessão (some ao
   recarregar). Itens mandam sobre o total manual; taxa opcional
   (default 10%, % editável); divisão igual pelo nº de pessoas.
----------------------------------------------------------------*/
function GcConta({
  itens, setItens, totalManual, setTotalManual, comTaxa, setComTaxa,
  taxaPct, setTaxaPct, pessoas, setPessoas, itemForm, setItemForm,
}) {
  const temItens = itens.length > 0;
  const base = gcContaBase(itens, parseFloat(String(totalManual).replace(",", ".")) || 0);
  const taxa = gcContaTaxa(base, comTaxa, taxaPct);
  const total = gcContaTotal(base, taxa);
  const nPessoas = Math.max(1, parseInt(pessoas, 10) || 1);
  const porPessoa = gcContaPorPessoa(total, nPessoas);

  const saveItem = (item) => {
    setItens(prev => {
      const i = prev.findIndex(x => x.id === item.id);
      if (i >= 0) {
        const next = prev.slice();
        next[i] = item;
        return next;
      }
      return prev.concat(item);
    });
  };
  const deleteItem = (id) => setItens(prev => prev.filter(x => x.id !== id));

  return (
    <div className="gc-screen">
      <div className={"gc-statcards" + (nPessoas > 1 ? " gc-statcards-2" : " gc-statcards-1")}>
        <div className="gc-statcard">
          <span className="gc-statcard-num gc-money">{gcFmtMoney(total)}</span>
          <span className="gc-statcard-cap">{comTaxa ? "Total com taxa" : "Total"}</span>
        </div>
        {nPessoas > 1 && (
          <div className="gc-statcard">
            <span className="gc-statcard-num gc-money">{gcFmtMoney(porPessoa)}</span>
            <span className="gc-statcard-cap">Por pessoa ({nPessoas})</span>
          </div>
        )}
      </div>

      <div className="gc-group">
        <div className="gc-group-header">
          <span>Itens</span>
          {temItens && <span className="gc-money">{gcFmtMoney(base)}</span>}
        </div>
        {temItens ? (
          <div className="gc-list">
            {itens.map(item => (
              <div className="gc-list-row" key={item.id}>
                <button type="button" className="gc-list-row-main" onClick={() => setItemForm({ initial: item })}>
                  <span className="gc-list-row-title">{item.nome}</span>
                </button>
                <span className="gc-row-valor-display gc-money">{gcFmtMoney(item.valor)}</span>
              </div>
            ))}
          </div>
        ) : (
          <p className="lb-hint gc-conta-hint">Toque no + pra adicionar o que você consumiu, ou informe o total da conta abaixo.</p>
        )}
      </div>

      <div className="gc-conta-fields">
        <Field label="Total da conta" wide>
          <input
            type="number" inputMode="decimal" step="0.01" min="0"
            value={totalManual}
            onChange={e => setTotalManual(e.target.value)}
            disabled={temItens}
            placeholder={temItens ? "Usando soma dos itens" : "0,00"}
          />
        </Field>
        {temItens && <p className="lb-hint gc-conta-hint-left">Limpe os itens pra usar o total da conta.</p>}

        <div className="gc-conta-taxa-row">
          <button type="button" className={"gc-checkbox" + (comTaxa ? " checked" : "")}
            onClick={() => setComTaxa(v => !v)} aria-pressed={comTaxa} aria-label="Incluir taxa de serviço">
            {comTaxa && <Check size={14} />}
          </button>
          <span className="gc-conta-taxa-label">Taxa de serviço</span>
          <input
            className="gc-conta-taxa-pct"
            type="number" inputMode="decimal" step="0.1" min="0"
            value={taxaPct}
            onChange={e => setTaxaPct(e.target.value)}
            disabled={!comTaxa}
            aria-label="Percentual da taxa"
          />
          <span className="gc-conta-taxa-suffix">%</span>
        </div>

        <Field label="Dividir por (pessoas)" wide>
          <input type="number" inputMode="numeric" min="1" step="1" value={pessoas}
            onChange={e => setPessoas(e.target.value)} />
        </Field>
      </div>

      {(base > 0 || taxa > 0) && (
        <div className="gc-list">
          <div className="gc-list-row">
            <span className="gc-list-row-title">Base</span>
            <span className="gc-row-valor-display gc-money">{gcFmtMoney(base)}</span>
          </div>
          {comTaxa && (
            <div className="gc-list-row">
              <span className="gc-list-row-title">Taxa ({taxaPct || 0}%)</span>
              <span className="gc-row-valor-display gc-money">{gcFmtMoney(taxa)}</span>
            </div>
          )}
          <div className="gc-list-total">
            <span>Total</span>
            <span className="gc-money">{gcFmtMoney(total)}</span>
          </div>
          {nPessoas > 1 && (
            <div className="gc-list-total gc-conta-por-pessoa">
              <span>Por pessoa</span>
              <span className="gc-money">{gcFmtMoney(porPessoa)}</span>
            </div>
          )}
        </div>
      )}

      {itemForm && (
        <GcContaItemForm
          initial={itemForm.initial}
          onSave={saveItem}
          onDelete={deleteItem}
          onClose={() => setItemForm(null)}
        />
      )}
    </div>
  );
}

function GcContaItemForm({ initial, onSave, onDelete, onClose }) {
  const [nome, setNome] = useState(initial ? initial.nome : "");
  const [valor, setValor] = useState(initial && initial.valor != null ? String(initial.valor) : "");

  const submit = (e) => {
    e.preventDefault();
    const v = parseFloat(String(valor).replace(",", "."));
    if (!Number.isFinite(v) || v < 0) return;
    onSave({
      id: initial ? initial.id : uid(),
      nome: nome.trim() || "Item",
      valor: v,
    });
    onClose();
  };

  return (
    <Modal title={initial ? "Editar item" : "Novo item"} onClose={onClose}>
      <form onSubmit={submit} className="lb-form-grid">
        <Field label="Nome" wide>
          <input value={nome} onChange={e => setNome(e.target.value)} placeholder="Ex.: chopp, burger" autoFocus />
        </Field>
        <Field label="Valor" wide>
          <input type="number" inputMode="decimal" step="0.01" min="0" value={valor} onChange={e => setValor(e.target.value)} required />
        </Field>
        <div className="lb-form-footer">
          <div className="lb-form-actions">
            <div className="lb-form-actions-left">
              {initial && (
                <button type="button" className="lb-btn danger icon-only" aria-label="Excluir" onClick={() => {
                  if (!confirm("Remover este item?")) return;
                  onDelete(initial.id);
                  onClose();
                }}>
                  <Trash2 size={16} />
                </button>
              )}
            </div>
            <div className="lb-form-actions-right">
              <button type="button" className="lb-btn ghost" onClick={onClose}>Cancelar</button>
              <button type="submit" className="lb-btn primary">Salvar</button>
            </div>
          </div>
        </div>
      </form>
    </Modal>
  );
}

/* ---------------------------------------------------------------
   TELA: VIAGENS — lista de viagens + detalhe (gastos por dia/categoria,
   saldos e acertos entre participantes). Adaptação móvel da planilha
   "Gastos_BA_ARRCAR_2024" (categoria × dia): aqui o dia é um seletor, não
   uma coluna de grid, pra caber na tela do celular; o conteúdo (categorias,
   totais, divisão) é o mesmo.
----------------------------------------------------------------*/
function GcViagens({ trips, tripExpenses, onOpen }) {
  const ordenadas = trips.slice().sort((a, b) => (b.dataInicio || "").localeCompare(a.dataInicio || ""));
  return (
    <div className="gc-screen">
      {trips.length === 0 ? (
        <EmptyState icon={<Plane size={40} />} title="Nenhuma viagem" message="Toque no + pra cadastrar uma viagem e começar a dividir os gastos." />
      ) : (
        <div className="gc-list">
          {ordenadas.map(t => {
            const gastos = tripExpenses.filter(e => e.tripId === t.id);
            const total = gcTripTotalGeral(gastos);
            const participantesLabel = (t.participantes || []).map(p => p.nome).filter(Boolean).join(", ");
            return (
              <button type="button" className="gc-list-row gc-list-row-btn" key={t.id} onClick={() => onOpen(t.id)}>
                <span className="gc-list-row-title gc-list-row-grow">
                  <span className="gc-list-row-title-line"><span>{t.nome}</span></span>
                  {(t.destino || participantesLabel) && (
                    <small className="gc-list-row-sub">{[t.destino, participantesLabel].filter(Boolean).join(" · ")}</small>
                  )}
                </span>
                <span className="gc-row-valor-display gc-money">{gcFmtMoney(total)}</span>
              </button>
            );
          })}
        </div>
      )}
    </div>
  );
}

function GcViagemDetalhe({ trip, expenses, dia, setDia, onBack, onEditTrip, onEditExpense }) {
  if (!trip) return null;
  const numDias = Math.max(1, trip.numDias || 1);
  const totalGeral = gcTripTotalGeral(expenses);
  const totalDia = gcTripTotalDia(expenses, dia);
  const saldos = gcTripSaldos(trip, expenses);
  const acertos = gcTripAcertos(saldos);
  const { groups } = gcTripGroupsDoDia(expenses, dia, GC_TRIP_EXPENSE_CATEGORIES);

  return (
    <div className="gc-screen">
      <div className="gc-trip-header">
        <button type="button" className="lb-icon-btn" onClick={onBack} aria-label="Voltar para Viagens"><ChevronLeft size={22} /></button>
        <span className="gc-trip-header-txt">
          <strong>{trip.nome}</strong>
          {trip.destino && <small>{trip.destino}</small>}
        </span>
        <button type="button" className="lb-icon-btn" onClick={onEditTrip} aria-label="Editar viagem"><Pencil size={18} /></button>
      </div>

      <div className="gc-statcards gc-statcards-2">
        <div className="gc-statcard">
          <span className="gc-statcard-num gc-money">{gcFmtMoney(totalGeral)}</span>
          <span className="gc-statcard-cap">Total da viagem</span>
        </div>
        <div className="gc-statcard">
          <span className="gc-statcard-num gc-money">{gcFmtMoney(totalDia)}</span>
          <span className="gc-statcard-cap">Total · {gcTripDiaLabel(dia)}</span>
        </div>
      </div>

      {saldos.length > 0 && (
        <div className="gc-trip-participantes">
          {saldos.map(p => (
            <div className="gc-trip-participante" key={p.id}>
              <span className="gc-trip-participante-dot" style={{ background: p.cor || "var(--gc-accent)" }} />
              <span className="gc-trip-participante-nome">{p.nome}</span>
              <span className="gc-trip-participante-vals">
                <small>Disponível {gcFmtMoney(p.disponivel)}</small>
                <small className={gcDeltaTone(p.saldo)}>
                  {p.saldo >= 0 ? `A receber ${gcFmtMoney(p.saldo)}` : `Deve ${gcFmtMoney(-p.saldo)}`}
                </small>
              </span>
            </div>
          ))}
        </div>
      )}

      {acertos.length > 0 && (
        <div className="gc-group">
          <div className="gc-group-header"><span>Acertos</span></div>
          <div className="gc-list">
            {acertos.map((a, i) => (
              <div className="gc-list-row" key={i}>
                <span className="gc-list-row-title">{a.de} → {a.para}</span>
                <span className="gc-row-valor-display gc-money">{gcFmtMoney(a.valor)}</span>
              </div>
            ))}
          </div>
        </div>
      )}

      <div className="gc-month-switch">
        <button type="button" className="lb-icon-btn" disabled={dia <= -1} onClick={() => setDia(Math.max(-1, dia - 1))} aria-label="Dia anterior"><ChevronLeft size={20} /></button>
        <span className="gc-month-label">{gcTripDiaLabel(dia)}</span>
        <button type="button" className="lb-icon-btn" disabled={dia >= numDias - 1} onClick={() => setDia(Math.min(numDias - 1, dia + 1))} aria-label="Próximo dia"><ChevronRight size={20} /></button>
      </div>

      {groups.length === 0 ? (
        <EmptyState icon={<Plane size={40} />} title="Nenhum gasto neste dia" message="Toque no + pra registrar um gasto." />
      ) : (
        groups.map(g => (
          <div className="gc-group" key={g.categoria}>
            <div className="gc-group-header">
              <span>{g.categoria}</span>
              <span className="gc-money">{gcFmtMoney(g.subtotal)}</span>
            </div>
            <div className="gc-list">
              {g.items.map(item => {
                const pagador = (trip.participantes || []).find(p => p.id === item.pagoPorId);
                return (
                  <button type="button" className="gc-list-row gc-list-row-btn" key={item.id} onClick={() => onEditExpense(item)}>
                    <span className="gc-list-row-title gc-list-row-grow">
                      <span>{item.descricao || g.categoria}</span>
                      {pagador && <small className="gc-list-row-sub">Pago por {pagador.nome}</small>}
                    </span>
                    <span className="gc-row-valor-display gc-money">{gcFmtMoney(item.valor)}</span>
                  </button>
                );
              })}
            </div>
          </div>
        ))
      )}
    </div>
  );
}

function GcTripForm({ initial, onSave, onDelete, onClose }) {
  const [nome, setNome] = useState(initial ? initial.nome : "");
  const [destino, setDestino] = useState(initial ? initial.destino || "" : "");
  const [dataInicio, setDataInicio] = useState(initial ? initial.dataInicio || "" : "");
  const [dataFim, setDataFim] = useState(initial ? initial.dataFim || "" : "");
  const [numDias, setNumDias] = useState(initial ? String(initial.numDias || 7) : "7");
  const [participantes, setParticipantes] = useState(
    initial && initial.participantes && initial.participantes.length
      ? initial.participantes.map(p => ({ ...p, disponivel: p.disponivel != null ? String(p.disponivel) : "" }))
      : [{ id: uid(), nome: "", cor: GC_TRIP_COLORS[0], disponivel: "" }]
  );
  const [busy, setBusy] = useState(false);

  const addParticipante = () => setParticipantes(prev => [...prev, { id: uid(), nome: "", cor: GC_TRIP_COLORS[prev.length % GC_TRIP_COLORS.length], disponivel: "" }]);
  const removeParticipante = (id) => setParticipantes(prev => prev.filter(p => p.id !== id));
  const updateParticipante = (id, field, value) => setParticipantes(prev => prev.map(p => p.id === id ? { ...p, [field]: value } : p));

  const submit = async (e) => {
    e.preventDefault();
    if (!nome.trim()) return;
    setBusy(true);
    const ok = await onSave({
      id: initial ? initial.id : uid(),
      nome: nome.trim(),
      destino: destino.trim(),
      dataInicio: dataInicio || null,
      dataFim: dataFim || null,
      numDias: Math.max(1, parseInt(numDias, 10) || 7),
      participantes: participantes
        .filter(p => p.nome.trim())
        .map(p => ({ id: p.id, nome: p.nome.trim(), cor: p.cor, disponivel: parseFloat(String(p.disponivel).replace(",", ".")) || 0 })),
      arquivada: initial ? !!initial.arquivada : false,
      ordem: initial ? initial.ordem || 0 : 0,
    });
    setBusy(false);
    if (ok !== false) onClose();
  };

  return (
    <Modal title={initial ? "Editar viagem" : "Nova viagem"} onClose={onClose} wide>
      <form onSubmit={submit} className="lb-form-grid">
        <Field label="Nome da viagem" wide>
          <input value={nome} onChange={e => setNome(e.target.value)} placeholder="Ex.: Bahia — Arraial" autoFocus required />
        </Field>
        <Field label="Destino (opcional)" wide>
          <input value={destino} onChange={e => setDestino(e.target.value)} />
        </Field>
        <Field label="Início (opcional)">
          <input type="date" value={dataInicio} onChange={e => setDataInicio(e.target.value)} />
        </Field>
        <Field label="Fim (opcional)">
          <input type="date" value={dataFim} onChange={e => setDataFim(e.target.value)} />
        </Field>
        <Field label="Dias da viagem (Dia 0 a Dia N)" wide>
          <input type="number" inputMode="numeric" min="1" step="1" value={numDias} onChange={e => setNumDias(e.target.value)} />
        </Field>

        <div className="gc-trip-participantes-wrap">
          <span className="lb-field-label">Participantes</span>
          <div className="gc-trip-participantes-form">
            {participantes.map(p => (
              <div className="gc-trip-participante-row" key={p.id}>
                <input
                  className="gc-trip-participante-cor" type="color" value={p.cor}
                  onChange={e => updateParticipante(p.id, "cor", e.target.value)}
                  aria-label={`Cor de ${p.nome || "participante"}`}
                />
                <input placeholder="Nome" value={p.nome} onChange={e => updateParticipante(p.id, "nome", e.target.value)} />
                <input
                  type="number" inputMode="decimal" step="0.01" placeholder="Disponível"
                  value={p.disponivel} onChange={e => updateParticipante(p.id, "disponivel", e.target.value)}
                />
                {participantes.length > 1 && (
                  <button type="button" className="lb-icon-btn" onClick={() => removeParticipante(p.id)} aria-label="Remover participante"><X size={16} /></button>
                )}
              </div>
            ))}
          </div>
          <button type="button" className="lb-btn ghost gc-btn-sm" onClick={addParticipante}><Plus size={14} /> Participante</button>
        </div>

        <div className="lb-form-footer">
          <div className="lb-form-actions">
            <div className="lb-form-actions-left">
              {initial && (
                <button type="button" className="lb-btn danger icon-only" aria-label="Excluir" onClick={async () => {
                  if (!confirm("Excluir esta viagem e todos os gastos dela?")) return;
                  const ok = await onDelete(initial.id);
                  if (ok !== false) onClose();
                }}>
                  <Trash2 size={16} />
                </button>
              )}
            </div>
            <div className="lb-form-actions-right">
              <button type="button" className="lb-btn ghost" onClick={onClose}>Cancelar</button>
              <button type="submit" className="lb-btn primary" disabled={busy}>{busy ? "Salvando..." : "Salvar"}</button>
            </div>
          </div>
        </div>
      </form>
    </Modal>
  );
}

function GcTripExpenseForm({ initial, tripId, dia, numDias, existingCategorias, participantes, onSave, onDelete, onClose }) {
  const [categoria, setCategoria] = useState(initial ? initial.categoria : (existingCategorias[0] || ""));
  const [descricao, setDescricao] = useState(initial ? initial.descricao || "" : "");
  const [valor, setValor] = useState(initial && initial.valor != null ? String(initial.valor) : "");
  const [diaSel, setDiaSel] = useState(initial ? initial.dia : dia);
  const [pagoPorId, setPagoPorId] = useState(initial ? initial.pagoPorId || "" : (participantes[0] ? participantes[0].id : ""));
  const [busy, setBusy] = useState(false);

  const submit = async (e) => {
    e.preventDefault();
    const v = parseFloat(String(valor).replace(",", "."));
    if (!Number.isFinite(v) || v < 0) return;
    setBusy(true);
    const ok = await onSave({
      id: initial ? initial.id : uid(),
      tripId,
      categoria: (categoria || "Outros").trim() || "Outros",
      descricao: descricao.trim(),
      dia: diaSel,
      valor: v,
      pagoPorId: pagoPorId || null,
    });
    setBusy(false);
    if (ok !== false) onClose();
  };

  return (
    <Modal title={initial ? "Editar gasto" : "Novo gasto"} onClose={onClose}>
      <form onSubmit={submit} className="lb-form-grid">
        <Field label="Categoria" wide>
          <input value={categoria} onChange={e => setCategoria(e.target.value)} list="gc-trip-categorias" placeholder="Ex.: Hospedagem" required autoFocus />
          <datalist id="gc-trip-categorias">
            {existingCategorias.map(c => <option key={c} value={c} />)}
          </datalist>
        </Field>
        <Field label="Descrição (opcional)" wide>
          <input value={descricao} onChange={e => setDescricao(e.target.value)} />
        </Field>
        <Field label="Dia" select>
          <select value={diaSel} onChange={e => setDiaSel(Number(e.target.value))}>
            <option value={-1}>Pré-viagem</option>
            {Array.from({ length: numDias }, (_, i) => i).map(i => <option key={i} value={i}>Dia {i}</option>)}
          </select>
        </Field>
        <Field label="Valor">
          <input type="number" inputMode="decimal" step="0.01" min="0" value={valor} onChange={e => setValor(e.target.value)} required />
        </Field>
        <Field label="Pago por" wide select>
          <select value={pagoPorId} onChange={e => setPagoPorId(e.target.value)}>
            <option value="">—</option>
            {participantes.map(p => <option key={p.id} value={p.id}>{p.nome}</option>)}
          </select>
        </Field>
        <div className="lb-form-footer">
          <div className="lb-form-actions">
            <div className="lb-form-actions-left">
              {initial && (
                <button type="button" className="lb-btn danger icon-only" aria-label="Excluir" onClick={async () => {
                  if (!confirm("Excluir este gasto?")) return;
                  const ok = await onDelete(initial.id);
                  if (ok !== false) onClose();
                }}>
                  <Trash2 size={16} />
                </button>
              )}
            </div>
            <div className="lb-form-actions-right">
              <button type="button" className="lb-btn ghost" onClick={onClose}>Cancelar</button>
              <button type="submit" className="lb-btn primary" disabled={busy}>{busy ? "Salvando..." : "Salvar"}</button>
            </div>
          </div>
        </div>
      </form>
    </Modal>
  );
}

/* ---------------------------------------------------------------
   SHELL DO APP (topbar + hub sheet + FAB contextual).

const GC_NAV_ITEMS = [
  { value: "dashboard", label: "Dashboard", icon: (s) => <BarChart3 size={s} />, group: null },

  { value: "receitas", label: "Receitas", icon: (s) => <TrendingUp size={s} />, group: "Financeiro" },
  { value: "recorrencias", label: "Recorrências", icon: (s) => <Repeat size={s} />, group: "Financeiro" },
  { value: "investimentos", label: "Investimentos", icon: (s) => <TrendingUp size={s} />, group: "Financeiro" },
  { value: "viagens", label: "Viagens", icon: (s) => <Plane size={s} />, group: "Financeiro" },
  { value: "sonhos", label: "Lista de Sonhos", icon: (s) => <Gift size={s} />, group: "Listas" },

];
// Ano inicial de Receitas: no modo demo, o ano do último lançamento; senão, ano atual.
function gcInitialReceitasAno() {
  if (GC_IS_LOCAL && GC_DEMO_DATA.incomeEntries.length) {
    return GC_DEMO_DATA.incomeEntries.map(e => e.competencia).slice().sort().slice(-1)[0].slice(0, 4);
  }
  return competenciaAtual().slice(0, 4);
}
// Competência sugerida ao criar fonte na tela de Receitas: mês atual se o
// ano selecionado for o corrente; senão janeiro daquele ano.
function gcReceitasDefaultCompetencia(ano) {
  const atual = competenciaAtual();
  if (atual.startsWith(String(ano) + "-")) return atual;
  return `${ano}-01`;
}

function App({ session }) {
  const {
    expenseCategories, incomeSources, incomeEntries, expenseTemplates, expenseInstances, investmentSnapshots, wishlistItems, wishlistSavingsSnapshots,
    trips, tripExpenses,
    loading, error, dismissError,
    saveExpenseCategory, reorderExpenseCategories, deleteExpenseCategory,
    saveIncomeSource, deleteIncomeSource, saveIncomeEntry, saveIncomeProjection,
    saveExpenseTemplate, deleteExpenseTemplate, saveExpenseInstance, deleteExpenseInstance, toggleExpenseInstancePago,
    saveInvestmentSnapshot, saveWishlistItem, deleteWishlistItem, toggleWishlistComprado,
    saveWishlistSavingsSnapshot, deleteWishlistSavingsSnapshot,
    saveTrip, deleteTrip, saveTripExpense, deleteTripExpense,
  } = useGcData(session);
  // (deleteIncomeEntry existe no hook, ainda sem UI que remova um lançamento
  // pontual — fica pra quando a tela de Receitas ganhar essa ação.)
  const [subTab, setSubTab] = useState("dashboard");
  const [hubOpen, setHubOpen] = useState(false);
  const [receitasAno, setReceitasAno] = useState(gcInitialReceitasAno);
  const [despesasComp, setDespesasComp] = useState(competenciaAtual);
  const [dashboardAno, setDashboardAno] = useState(() => competenciaAtual().slice(0, 4));
  const [sourceForm, setSourceForm] = useState(null);
  const [instanceForm, setInstanceForm] = useState(null);
  const [templateForm, setTemplateForm] = useState(null);
  const [snapshotForm, setSnapshotForm] = useState(null);
  const [wishlistForm, setWishlistForm] = useState(null);
  const [wishlistSavingsForm, setWishlistSavingsForm] = useState(null);
  const [tripAberta, setTripAberta] = useState(null);
  const [tripDia, setTripDia] = useState(-1);
  const [tripForm, setTripForm] = useState(null);
  const [tripExpenseForm, setTripExpenseForm] = useState(null);
  const [despesasFabMenu, setDespesasFabMenu] = useState(false);
  const [dashboardFabMenu, setDashboardFabMenu] = useState(false);
  const [sonhosFabMenu, setSonhosFabMenu] = useState(false);
  const [topbarFilterOpen, setTopbarFilterOpen] = useState(false);
  const [categoriesModal, setCategoriesModal] = useState(false);
  const [contaItens, setContaItens] = useState([]);
  const [contaTotalManual, setContaTotalManual] = useState("");
  const [contaComTaxa, setContaComTaxa] = useState(true);
  const [contaTaxaPct, setContaTaxaPct] = useState("10");
  const [contaPessoas, setContaPessoas] = useState("1");
  const [contaItemForm, setContaItemForm] = useState(null);

  const handleToggleWishlistComprado = async (id) => {
    const item = wishlistItems.find(i => i.id === id);
    if (!item) return;
    const marcandoComprado = !item.comprado;
    if (marcandoComprado && item.preco != null && Number(item.preco) > 0) {
      const descontar = window.confirm(`Descontar ${gcFmtMoney(item.preco)} da Poupança Sonhos?`);
      if (descontar) {
        const comp = competenciaAtual();
        const found = gcFindWishlistSavingsSnapshot(wishlistSavingsSnapshots, comp);
        const base = found ? (found.saldo || 0) : gcSaldoPoupancaSonhos(wishlistSavingsSnapshots);
        await saveWishlistSavingsSnapshot({
          id: found ? found.id : uid(),
          competencia: comp,
          saldo: Math.max(0, base - Number(item.preco)),
          observacao: found ? (found.observacao || "") : "",
        });
      }
    }
    await toggleWishlistComprado(id);
  };

  useEffect(() => {
    if (!hubOpen) return;
    const onKey = (e) => { if (e.key === "Escape") setHubOpen(false); };
    document.addEventListener("keydown", onKey);
    return () => document.removeEventListener("keydown", onKey);
  }, [hubOpen]);

  useEffect(() => {
    setTopbarFilterOpen(false);
    setHubOpen(false);
    if (subTab !== "viagens") { setTripAberta(null); setTripDia(-1); }
  }, [subTab]);

  useEffect(() => {
    if (!topbarFilterOpen) return;
    const onKey = (e) => { if (e.key === "Escape") setTopbarFilterOpen(false); };
    document.addEventListener("keydown", onKey);
    return () => document.removeEventListener("keydown", onKey);
  }, [topbarFilterOpen]);

  const openTab = (tab) => { setHubOpen(false); setSubTab(tab); };
  const current = GC_NAV_ITEMS.find(i => i.value === subTab);

  return (
    <>
      <div className="gc-app">
        <header className="gc-topbar">
          <div className="gc-topbar-brand">
            <button
              type="button"
              className={"gc-brand gc-brand-btn" + (hubOpen ? " open" : "")}
              onClick={() => { setTopbarFilterOpen(false); setHubOpen(o => !o); }}
              aria-label={hubOpen ? "Fechar menu" : "Abrir menu"}
              aria-expanded={hubOpen}
              aria-haspopup="dialog"
            >
              <GcCoin size={22} />
              <strong>Guitcoin</strong>
              <ChevronDown size={16} className="gc-brand-chevron" />
            </button>
            {hubOpen && (
              <>
                <div className="gc-hub-backdrop" onClick={() => setHubOpen(false)} />
                <div className="gc-hub-popover" role="dialog" aria-label="Navegação">
                  <div className="gc-hub-grid">
                    {GC_NAV_ITEMS.map(item => (
                      <button
                        key={item.value}
                        type="button"
                        className={"gc-hub-item" + (subTab === item.value ? " active" : "")}
                        onClick={() => openTab(item.value)}
                      >
                        <span className="gc-hub-item-icon">{item.icon(22)}</span>
                        <span>{item.label === "Lista de Sonhos" ? "Sonhos" : item.label}</span>
                      </button>
                    ))}
                  </div>
                  <div className="gc-hub-footer">
                    <button type="button" className="gc-hub-action danger" onClick={() => { if (!GC_IS_LOCAL && gcAuth) gcAuth.signOut(); }} aria-label="Sair">
                      <LogOut size={16} /> Sair
                    </button>
                  </div>
                </div>
              </>
            )}
          </div>
          <span className="gc-topbar-spacer" />
          {(subTab === "dashboard" || subTab === "receitas" || subTab === "despesas") ? (
            <div className="gc-topbar-filter">
              <button type="button" className={"lb-icon-btn" + (topbarFilterOpen ? " active" : "")}
                onClick={() => { setHubOpen(false); setTopbarFilterOpen(o => !o); }}
                aria-label={subTab === "despesas" ? `Filtrar por mês (${competenciaLabel(despesasComp)})` : `Filtrar por ano (${subTab === "dashboard" ? dashboardAno : receitasAno})`}
                aria-expanded={topbarFilterOpen}
                aria-haspopup="dialog">
                <Filter size={18} />
              </button>
              {topbarFilterOpen && (
                <>
                  <div className="gc-topbar-filter-backdrop" onClick={() => setTopbarFilterOpen(false)} />
                  <div className="gc-topbar-filter-popover" role="dialog" aria-label={subTab === "despesas" ? "Mês das despesas" : "Ano"}>
                    {subTab === "despesas" ? (
                      <>
                        <span className="gc-topbar-filter-label">Mês</span>
                        <div className="gc-month-switch">
                          <button type="button" className="lb-icon-btn" onClick={() => setDespesasComp(gcShiftCompetencia(despesasComp, -1))} aria-label="Mês anterior"><ChevronLeft size={20} /></button>
                          <span className="gc-month-label">{competenciaLabel(despesasComp)}</span>
                          <button type="button" className="lb-icon-btn" onClick={() => setDespesasComp(gcShiftCompetencia(despesasComp, 1))} aria-label="Próximo mês"><ChevronRight size={20} /></button>
                        </div>
                      </>
                    ) : (
                      <>
                        <span className="gc-topbar-filter-label">Ano</span>
                        <div className="gc-year-switch">
                          <button type="button" className="lb-icon-btn" onClick={() => (subTab === "dashboard" ? setDashboardAno(String(Number(dashboardAno) - 1)) : setReceitasAno(String(Number(receitasAno) - 1)))} aria-label="Ano anterior"><ChevronLeft size={20} /></button>
                          <span className="gc-month-label">{subTab === "dashboard" ? dashboardAno : receitasAno}</span>
                          <button type="button" className="lb-icon-btn" onClick={() => (subTab === "dashboard" ? setDashboardAno(String(Number(dashboardAno) + 1)) : setReceitasAno(String(Number(receitasAno) + 1)))} aria-label="Próximo ano"><ChevronRight size={20} /></button>
                        </div>
                      </>
                    )}
                  </div>
                </>
              )}
            </div>
          ) : null}
        </header>

        {GC_IS_LOCAL && (
          <div className="gc-demo-banner">Modo local: dados de exemplo. Nada disso vai pro Firebase.</div>
        )}
        {error && (
          <div className="gc-error-banner" role="alert">
            <span>{error}</span>
            <button type="button" className="gc-error-close" onClick={dismissError} aria-label="Fechar aviso"><X size={16} /></button>
          </div>
        )}

        <main className="gc-main">
          {loading ? (
            <p className="lb-hint gc-empty">Carregando...</p>
          ) : subTab === "dashboard" ? (
            <GcDashboard
              incomeEntries={incomeEntries} expenseInstances={expenseInstances} investmentSnapshots={investmentSnapshots}
              ano={dashboardAno}
              onOpenInvestimentos={() => setSubTab("investimentos")}
            />
          ) : subTab === "receitas" ? (
            <GcReceitas
              sources={incomeSources} entries={incomeEntries}
              ano={receitasAno}
              onEditSource={(s) => setSourceForm({ initial: s })}
              onSaveEntryValor={(sourceId, competencia, existingId, valor) => saveIncomeEntry({ id: existingId || uid(), sourceId, competencia, valor })}
            />
          ) : subTab === "despesas" ? (
            <GcDespesas
              instances={expenseInstances} categories={expenseCategories} competencia={despesasComp}
              onTogglePago={toggleExpenseInstancePago}
              onSaveValor={(inst, valor) => saveExpenseInstance({ ...inst, valor, valorConfirmado: true })}
              onEditInstance={(inst) => setInstanceForm({ initial: inst })}
              onManageCategories={() => setCategoriesModal(true)}
            />
          ) : subTab === "recorrencias" ? (
            <GcRecorrencias templates={expenseTemplates} categories={expenseCategories} onEdit={(t) => setTemplateForm({ initial: t })} />
          ) : subTab === "investimentos" ? (
            <GcInvestimentos snapshots={investmentSnapshots} onEdit={(comp) => setSnapshotForm({ initialCompetencia: comp })} />
          ) : subTab === "sonhos" ? (
            <GcSonhos
              items={wishlistItems}
              savingsSnapshots={wishlistSavingsSnapshots}
              onToggleComprado={handleToggleWishlistComprado}
              onEdit={(item) => setWishlistForm({ initial: item })}
              onEditSavings={(comp) => setWishlistSavingsForm({ initialCompetencia: comp })}
            />
          ) : subTab === "conta" ? (
            <GcConta
              itens={contaItens} setItens={setContaItens}
              totalManual={contaTotalManual} setTotalManual={setContaTotalManual}
              comTaxa={contaComTaxa} setComTaxa={setContaComTaxa}
              taxaPct={contaTaxaPct} setTaxaPct={setContaTaxaPct}
              pessoas={contaPessoas} setPessoas={setContaPessoas}
              itemForm={contaItemForm} setItemForm={setContaItemForm}
            />
          ) : subTab === "viagens" ? (
            tripAberta ? (
              <GcViagemDetalhe
                trip={trips.find(t => t.id === tripAberta)}
                expenses={tripExpenses.filter(e => e.tripId === tripAberta)}
                dia={tripDia} setDia={setTripDia}
                onBack={() => setTripAberta(null)}
                onEditTrip={() => setTripForm({ initial: trips.find(t => t.id === tripAberta) })}
                onEditExpense={(exp) => setTripExpenseForm({ initial: exp })}
              />
            ) : (
              <GcViagens
                trips={trips} tripExpenses={tripExpenses}
                onOpen={(id) => { setTripAberta(id); setTripDia(-1); }}
              />
            )
          ) : (
            <EmptyState
              icon={current ? current.icon(40) : <BarChart3 size={40} />}
              title={current ? current.label : "Guitcoin"}
              message="Essa tela ainda está em construção (ver Roadmap no CLAUDE.md)."
            />
          )}
        </main>

        <button type="button" className="gc-fab"
          onClick={() => {
            if (subTab === "dashboard") setDashboardFabMenu(true);
            else if (subTab === "receitas") setSourceForm({ initial: null, competencia: gcReceitasDefaultCompetencia(receitasAno) });
            else if (subTab === "despesas") setDespesasFabMenu(true);
            else if (subTab === "recorrencias") setTemplateForm({ initial: null });
            else if (subTab === "investimentos") setSnapshotForm({ initialCompetencia: competenciaAtual() });

            else if (subTab === "conta") setContaItemForm({ initial: null });

              if (tripAberta) setTripExpenseForm({ initial: null });
              else setTripForm({ initial: null });
            }
          }}
          aria-label={subTab === "dashboard" ? "Adicionar" : subTab === "receitas" ? "Nova fonte de receita" : subTab === "despesas" ? "Nova despesa" : subTab === "recorrencias" ? "Nova recorrência" : subTab === "investimentos" ? "Registrar saldo" : subTab === "sonhos" ? "Adicionar" : subTab === "conta" ? "Novo item da conta" : subTab === "viagens" ? (tripAberta ? "Novo gasto" : "Nova viagem") : "Adicionar"}>
          <Plus size={26} />
        </button>

          <GcIncomeSourceForm

            defaultCompetencia={sourceForm.competencia || gcReceitasDefaultCompetencia(receitasAno)}
            onSave={async (source, lancamento) => {
              const ok = await saveIncomeSource(source);
              if (ok === false) return false;
              if (lancamento && lancamento.competencia && Number(lancamento.valor) > 0) {
                const okEntry = await saveIncomeEntry({
                  id: uid(), sourceId: source.id, competencia: lancamento.competencia, valor: lancamento.valor,
                });
                if (okEntry === false) return false;
              }
              return true;
            }}

            </div>

        {instanceForm && (
          <GcExpenseInstanceForm initial={instanceForm.initial} categories={expenseCategories} competencia={despesasComp} onSave={saveExpenseInstance} onDelete={deleteExpenseInstance} onClose={() => setInstanceForm(null)} />
        )}
        {templateForm && (
          <GcExpenseTemplateForm initial={templateForm.initial} categories={expenseCategories} onSave={saveExpenseTemplate} onDelete={deleteExpenseTemplate} onClose={() => setTemplateForm(null)} />
        )}
        {snapshotForm && (
          <GcInvestmentSnapshotForm initialCompetencia={snapshotForm.initialCompetencia} snapshots={investmentSnapshots} onSave={saveInvestmentSnapshot} onClose={() => setSnapshotForm(null)} />
        )}
        {wishlistForm && (
          <GcWishlistItemForm initial={wishlistForm.initial} onSave={saveWishlistItem} onDelete={deleteWishlistItem} onClose={() => setWishlistForm(null)} />
        )}
        {wishlistSavingsForm && (
          <GcWishlistSavingsSnapshotForm
            initialCompetencia={wishlistSavingsForm.initialCompetencia}
            snapshots={wishlistSavingsSnapshots}
            onSave={saveWishlistSavingsSnapshot}
            onDelete={deleteWishlistSavingsSnapshot}
            onClose={() => setWishlistSavingsForm(null)}
          />
        )}
        {tripForm && (
          <GcTripForm
            initial={tripForm.initial}
            onSave={saveTrip}
            onDelete={async (id) => { const ok = await deleteTrip(id); if (ok !== false) setTripAberta(null); return ok; }}
            onClose={() => setTripForm(null)}
          />
        )}
        {tripExpenseForm && tripAberta && (
          <GcTripExpenseForm
            initial={tripExpenseForm.initial}
            tripId={tripAberta}
            dia={tripDia}
            numDias={Math.max(1, (trips.find(t => t.id === tripAberta) || {}).numDias || 1)}
            existingCategorias={Array.from(new Set([
              ...GC_TRIP_EXPENSE_CATEGORIES,
              ...tripExpenses.filter(e => e.tripId === tripAberta).map(e => e.categoria),
            ]))}
            participantes={(trips.find(t => t.id === tripAberta) || {}).participantes || []}
            onSave={saveTripExpense}
            onDelete={deleteTripExpense}
            onClose={() => setTripExpenseForm(null)}
          />

      </div>
    </>
  );
}

// ---- Login (e-mail/senha). App é de uso pessoal: sem cadastro pela tela
// (nunca chamamos createUserWithEmailAndPassword), a conta já existe,
// criada direto no console do Firebase (Authentication > Users). ----
function GcLogin() {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);

  const onSubmit = async (e) => {
    e.preventDefault();
    if (!gcAuth) { setError("Firebase não está configurado ainda (ver CLAUDE.md > Roadmap)."); return; }
    setBusy(true); setError("");
    try {
      await gcWithTimeout(gcAuth.signInWithEmailAndPassword(email, password), 15000, "timeout");
    } catch (err) {
      if (err && err.code) { setError("E-mail ou senha inválidos."); }
      else {
        console.error(err);
        setError("A conexão com o login travou. Feche o app por completo (não só minimizar) e abra de novo.");
      }
    } finally {
      setBusy(false);
    }
  };

  return (
    <div className="gc-login-screen">
      <form className="gc-login-card" onSubmit={onSubmit}>
        <span className="gc-brand"><GcCoin size={26} /> <strong>Guitcoin</strong></span>
        <Field label="E-mail">
          <input type="email" required autoFocus value={email} onChange={e => setEmail(e.target.value)} />
        </Field>
        <Field label="Senha">
          <input type="password" required value={password} onChange={e => setPassword(e.target.value)} />
        </Field>
        {error && <p className="gc-login-error">{error}</p>}
        <button type="submit" className="lb-btn primary" disabled={busy}>{busy ? "Entrando..." : "Entrar"}</button>
      </form>
    </div>
  );
}

// ---- Raiz: decide entre carregando / login / app, conforme a sessão. ----
function GcRoot() {
  const session = useGcSession();
  if (session === undefined) return <div className="gc-login-screen"><p className="lb-hint">Carregando...</p></div>;
  if (!session) return <GcLogin />;
  return <App session={session} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<GcRoot />);
</script>

.gc-list-row-title { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gc-list-row-title-line { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-width: 0; }
.gc-list-row-title-line .gc-list-row-title { flex: 0 1 auto; }
.gc-row-valor { width: 110px; flex-shrink: 0; text-align: right; padding: 8px 10px; border-radius: var(--radius-pill); border: 1px solid var(--gc-line); font-size: 15px; font-weight: 600; color: var(--gc-ink); background: rgba(255,255,255,.06); }
.gc-row-valor:focus { outline: 1.5px solid var(--gc-accent); outline-offset: 1px; }
.gc-row-valor-estimado { border-color: var(--gc-gold); background: color-mix(in srgb, var(--gc-gold) 14%, transparent); }
.gc-row-valor-estimado:focus { outline-color: var(--gc-gold); }
.gc-list-total { display: flex; align-items: center; justify-content: space-between; padding: var(--sp-3) var(--sp-4); background: var(--gc-surface-2); font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 14.5px; }
.gc-list-more { display: block; width: 100%; padding: var(--sp-3) var(--sp-4); border: none; border-bottom: 1px solid var(--gc-line); background: none; cursor: pointer; text-align: left; font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 600; color: var(--gc-accent); }
.gc-list-more:hover { background: var(--gc-surface-2); }

.gc-statcards-2 { grid-template-columns: repeat(2, 1fr); }
.gc-statcards-1 { grid-template-columns: 1fr; }
.gc-num-red { color: var(--gc-red); }
.gc-num-gold { color: var(--gc-gold); }
.gc-delta-up { color: var(--gc-positive) !important; }
.gc-delta-down { color: var(--gc-red) !important; }
.gc-delta-flat { color: var(--gc-ink-soft) !important; }
.gc-invest-row-vals { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }

.gc-group { display: flex; flex-direction: column; gap: var(--sp-2); }
.gc-group-header { display: flex; align-items: center; justify-content: space-between; padding: 0 var(--sp-1); font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: .4px; color: var(--gc-ink-soft); }

.gc-conta-fields { display: flex; flex-direction: column; gap: var(--sp-3); }
.gc-conta-hint { margin: 0; padding: var(--sp-3) var(--sp-1); font-size: 13.5px; }
.gc-conta-hint-left { margin: -4px 0 0; text-align: left; font-size: 12.5px; }
.gc-conta-taxa-row { display: flex; align-items: center; gap: var(--sp-3); padding: 2px 0; }
.gc-conta-taxa-label { flex: 1; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 14px; color: var(--gc-ink); }
.gc-conta-taxa-pct {
  width: 72px; text-align: right; padding: 8px 10px; border-radius: var(--radius-pill);
  border: 1px solid var(--gc-line); font-family: 'Space Grotesk', sans-serif; font-size: 15px; font-weight: 600; color: var(--gc-ink);
  font-variant-numeric: tabular-nums; background: rgba(255,255,255,.06);
}
.gc-conta-taxa-pct:focus { outline: 1.5px solid var(--gc-accent); outline-offset: 1px; }
.gc-conta-taxa-pct:disabled { opacity: .45; background: var(--gc-surface-2); }
.gc-conta-taxa-suffix { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 14px; color: var(--gc-ink-soft); }
.gc-conta-por-pessoa { border-top: 1px solid var(--gc-line); background: var(--gc-surface-2); color: var(--gc-accent); }
.gc-conta-fields input:disabled { opacity: .55; background: var(--gc-surface-2); cursor: not-allowed; }

/* ---- Viagens: header com voltar/editar, cards de participante (saldo +
   "Disponível"), linhas de participante no formulário ---- */
.gc-trip-header { display: flex; align-items: center; gap: var(--sp-2); }
.gc-trip-header-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.gc-trip-header-txt strong { font-family: 'Playfair Display', serif; font-size: 18px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gc-trip-header-txt small { color: var(--gc-ink-soft); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gc-trip-participantes { display: flex; flex-direction: column; gap: var(--sp-2); }
.gc-trip-participante {
  display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-2) var(--sp-3);
  border: 1px solid var(--gc-line); border-radius: var(--radius-md); background: var(--gc-surface);
}
.gc-trip-participante-dot { flex-shrink: 0; width: 10px; height: 10px; border-radius: 50%; }
.gc-trip-participante-nome { flex: 1; min-width: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gc-trip-participante-vals { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; text-align: right; font-family: 'Space Grotesk', sans-serif; font-size: 12px; }
/* Wrapper próprio (não .lb-field): evita que `.lb-field input` (width:100%)
   vaze pros inputs de dentro (cor/nome/disponível), que têm layout próprio
   — era isso que esticava o seletor de cor virando uma barra. */
.gc-trip-participantes-wrap { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 5px; font-size: 14.5px; min-width: 0; }
.gc-trip-participantes-form { display: flex; flex-direction: column; gap: var(--sp-2); margin-bottom: var(--sp-2); }
.gc-trip-participante-row { display: flex; align-items: center; gap: var(--sp-2); }
.gc-trip-participante-row input:not(.gc-trip-participante-cor) { flex: 1; min-width: 0; padding: 9px 12px; border-radius: var(--radius-pill); border: 1px solid var(--gc-line); font-family: 'Space Grotesk', sans-serif; font-size: 14px; font-weight: 600; color: var(--gc-ink); background: rgba(255,255,255,.06); }
.gc-trip-participante-cor { flex-shrink: 0; width: 32px; height: 32px; padding: 0; border: 1px solid var(--gc-line); border-radius: var(--radius-sm); background: none; cursor: pointer; }

.gc-checkbox {
  flex-shrink: 0; width: 24px; height: 24px; border-radius: var(--radius-sm); border: 1.5px solid var(--gc-line);
  background: rgba(255,255,255,.06); display: flex; align-items: center; justify-content: center; color: var(--gc-on-accent); cursor: pointer; padding: 0;
}
.gc-checkbox.checked { background: var(--gc-accent); border-color: var(--gc-accent); }
.gc-row-valor-display { width: 90px; flex-shrink: 0; text-align: right; font-size: 14.5px; font-weight: 600; }

button.gc-list-row-btn { background: none; border: none; width: 100%; text-align: left; cursor: pointer; font: inherit; color: inherit; border-bottom: 1px solid var(--gc-line); }
button.gc-list-row-btn:last-of-type { border-bottom: none; }
button.gc-list-row-btn:hover { background: var(--gc-surface-2); }
.gc-list-row-grow { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.gc-list-row-sub { display: block; font-family: 'Space Grotesk', sans-serif; font-weight: 500; font-size: 11.5px; color: var(--gc-ink-soft); text-transform: none; letter-spacing: 0; }

.gc-fab-menu { display: flex; flex-direction: column; gap: var(--sp-2); }
.gc-fab-option { display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-3) var(--sp-3); border: 1px solid var(--gc-line); border-radius: var(--radius-md); background: var(--gc-surface); cursor: pointer; text-align: left; color: var(--gc-accent); }
.gc-fab-option:hover { background: var(--gc-surface-2); }
.gc-fab-option-txt { display: flex; flex-direction: column; color: var(--gc-ink); }
.gc-fab-option-txt strong { font-family: 'Space Grotesk', sans-serif; font-size: 14.5px; }
.gc-fab-option-txt small { color: var(--gc-ink-soft); font-size: 12.5px; }

/* ---- Dashboard: statcards-3, gráficos SVG/CSS puro, fluxo de caixa ---- */
.gc-statcards-3 { grid-template-columns: repeat(3, 1fr); }
.gc-year-switch { display: flex; align-items: center; justify-content: center; gap: var(--sp-3); }

.gc-receitas-hero {
  display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center;
  background: var(--gc-surface); border: 1px solid var(--gc-line); border-radius: var(--radius-md);
  padding: var(--sp-5) var(--sp-4);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
}
.gc-receitas-hero-num {
  font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 28px;
  color: var(--gc-accent); font-variant-numeric: tabular-nums; letter-spacing: -0.5px;
}
.gc-receitas-hero-cap {
  font-family: 'Space Grotesk', sans-serif; font-size: 11px; text-transform: uppercase;
  letter-spacing: .5px; color: var(--gc-ink-soft);
}
.gc-statcards-mini .gc-statcard { padding: var(--sp-2) var(--sp-1); }
.gc-statcards-mini .gc-statcard-num { font-size: 13px; }
.gc-statcards-mini .gc-statcard-cap { font-size: 9px; }

.gc-receitas-accordion .gc-acc-month { border-bottom: 1px solid var(--gc-line); }
.gc-receitas-accordion .gc-acc-month:last-child { border-bottom: none; }
.gc-acc-head {
  display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3);
  width: 100%; padding: var(--sp-3) var(--sp-4); border: none; background: none;
  cursor: pointer; font: inherit; color: inherit; text-align: left;
}
.gc-acc-head:hover { background: var(--gc-surface-2); }
.gc-acc-month.open > .gc-acc-head { background: var(--gc-surface-2); }
.gc-acc-head-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
.gc-acc-chevron { color: var(--gc-ink-soft); flex-shrink: 0; transition: transform .15s ease; transform: rotate(-90deg); }
.gc-acc-chevron.open { transform: rotate(0deg); }
.gc-acc-total { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 14px; font-variant-numeric: tabular-nums; color: var(--gc-ink); }
.gc-acc-total-empty { color: var(--gc-red); }
.gc-acc-empty-hint {
  margin: 0; padding: var(--sp-2) var(--sp-4) var(--sp-2) calc(var(--sp-4) + 24px);
  font-family: 'Space Grotesk', sans-serif; font-size: 12px; color: var(--gc-red); line-height: 1.35;
}
.gc-acc-body { border-top: 1px solid var(--gc-line); background: rgba(0,0,0,.2); }
.gc-acc-row { padding-left: calc(var(--sp-4) + 24px); }
.gc-acc-body .gc-list-more { padding-left: calc(var(--sp-4) + 24px); }
.gc-acc-body .gc-list-total { padding-left: calc(var(--sp-4) + 24px); }

.gc-dashboard-section { display: flex; flex-direction: column; gap: var(--sp-3); }
.gc-section-title { margin: 0; font-family: 'Playfair Display', serif; font-weight: 700; font-size: 16px; color: var(--gc-ink); }

.gc-cols { display: flex; align-items: flex-end; height: 140px; gap: 4px; }
.gc-col { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; height: 100%; }
.gc-col-track { flex: 1; width: 100%; display: flex; align-items: flex-end; justify-content: center; }
.gc-col-fill { width: 60%; max-width: 22px; border-radius: 3px 3px 0 0; background: linear-gradient(180deg, var(--gc-accent), var(--gc-gold)); }
.gc-col-label { margin-top: 6px; font-family: 'Space Grotesk', sans-serif; font-size: 10px; color: var(--gc-ink-soft); }
.gc-col-track-grouped { gap: 2px; }
.gc-col-fill-a { max-width: 10px; background: var(--gc-accent); }
.gc-col-fill-b { max-width: 10px; background: var(--gc-red); }

.gc-legend { display: flex; justify-content: center; gap: var(--sp-4); }
.gc-legend-item { display: flex; align-items: center; gap: 6px; font-family: 'Space Grotesk', sans-serif; font-size: 12px; color: var(--gc-ink-soft); }
.gc-legend-swatch { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.gc-legend-a { background: var(--gc-accent); }
.gc-legend-b { background: var(--gc-red); }

.gc-area-wrap { display: flex; flex-direction: column; gap: 6px; }
.gc-area-clickable { cursor: pointer; border-radius: var(--radius-md); outline: none; }
.gc-area-clickable:focus-visible { box-shadow: 0 0 0 2px color-mix(in srgb, var(--gc-accent) 40%, transparent); }
.gc-area-plot { position: relative; width: 100%; }
.gc-area-chart { width: 100%; height: 120px; display: block; }
.gc-area-fill { fill: color-mix(in srgb, var(--gc-accent) 22%, transparent); }
.gc-area-line { stroke: var(--gc-accent); stroke-width: 2.5; }
.gc-area-dot { fill: var(--gc-accent); }
.gc-area-values { position: absolute; inset: 0; pointer-events: none; }
.gc-area-values span {
  position: absolute;
  transform: translate(-50%, calc(-100% - 2px));
  font-family: 'Space Grotesk', sans-serif;
  font-size: 10px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  color: var(--gc-accent);
  white-space: nowrap;
  line-height: 1;
}
.gc-area-values-jan { color: var(--gc-ink-soft); }
.gc-area-labels { display: flex; justify-content: space-between; }
.gc-area-label { font-family: 'Space Grotesk', sans-serif; font-size: 10px; color: var(--gc-ink-soft); text-align: center; line-height: 1; }

.gc-cashflow-wrap { overflow-x: auto; border: 1px solid var(--gc-line); border-radius: var(--radius-md); }
.gc-cashflow-table { border-collapse: collapse; width: 100%; font-family: 'Space Grotesk', sans-serif; font-size: 11.5px; white-space: nowrap; }
.gc-cashflow-table th, .gc-cashflow-table td { padding: 8px 10px; text-align: right; border-bottom: 1px solid var(--gc-line); }
.gc-cashflow-table th { color: var(--gc-ink-soft); font-weight: 600; text-transform: uppercase; font-size: 10px; letter-spacing: .3px; }
.gc-cashflow-table tr:last-child td { border-bottom: none; }
.gc-cashflow-table td:first-child, .gc-cashflow-table th:first-child {
  text-align: left; font-weight: 700; position: sticky; left: 0; background: #121212; z-index: 1;
}
.gc-cashflow-total td { font-weight: 700; border-top: 1px solid var(--gc-line); }

/* ---- Shell (topbar, hub sheet, FAB, login) ---- */
.gc-app { min-height: 100vh; display: flex; flex-direction: column; padding-top: var(--gc-topbar-h); padding-bottom: var(--gc-fab-space); }
.gc-topbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 50; height: var(--gc-topbar-h);
  display: flex; align-items: center; gap: var(--sp-3);
  padding: env(safe-area-inset-top, var(--gc-sat)) var(--sp-5) 0;
  background: transparent; border: none; pointer-events: none;
}
.gc-topbar > * { pointer-events: auto; }
.gc-brand { display: flex; align-items: center; gap: 8px; font-family: 'Playfair Display', serif; font-size: 19px; color: var(--gc-ink); }
.gc-brand strong { font-weight: 700; }
.gc-brand-btn {
  display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0;
  background: var(--gc-glass-bg); border: 1px solid rgba(255,255,255,.12);
  border-radius: var(--radius-pill); padding: 7px 12px 7px 10px; margin: 0; cursor: pointer;
  font-size: 18px; color: #F0E6C8; line-height: 1; position: relative;
  box-shadow: var(--shadow-sm);
  -webkit-backdrop-filter: blur(var(--gc-glass-blur)); backdrop-filter: blur(var(--gc-glass-blur));
  transition: background .15s, color .15s, border-color .15s;
}
.gc-brand-btn:hover { color: var(--gc-accent); border-color: rgba(255,255,255,.2); }
.gc-brand-btn.open {
  color: var(--gc-accent); background: rgba(212,180,90,.18);
  border-color: rgba(212,180,90,.35);
}
.gc-brand-chevron { color: inherit; opacity: .75; transition: transform .18s ease; }
.gc-brand-btn.open .gc-brand-chevron { transform: rotate(180deg); }
.gc-coin {
  display: inline-flex; align-items: center; justify-content: center;
  flex-shrink: 0; border-radius: 50%; overflow: hidden;
  background: var(--gc-accent);
}
.gc-coin img { display: block; width: 100%; height: 100%; object-fit: contain; filter: brightness(0); }
.gc-topbar-spacer { flex: 1; pointer-events: none; }
.gc-topbar-filter { position: relative; flex-shrink: 0; z-index: 1; }
.gc-topbar-filter .lb-icon-btn {
  width: 38px; height: 38px; padding: 0;
  align-items: center; justify-content: center;
  background: var(--gc-glass-bg); border: 1px solid rgba(255,255,255,.12);
  border-radius: var(--radius-pill); color: var(--gc-ink);
  box-shadow: var(--shadow-sm);
  -webkit-backdrop-filter: blur(var(--gc-glass-blur)); backdrop-filter: blur(var(--gc-glass-blur));
  transition: background .15s, color .15s, border-color .15s;
}
.gc-topbar-filter .lb-icon-btn:hover { border-color: rgba(255,255,255,.2); color: var(--gc-ink); }
.gc-topbar-filter .lb-icon-btn.active {
  color: var(--gc-accent); background: rgba(212,180,90,.18);
  border-color: rgba(212,180,90,.35);
}
.gc-topbar-filter-backdrop { position: fixed; inset: 0; z-index: 25; }
.gc-topbar-filter-popover {
  position: absolute; top: calc(100% + 8px); right: 0; z-index: 26;
  min-width: 168px; padding: 10px 12px 12px;
  background: var(--gc-glass-bg); border: 1px solid var(--gc-line); border-radius: 12px;
  box-shadow: var(--shadow);
  -webkit-backdrop-filter: blur(var(--gc-glass-blur)); backdrop-filter: blur(var(--gc-glass-blur));
}
.gc-topbar-filter-label {
  display: block; font-family: 'Space Grotesk', sans-serif; font-size: 10.5px;
  font-weight: 600; text-transform: uppercase; letter-spacing: .5px;
  color: var(--gc-ink-soft); margin-bottom: 4px; text-align: center;
}

.gc-topbar-brand { position: relative; flex-shrink: 0; z-index: 1; }
.gc-hub-backdrop { position: fixed; inset: 0; z-index: 25; }
.gc-hub-popover {
  position: absolute; top: calc(100% + 8px); left: 0; z-index: 26;
  min-width: 280px; max-width: min(340px, calc(100vw - 40px));
  padding: 12px 12px 10px;
  background: var(--gc-glass-bg); border: 1px solid var(--gc-line); border-radius: 16px;
  box-shadow: var(--shadow);
  -webkit-backdrop-filter: blur(var(--gc-glass-blur)); backdrop-filter: blur(var(--gc-glass-blur));
  animation: gc-hub-in .18s ease;
}
@keyframes gc-hub-in {
  from { transform: translateY(-6px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
.gc-hub-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px 6px;
}
.gc-hub-item {
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding: 10px 6px; border: none; background: none; cursor: pointer;
  color: var(--gc-ink); font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 11px;
}
.gc-hub-item-icon {
  width: 48px; height: 48px; border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  background: rgba(255,255,255,.06); border: 1px solid var(--gc-line); color: var(--gc-ink-soft);
}
.gc-hub-item.active { color: var(--gc-accent); }
.gc-hub-item.active .gc-hub-item-icon {
  background: color-mix(in srgb, var(--gc-accent) 18%, transparent);
  border-color: color-mix(in srgb, var(--gc-accent) 45%, transparent);
  color: var(--gc-accent);
}
.gc-hub-footer {
  margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--gc-line);
  display: flex; flex-direction: column; gap: 2px;
}
.gc-hub-action {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; padding: 12px; border: none; background: none; cursor: pointer;
  font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 13px;
  color: var(--gc-ink-soft);
}
.gc-hub-action:hover { color: var(--gc-ink); }
.gc-hub-action.danger { color: var(--gc-red); }
.gc-hub-action:disabled { opacity: .45; cursor: not-allowed; }

.gc-demo-banner { background: rgba(212,180,90,.1); color: var(--gc-ink-soft); font-family: 'Space Grotesk', sans-serif; font-size: 12.5px; text-align: center; padding: 6px var(--sp-4); border-bottom: 1px solid var(--gc-line); }
.gc-error-banner { display: flex; align-items: center; gap: var(--sp-2); background: rgba(224,85,85,.15); color: var(--gc-red); font-family: 'Space Grotesk', sans-serif; font-size: 13px; padding: 8px var(--sp-4); }
.gc-error-close { margin-left: auto; background: none; border: none; color: inherit; cursor: pointer; display: flex; padding: 2px; }

.gc-main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: var(--sp-5); max-width: 720px; margin: 0 auto; width: 100%; }

.gc-fab {
  position: fixed; right: 18px; bottom: calc(18px + env(safe-area-inset-bottom, var(--gc-sab)));
  z-index: 15; width: 56px; height: 56px; border-radius: 50%;
  background: var(--gc-accent); color: var(--gc-on-accent); border: none;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 8px 28px rgba(0,0,0,.45); cursor: pointer;
}
.gc-fab:hover { background: var(--gc-accent-deep); }

.gc-login-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: var(--sp-5); background: var(--gc-bg); }
.gc-login-card {
  width: 100%; max-width: 340px; border-radius: var(--radius-lg); box-shadow: var(--shadow-sm);
  padding: var(--sp-7) var(--sp-6); display: flex; flex-direction: column; gap: var(--sp-4);
  background: var(--gc-glass-bg); border: 1px solid var(--gc-line);

  root.parentNode.insertBefore(stage, root);
  phone.appendChild(root);

const FileText = (p) => <IconBase {...p}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></IconBase>;
const Repeat = (p) => <IconBase {...p}><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></IconBase>;

const Settings = (p) => <IconBase {...p}><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></IconBase>;
const Filter = (p) => <IconBase {...p}><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></IconBase>;

const Plane = (p) => <IconBase {...p}><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-1 .1-1.3.5l-.4.5c-.4.5-.2 1.3.3 1.6L9 12l-2 3H4l-1 1.5 3 1 1 3L8.5 19l3-2 3.7 4.4c.4.4 1.1.4 1.4-.1l.4-.5c.3-.4.3-.9-.2-1.6z"/></IconBase>;

// Marca (logo G mira — assets/icon.png no círculo dourado via CSS), mesmo
// papel do GgFlower no Guitchelin: topbar e botão da gaveta.
function GcCoin({ outline = false, size = 22 }) {
  return (
    <span className={"gc-coin" + (outline ? " outline" : "")} style={{ width: size, height: size }} aria-hidden="true">
      <img src="assets/icon.png" width={size} height={size} alt="" draggable="false" />
    </span>

}

// ---- Helpers ----
let _uid = 0;
function uid() { _uid += 1; return "gc-" + Date.now().toString(36) + "-" + _uid.toString(36); }
function todayISO() {
  const d = new Date();
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}
const MONTH_LABELS = ["Jan", "Fev", "Mar", "Abr", "Mai", "Jun", "Jul", "Ago", "Set", "Out", "Nov", "Dez"];
// competência = "YYYY-MM" (mês de referência de um lançamento/instância).
function competenciaAtual() { return todayISO().slice(0, 7); }
function competenciaLabel(comp) {
  const [y, m] = (comp || "").split("-").map(Number);
  return m ? `${MONTH_LABELS[m - 1]} ${y}` : comp;
}
function gcShiftCompetencia(comp, delta) {
  const [y, m] = comp.split("-").map(Number);
  const d = new Date(y, m - 1 + delta, 1);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
}
function gcFmtMoney(v) {
  return (v || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
}
function gcFmtMoneyCompact(v) {
  const n = v || 0;
  if (Math.abs(n) >= 1000) {
    return (n / 1000).toLocaleString("pt-BR", { maximumFractionDigits: 1 }) + "k";
  }
  return n.toLocaleString("pt-BR", { maximumFractionDigits: 0 });
}
function gcFmtSignedMoney(v) {
  if (v > 0) return "+" + gcFmtMoney(v);
  return gcFmtMoney(v);
}
function gcFmtSignedPct(pct) {
  if (pct == null || !Number.isFinite(pct)) return "—";
  const body = pct.toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + "%";
  return pct > 0 ? "+" + body : body;
}

// ---- Fórmulas de Conta (bar/restaurante, só sessão — sem Firebase) ----
// Itens mandam: se a lista tem algo, a base é a soma; senão, o total manual.
function gcContaBase(itens, totalManual) {
  if (itens && itens.length) return itens.reduce((s, i) => s + (i.valor || 0), 0);
  return totalManual || 0;
}
function gcContaTaxa(base, comTaxa, pct) {
  if (!comTaxa) return 0;
  const p = pct == null || pct === "" ? 0 : Number(pct);
  return base * (Number.isFinite(p) ? p : 0) / 100;
}
function gcContaTotal(base, taxa) { return (base || 0) + (taxa || 0); }
function gcContaPorPessoa(total, pessoas) {
  const n = Math.max(1, parseInt(pessoas, 10) || 1);
  return (total || 0) / n;
}

// ---- Fórmulas de Receita (funções puras, sem React/Firebase) ----
function gcFindIncomeEntry(entries, sourceId, competencia) {
  return entries.find(e => e.sourceId === sourceId && e.competencia === competencia) || null;
}
function gcFindIncomeProjection(projections, ano) {
  return projections.find(p => p.ano === ano) || null;
}
function gcMonthEntriesTotal(entries, competencia) {
  return entries.filter(e => e.competencia === competencia).reduce((s, e) => s + (e.valor || 0), 0);
}
function gcExtraAcumuladoYTD(entries, sources, ano, ateCompetencia) {
  const extraIds = new Set(sources.filter(s => s.tipo === "extra").map(s => s.id));
  return entries
    .filter(e => extraIds.has(e.sourceId) && e.competencia.startsWith(ano + "-") && e.competencia <= ateCompetencia)
    .reduce((s, e) => s + (e.valor || 0), 0);
}
// Renda fixa mensal = soma das fontes tipo "work" no mês mais recente
// com lançamento no ano; anual = esse valor × 12 (acompanha o salário
// atual, não uma projeção manual).
function gcUltimaRendaFixaMensal(entries, sources, ano) {
  const workIds = new Set(sources.filter(s => s.tipo === "work").map(s => s.id));
  const doAno = entries
    .filter(e => workIds.has(e.sourceId) && e.competencia.startsWith(ano + "-") && (e.valor || 0) > 0);
  if (!doAno.length) return 0;
  const ultimaComp = doAno.map(e => e.competencia).sort().slice(-1)[0];
  return entries
    .filter(e => workIds.has(e.sourceId) && e.competencia === ultimaComp)
    .reduce((s, e) => s + (e.valor || 0), 0);
}
function gcRendaFixaAnualGarantida(entries, sources, ano) {
  return gcUltimaRendaFixaMensal(entries, sources, ano) * 12;
}
function gcProjecaoTotalAno(rendaFixaAnual, extraAcumuladoYTD) {
  return rendaFixaAnual + extraAcumuladoYTD;
}
// Teto de "até hoje" pra um ano: no ano corrente para no mês atual; em anos
// passados cobre o ano inteiro; em anos futuros (ainda sem chegar) fica vazio.
function gcAteCompetenciaDoAno(ano) {
  const atual = competenciaAtual();
  const fimAno = `${ano}-12`;
  return atual < fimAno ? atual : fimAno;
}
function gcFaturamentoYTD(entries, ano, ateCompetencia) {
  return entries
    .filter(e => e.competencia.startsWith(ano + "-") && e.competencia <= ateCompetencia)
    .reduce((s, e) => s + (e.valor || 0), 0);
}
function gcDefaultMesExpandido(ano) {
  if (GC_IS_LOCAL && GC_DEMO_DATA.incomeEntries.length) {
    const doAno = GC_DEMO_DATA.incomeEntries
      .map(e => e.competencia)
      .filter(c => c.startsWith(ano + "-"))
      .sort();
    if (doAno.length) return doAno.slice(-1)[0];
  }
  const atual = competenciaAtual();
  if (atual.startsWith(ano + "-")) return atual;
  return `${ano}-01`;
}

// ---- Fórmulas de Despesas/Recorrência (funções puras) ----
// Categorias hoje vêm do Firestore (coleção expense_categories, editável
// pelo usuário - ver GcManageCategoriesModal). Esta constante só serve de
// seed inicial (instalação nova / modo demo) e de fallback de rótulo caso
// uma categoria referenciada em algum lugar já tenha sido apagada.
const GC_EXPENSE_GROUPS_SEED = [
  { id: "casa", nome: "Casa", ordem: 0 },
  { id: "saude", nome: "Saúde", ordem: 1 },
  { id: "assinaturas", nome: "Assinaturas", ordem: 2 },
  { id: "pessoal", nome: "Pessoal", ordem: 3 },
  { id: "trabalho", nome: "Trabalho", ordem: 4 },
];
function gcExpenseGroupLabel(grupo, categories) {
  return ((categories || []).find(g => g.id === grupo) || {}).nome || grupo;
}
// Documentos antigos sem valorTipo: treat as fixo (não pedem confirmação).
function gcValorTipo(template) {
  return template && template.valorTipo === "variavel" ? "variavel" : "fixo";
}
// Documentos antigos sem valorConfirmado: já eram dados finais.
function gcValorConfirmado(instance) {
  return instance && instance.valorConfirmado === false ? false : true;
}
// Custo de vida de UMA instância: a parte que é minha de verdade. Uma conta
// dividida com terceiro (minhaParcelaPct = 0) some do custo de vida sem
// deixar de existir/aparecer com seu checkbox de "pago".
function gcCustoInstance(instance) {
  const pct = instance.minhaParcelaPct != null ? instance.minhaParcelaPct : 100;
  return (instance.valor || 0) * pct / 100;
}
function gcCustoTemplate(template) {
  const pct = template.minhaParcelaPct != null ? template.minhaParcelaPct : 100;
  return (template.valorPadrao || 0) * pct / 100;
}
function gcInstancesForCompetencia(instances, competencia) {
  return instances.filter(i => i.competencia === competencia);
}
function gcMonthInstancesTotal(instances, competencia) {
  return gcInstancesForCompetencia(instances, competencia).reduce((s, i) => s + (i.valor || 0), 0);
}
function gcCustoMes(instances, competencia) {
  return gcInstancesForCompetencia(instances, competencia).reduce((s, i) => s + gcCustoInstance(i), 0);
}
function gcGroupInstances(instances, competencia, categories) {
  const doMes = gcInstancesForCompetencia(instances, competencia);
  const cats = (categories || []).slice().sort((a, b) => (a.ordem || 0) - (b.ordem || 0));
  const known = new Set(cats.map(g => g.id));
  const grupos = cats
    .map(g => {
      const items = doMes.filter(i => i.grupo === g.id).sort((a, b) => (a.descricao || "").localeCompare(b.descricao || ""));
      return { value: g.id, label: g.nome, items, total: items.reduce((s, i) => s + (i.valor || 0), 0) };
    })
    .filter(g => g.items.length > 0);
  const orfaos = doMes.filter(i => !known.has(i.grupo)).sort((a, b) => (a.descricao || "").localeCompare(b.descricao || ""));
  if (orfaos.length) {
    grupos.push({ value: "_outros", label: "Outros", items: orfaos, total: orfaos.reduce((s, i) => s + (i.valor || 0), 0) });
  }
  return grupos;
}
function gcGroupTemplates(templates, categories) {
  return (categories || [])
    .slice()
    .sort((a, b) => (a.ordem || 0) - (b.ordem || 0))
    .map(g => {
      const items = templates.filter(t => t.grupo === g.id).sort((a, b) => (a.nome || "").localeCompare(b.nome || ""));
      return {
        value: g.id,
        label: g.nome,
        items,
        total: items.reduce((s, t) => s + (t.valorPadrao || 0), 0),
        custo: items.reduce((s, t) => s + gcCustoTemplate(t), 0),
      };
    })
    .filter(g => g.items.length > 0);
}
// Uma instância nova gerada a partir de um template (ainda sem id salvo).
function gcNovaInstanciaDeTemplate(t, competencia) {
  const variavel = gcValorTipo(t) === "variavel";
  return {
    id: uid(), templateId: t.id, grupo: t.grupo, descricao: t.nome, competencia,
    valor: t.valorPadrao || 0, pago: false,
    valorConfirmado: !variavel,
    compartilhado: !!t.compartilhado, compartilhadoCom: t.compartilhadoCom || "",
    minhaParcelaPct: t.minhaParcelaPct != null ? t.minhaParcelaPct : 100,
  };
}
// Geração LAZY das instâncias que faltam, até `competenciaLimite` (nunca
// adianta meses futuros — ver CLAUDE.md/plano). Mensal: todo mês entre
// data_inicio e min(competenciaLimite, data_fim). Anual: só o mês
// mes_cobranca do ano de competenciaLimite.
function gcGenerateMissingInstances(templates, instances, competenciaLimite) {
  const existentes = new Set(instances.map(i => (i.templateId || "") + "|" + i.competencia));
  const novas = [];
  for (const t of templates) {
    if (t.ativo === false || !t.dataInicio) continue;
    if (t.frequencia === "anual") {
      const ano = competenciaLimite.slice(0, 4);
      const comp = `${ano}-${String(t.mesCobranca || 1).padStart(2, "0")}`;
      if (comp > competenciaLimite || comp < t.dataInicio) continue;
      if (t.dataFim && comp > t.dataFim) continue;
      const key = t.id + "|" + comp;
      if (!existentes.has(key)) { novas.push(gcNovaInstanciaDeTemplate(t, comp)); existentes.add(key); }
    } else {
      const fim = t.dataFim && t.dataFim < competenciaLimite ? t.dataFim : competenciaLimite;
      let comp = t.dataInicio;
      let guard = 0;
      while (comp <= fim && guard < 600) {
        const key = t.id + "|" + comp;
        if (!existentes.has(key)) { novas.push(gcNovaInstanciaDeTemplate(t, comp)); existentes.add(key); }
        comp = gcShiftCompetencia(comp, 1);
        guard++;
      }
    }
  }
  return novas;
}

// ---- Fórmulas de Investimentos (funções puras) ----
// A CONFIRMAR COM O GUI: bate exatamente com a planilha
// (saldoEmCaixa/1000*100 ≈ 5177.32% quando saldoEmCaixa = 51773.18), mas o
// significado da base R$1.000 não está documentado em lugar nenhum. Fica
// como constante nomeada e editável até confirmar — nunca embutir a razão
// /1000*100 direto numa função (ver CLAUDE.md > Fórmulas).
const GC_PODER_COMPRA_BASE = 1000;
function gcFindInvestmentSnapshot(snapshots, competencia) {
  return snapshots.find(s => s.competencia === competencia) || null;
}
// Saldo em Caixa = saldo do snapshot mais recente (é um valor que o próprio
// Gui digita todo mês, não é derivado de receitas/despesas — pode até cair,
// ex. um saque).
function gcSaldoEmCaixa(snapshots) {
  if (!snapshots.length) return 0;
  const maisRecente = snapshots.slice().sort((a, b) => a.competencia.localeCompare(b.competencia)).slice(-1)[0];
  return maisRecente.saldo || 0;
}
function gcPoderDeCompra(saldoEmCaixa) {
  return (saldoEmCaixa / GC_PODER_COMPRA_BASE) * 100;
}
// Poupança da Lista de Sonhos: mesmo shape de investment_snapshots; o
// Poder de Compra em Sonhos usa só este saldo (não soma com investimentos).
function gcFindWishlistSavingsSnapshot(snapshots, competencia) {
  return snapshots.find(s => s.competencia === competencia) || null;
}
function gcSaldoPoupancaSonhos(snapshots) {
  return gcSaldoEmCaixa(snapshots);
}
// Variação entre dois snapshots consecutivos (por competência).
// pct = null quando o saldo anterior é 0 (divisão indefinida).
function gcVariacaoSnapshot(atual, anterior) {
  if (!atual || !anterior) return null;
  const delta = (atual.saldo || 0) - (anterior.saldo || 0);
  const ant = anterior.saldo || 0;
  return { delta, pct: ant === 0 ? null : (delta / ant) * 100 };
}
function gcDeltaTone(delta) {
  if (delta > 0) return "gc-delta-up";
  if (delta < 0) return "gc-delta-down";
  return "gc-delta-flat";
}

// ---- Fórmulas do Dashboard (funções puras) ----
function gcMonthsOfYear(ano) {
  return Array.from({ length: 12 }, (_, i) => `${ano}-${String(i + 1).padStart(2, "0")}`);
}
function gcReceitaPorMes(incomeEntries, ano) {
  return gcMonthsOfYear(ano).map(mes => ({ mes, total: gcMonthEntriesTotal(incomeEntries, mes) }));
}
// "Gastos" no Dashboard usa o custo pós-divisão (mesma fórmula do Custo de
// Vida) — uma conta dividida com terceiro não deveria inflar o fluxo de
// caixa pessoal, mesmo comportamento que a planilha original tinha ao
// zerar as células "bruno".
function gcCustoPorMes(expenseInstances, ano) {
  return gcMonthsOfYear(ano).map(mes => ({ mes, total: gcCustoMes(expenseInstances, mes) }));
}
function gcSaldoLiquidoPorMes(receitaPorMes, custoPorMes) {
  return receitaPorMes.map((r, i) => ({ mes: r.mes, total: r.total - custoPorMes[i].total }));
}
function gcFaturamentoAnual(incomeEntries, ano) {
  return gcReceitaPorMes(incomeEntries, ano).reduce((s, m) => s + m.total, 0);
}
function gcCustoDeVidaAnual(expenseInstances, ano) {
  return gcCustoPorMes(expenseInstances, ano).reduce((s, m) => s + m.total, 0);
}
function gcTaxaDePoupanca(faturamentoAnual, custoDeVidaAnual) {
  return faturamentoAnual > 0 ? (faturamentoAnual - custoDeVidaAnual) / faturamentoAnual : 0;
}
function gcMediaMensalDeGastos(custoDeVidaAnual) {
  return custoDeVidaAnual / 12;
}
// Investimentos é um SALDO (net worth), não um fluxo: um mês sem snapshot
// novo carrega o último valor conhecido adiante (mesmo raciocínio de
// gcSaldoEmCaixa, mês a mês).
function gcInvestimentosPorMes(snapshots, ano) {
  const ordenados = snapshots.slice().sort((a, b) => a.competencia.localeCompare(b.competencia));
  return gcMonthsOfYear(ano).map(mes => {
    const conhecido = ordenados.filter(s => s.competencia <= mes).slice(-1)[0];
    return { mes, total: conhecido ? conhecido.saldo : 0 };
  });
}

// ---- Fórmulas de Lista de Sonhos (funções puras) ----
const GC_WISHLIST_CATEGORIES = ["CASA", "LUNA", "VESTUÁRIO", "TECH", "CARE", "MISC"];
// Agrupa por categoria (só os ainda não comprados contam no subtotal/total,
// mesmo espírito do "SubTotal"/"Total" da planilha), preservando a ordem
// das categorias seed e anexando categorias custom no fim.
function gcWishlistGroups(items) {
  const ativos = items.filter(i => !i.comprado);
  const extras = Array.from(new Set(items.map(i => i.categoria))).filter(c => !GC_WISHLIST_CATEGORIES.includes(c));
  const categorias = [...GC_WISHLIST_CATEGORIES, ...extras];
  const groups = categorias
    .map(categoria => {
      const its = ativos.filter(i => i.categoria === categoria).sort((a, b) => (a.produto || "").localeCompare(b.produto || ""));
      return { categoria, items: its, subtotal: its.reduce((s, i) => s + (i.preco || 0), 0) };
    })
    .filter(g => g.items.length > 0);
  const total = groups.reduce((s, g) => s + g.subtotal, 0);
  return { groups, total };
}

// ---- Fórmulas de Viagens (funções puras) ----
// Categorias seguem o mesmo espírito da Lista de Sonhos: texto livre por
// viagem (sem CRUD/coleção própria), com estas seed só de sugestão inicial
// (vêm da planilha "Gastos_BA_ARRCAR_2024" usada de referência).
const GC_TRIP_EXPENSE_CATEGORIES = ["Passagens ida", "Passagens volta", "Hospedagem", "Alimentação", "Transporte"];
// Paleta de cores por participante (mesmo papel do "Disponível"
// laranja/roxo/verde no topo da planilha original).
const GC_TRIP_COLORS = ["#D4B45A", "#8E7CC3", "#6FCF97", "#56A0D3", "#E08F56", "#E05555"];
// dia = -1 (Pré-viagem) ou 0..numDias-1 ("Dia N"), mesmas colunas da planilha.
function gcTripDiaLabel(dia) {
  return dia === -1 ? "Pré-viagem" : `Dia ${dia}`;
}
function gcTripExpensesDoDia(expenses, dia) {
  return (expenses || []).filter(e => e.dia === dia);
}
function gcTripTotalDia(expenses, dia) {
  return gcTripExpensesDoDia(expenses, dia).reduce((s, e) => s + (e.valor || 0), 0);
}
function gcTripTotalGeral(expenses) {
  return (expenses || []).reduce((s, e) => s + (e.valor || 0), 0);
}
// Agrupa os gastos de um dia por categoria (mesmo espírito de
// gcWishlistGroups): seed primeiro, categorias custom depois, só as com item.
function gcTripGroupsDoDia(expenses, dia, seedCategorias) {
  const doDia = gcTripExpensesDoDia(expenses, dia);
  const extras = Array.from(new Set(doDia.map(e => e.categoria))).filter(c => !seedCategorias.includes(c));
  const categorias = [...seedCategorias, ...extras];
  const groups = categorias
    .map(categoria => {
      const its = doDia.filter(e => e.categoria === categoria);
      return { categoria, items: its, subtotal: its.reduce((s, e) => s + (e.valor || 0), 0) };
    })
    .filter(g => g.items.length > 0);
  return { groups, total: doDia.reduce((s, e) => s + (e.valor || 0), 0) };
}
// Saldo por participante = quanto pagou − parte justa (divisão igualitária
// entre todos os participantes da viagem, mesmo cálculo de "quem pagou vs
// quem deve" de um app de divisão de contas de viagem).
function gcTripSaldos(trip, expenses) {
  const participantes = (trip && trip.participantes) || [];
  const n = participantes.length || 1;
  const total = gcTripTotalGeral(expenses);
  const parteJusta = total / n;
  return participantes.map(p => {
    const pago = expenses.filter(e => e.pagoPorId === p.id).reduce((s, e) => s + (e.valor || 0), 0);
    return { ...p, pago, parteJusta, saldo: pago - parteJusta };
  });
}
// Simplifica os saldos num número mínimo de transferências: maior devedor
// acerta com o maior credor, repete até zerar (algoritmo guloso clássico de
// "simplify debts", equivalente ao que apps de divisão de viagem fazem).
function gcTripAcertos(saldos) {
  const devedores = saldos.filter(s => s.saldo < -0.005).map(s => ({ id: s.id, nome: s.nome, valor: -s.saldo })).sort((a, b) => b.valor - a.valor);
  const credores = saldos.filter(s => s.saldo > 0.005).map(s => ({ id: s.id, nome: s.nome, valor: s.saldo })).sort((a, b) => b.valor - a.valor);
  const acertos = [];
  let i = 0, j = 0;
  while (i < devedores.length && j < credores.length) {
    const d = devedores[i], c = credores[j];
    const v = Math.min(d.valor, c.valor);
    acertos.push({ de: d.nome, para: c.nome, valor: v });
    d.valor -= v; c.valor -= v;
    if (d.valor < 0.005) i++;
    if (c.valor < 0.005) j++;
  }
  return acertos;
}

// Corre uma promessa contra um timeout, pra nenhuma tela ficar presa pra
// sempre em "Carregando..." se a rede cair no meio de uma chamada.
function gcWithTimeout(promise, ms, label) {
  let t;
  const timeout = new Promise((_, reject) => { t = setTimeout(() => reject(new Error(label || "timeout")), ms); });
  return Promise.race([promise, timeout]).finally(() => clearTimeout(t));
}

// Traduz o erro cru do Firebase numa dica acionável em pt-BR.
function gcWriteErrorMsg(error, verbo) {
  const code = String((error && error.code) || "");
  const msg = String((error && error.message) || error || "");
  if (code === "auth/invalid-credential" || code === "auth/wrong-password" || code === "auth/user-not-found") {
    return "E-mail ou senha inválidos.";
  }
  if (code === "permission-denied" || /permission/i.test(msg)) {
    return `Não consegui ${verbo}: parece que a sessão expirou. Saia e entre de novo.`;
  }
  return `Não consegui ${verbo}. Tenta de novo em alguns segundos.`;
}

// ---- Sessão (login por e-mail/senha). App exige login; sem sessão não há
// leitura/escrita nos dados (Security Rules por uid, ver firestore.rules).
// `session.user.id` é o uid — mesmo formato usado nas duas fases (demo e
// produção), pra `useGcData` nunca precisar diferenciar as duas. ----
function useGcSession() {
  const [session, setSession] = useState(GC_IS_LOCAL ? { user: { id: "demo-local", email: "demo@local" } } : undefined);
  useEffect(() => {
    if (GC_IS_LOCAL) return;
    if (!gcAuth) { setSession(null); return; }
    const unsubscribe = gcAuth.onAuthStateChanged(
      (user) => setSession(user ? { user: { id: user.uid, email: user.email } } : null),
      (e) => { console.error(e); setSession(prev => prev === undefined ? null : prev); }
    );
    // Watchdog: se o auth travar na inicialização, não deixa o app preso em
    // "Carregando..." pra sempre. Cai pro login depois de alguns segundos.
    const watchdog = setTimeout(() => setSession(prev => prev === undefined ? null : prev), 6000);
    return () => { clearTimeout(watchdog); unsubscribe(); };
  }, []);
  return session;
}

// ---- Firestore: cada "tabela" vira uma subcoleção em
// users/{uid}/<colecao>/{id} — o próprio caminho do documento já escopa os
// dados por usuário (equivalente ao `user_id = auth.uid()` do Postgres),
// protegido por uma única regra recursiva em firestore.rules. Sem
// mapeadores gcRowToX/gcXToRow (diferença do Guitchelin/Postgres): o
// Firestore não impõe snake_case, então os documentos já nascem no mesmo
// formato camelCase que o resto do app usa. ----
function gcCollectionRef(session, colecao) {
  return gcFirestore.collection("users").doc(session.user.id).collection(colecao);
}
async function gcFetchAll(session, colecao) {
  const snap = await gcCollectionRef(session, colecao).get();
  return snap.docs.map(d => ({ id: d.id, ...d.data() }));
}
async function gcUpsertOne(session, colecao, obj) {
  const { id, ...data } = obj;
  await gcCollectionRef(session, colecao).doc(id).set(data);
}
async function gcUpsertMany(session, colecao, objs) {
  if (!objs.length) return;
  const batch = gcFirestore.batch();
  const ref = gcCollectionRef(session, colecao);
  objs.forEach(obj => { const { id, ...data } = obj; batch.set(ref.doc(id), data); });
  await batch.commit();
}
async function gcDeleteOne(session, colecao, id) {
  await gcCollectionRef(session, colecao).doc(id).delete();
}
async function gcUpdateFields(session, colecao, id, fields) {
  await gcCollectionRef(session, colecao).doc(id).update(fields);
}

// ---- Fila de toggles pendentes em localStorage: reforço específico pro
// checkbox de "pago"/"comprado", que o usuário costuma tocar e fechar o app
// na sequência (ver relato: "marquei checkbox e ao reabrir a marcação
// sumiu"). O enablePersistence do Firestore (IndexedDB) já cobre a maioria
// dos casos, mas grava a fila de escritas pendentes de forma assíncrona —
// se o app for morto rápido demais (troca de app no celular, aba fechada),
// a escrita pode nunca chegar a ser enfileirada a tempo. localStorage é
// síncrono: o valor já está em disco antes do clique terminar de
// processar, sobrevivendo mesmo nesse caso extremo. Reaplicado sobre os
// dados recém-carregados e reenviado a cada loadData(), só saindo da fila
// quando o reenvio é confirmado. ----
const GC_PENDING_TOGGLES_KEY = "gc_pending_toggles_v1";
function gcReadPendingToggles() {
  try { return JSON.parse(localStorage.getItem(GC_PENDING_TOGGLES_KEY) || "[]"); }
  catch { return []; }
}
function gcWritePendingToggles(list) {
  try { localStorage.setItem(GC_PENDING_TOGGLES_KEY, JSON.stringify(list)); } catch {}
}
function gcQueuePendingToggle(colecao, id, field, value) {
  const list = gcReadPendingToggles().filter(p => !(p.colecao === colecao && p.id === id && p.field === field));
  list.push({ colecao, id, field, value });
  gcWritePendingToggles(list);
}
function gcClearPendingToggle(colecao, id, field) {
  gcWritePendingToggles(gcReadPendingToggles().filter(p => !(p.colecao === colecao && p.id === id && p.field === field)));
}
async function gcFlushPendingToggles(session, colecoes) {
  const pendentes = gcReadPendingToggles();
  if (!pendentes.length) return colecoes;
  const resultado = { ...colecoes };
  for (const p of pendentes) {
    const lista = resultado[p.colecao];
    if (lista) resultado[p.colecao] = lista.map(item => item.id === p.id ? { ...item, [p.field]: p.value } : item);
    try { await gcUpdateFields(session, p.colecao, p.id, { [p.field]: p.value }); gcClearPendingToggle(p.colecao, p.id, p.field); }
    catch (err) { console.error(err); }
  }
  return resultado;
}

// ---- Dados (Firestore: as 8 coleções do app). Isolado aqui: as telas
// nunca chamam gcFirestore direto, só conhecem os verbos save*/delete*/
// toggle* e os arrays de dados retornados abaixo. ----
function useGcData(session) {
  const [expenseCategories, setExpenseCategories] = useState(GC_IS_LOCAL ? GC_DEMO_DATA.expenseCategories : []);
  const [incomeSources, setIncomeSources] = useState(GC_IS_LOCAL ? GC_DEMO_DATA.incomeSources : []);
  const [incomeEntries, setIncomeEntries] = useState(GC_IS_LOCAL ? GC_DEMO_DATA.incomeEntries : []);
  const [incomeProjections, setIncomeProjections] = useState(GC_IS_LOCAL ? GC_DEMO_DATA.incomeProjections : []);
  const [expenseTemplates, setExpenseTemplates] = useState(GC_IS_LOCAL ? GC_DEMO_DATA.expenseTemplates : []);
  // Em modo demo, já nasce com as instâncias que a própria geração lazy
  // criaria (mesma função usada em produção) + as compras avulsas seed —
  // serve de teste vivo do motor de recorrência a cada load da página.
  const [expenseInstances, setExpenseInstances] = useState(() => {
    if (!GC_IS_LOCAL) return [];
    const avulsas = GC_DEMO_DATA.expenseInstancesAvulsas || [];
    const geradas = gcGenerateMissingInstances(GC_DEMO_DATA.expenseTemplates, avulsas, competenciaAtual());
    return [...avulsas, ...geradas];
  });
  const [investmentSnapshots, setInvestmentSnapshots] = useState(GC_IS_LOCAL ? GC_DEMO_DATA.investmentSnapshots : []);
  const [wishlistItems, setWishlistItems] = useState(GC_IS_LOCAL ? GC_DEMO_DATA.wishlistItems : []);
  const [wishlistSavingsSnapshots, setWishlistSavingsSnapshots] = useState(GC_IS_LOCAL ? GC_DEMO_DATA.wishlistSavingsSnapshots : []);
  const [trips, setTrips] = useState(GC_IS_LOCAL ? GC_DEMO_DATA.trips : []);
  const [tripExpenses, setTripExpenses] = useState(GC_IS_LOCAL ? GC_DEMO_DATA.tripExpenses : []);
  const [loading, setLoading] = useState(!GC_IS_LOCAL);
  const [error, setError] = useState(null);

  const loadData = async () => {
    if (GC_IS_LOCAL || !gcFirestore) { setLoading(false); return; }
    setLoading(true);
    try {
      const [categories, sources, entries, projections, templates, instRaw, snapshots, wishlist, wishSavings, tripsData, tripExpensesData] = await Promise.all([
        gcFetchAll(session, "expense_categories"),
        gcFetchAll(session, "income_sources"),
        gcFetchAll(session, "income_entries"),
        gcFetchAll(session, "income_projections"),
        gcFetchAll(session, "expense_templates"),
        gcFetchAll(session, "expense_instances"),
        gcFetchAll(session, "investment_snapshots"),
        gcFetchAll(session, "wishlist_items"),
        gcFetchAll(session, "wishlist_savings_snapshots"),
        gcFetchAll(session, "trips"),
        gcFetchAll(session, "trip_expenses"),
      ]);
      // Instalação nova (sem nenhuma categoria ainda): semeia as 5 categorias
      // padrão uma única vez, pra tela de Despesas não nascer vazia.
      let categoriasFinais = categories;
      if (!categoriasFinais.length) {
        try {
          await gcUpsertMany(session, "expense_categories", GC_EXPENSE_GROUPS_SEED);
          categoriasFinais = GC_EXPENSE_GROUPS_SEED;
        } catch (seedErr) { console.error(seedErr); }
      }
      let instances = instRaw;
      // Geração lazy: cria só as instâncias que faltam até o mês atual e já
      // grava de volta (batch), pra não repetir o cálculo em todo load.
      const novas = gcGenerateMissingInstances(templates, instances, competenciaAtual());
      if (novas.length) {
        try {
          await gcUpsertMany(session, "expense_instances", novas);
          instances = [...instances, ...novas];
        } catch (genErr) {
          console.error(genErr);
        }
      }
      // Reaplica (e reenvia) qualquer toggle de "pago"/"comprado" que ficou
      // pendente em localStorage de uma sessão anterior fechada rápido
      // demais pro Firestore ter recebido a escrita (ver gcFlushPendingToggles).
      const reconciliado = await gcFlushPendingToggles(session, { expense_instances: instances, wishlist_items: wishlist });
      setExpenseCategories(categoriasFinais);
      setIncomeSources(sources);
      setIncomeEntries(entries);
      setIncomeProjections(projections);
      setExpenseTemplates(templates);
      setExpenseInstances(reconciliado.expense_instances);
      setInvestmentSnapshots(snapshots);
      setWishlistItems(reconciliado.wishlist_items);
      setWishlistSavingsSnapshots(wishSavings);
      setTrips(tripsData);
      setTripExpenses(tripExpensesData);
    } catch (err) {
      console.error(err);
      setError(gcWriteErrorMsg(err, "carregar os dados"));
    } finally {
      setLoading(false);
    }
  };

  useEffect(() => { loadData(); }, [session]);

  const saveExpenseCategory = async (categoria) => {
    setExpenseCategories(prev => prev.some(c => c.id === categoria.id) ? prev.map(c => c.id === categoria.id ? categoria : c) : [...prev, categoria]);
    if (GC_IS_LOCAL) return true;
    try { await gcUpsertOne(session, "expense_categories", categoria); return true; }
    catch (err) { console.error(err); setError(gcWriteErrorMsg(err, "salvar a categoria")); await loadData(); return false; }
  };

  // Reordena a lista inteira (campo ordem 0..n-1). Usado pelo modal da
  // engrenagem em Despesas — a tela de Despesas/Recorrências já ordena por
  // esse campo em gcGroupInstances/gcGroupTemplates.
  const reorderExpenseCategories = async (ordered) => {
    const withOrdem = ordered.map((c, i) => ({ ...c, ordem: i }));
    setExpenseCategories(withOrdem);
    if (GC_IS_LOCAL) return true;
    try { await gcUpsertMany(session, "expense_categories", withOrdem); return true; }
    catch (err) { console.error(err); setError(gcWriteErrorMsg(err, "reordenar as categorias")); await loadData(); return false; }
  };

  // Não deixa apagar uma categoria em uso (recorrência ou despesa lançada) -
  // evita "grupo" órfão sem rótulo aparecendo na lista. O chamador (tela)
  // decide o aviso pt-BR mostrado ao usuário quando isso retorna false.
  const deleteExpenseCategory = async (id) => {
    const emUso = expenseTemplates.some(t => t.grupo === id) || expenseInstances.some(i => i.grupo === id);
    if (emUso) return false;
    setExpenseCategories(prev => prev.filter(c => c.id !== id));
    if (GC_IS_LOCAL) return true;
    try { await gcDeleteOne(session, "expense_categories", id); return true; }
    catch (err) { console.error(err); setError(gcWriteErrorMsg(err, "excluir a categoria")); await loadData(); return false; }
  };

  const saveIncomeSource = async (source) => {
    setIncomeSources(prev => prev.some(s => s.id === source.id) ? prev.map(s => s.id === source.id ? source : s) : [...prev, source]);
    if (GC_IS_LOCAL) return true;
    try { await gcUpsertOne(session, "income_sources", source); return true; }
    catch (err) { console.error(err); setError(gcWriteErrorMsg(err, "salvar a fonte de receita")); await loadData(); return false; }
  };

  const deleteIncomeSource = async (id) => {
    setIncomeSources(prev => prev.filter(s => s.id !== id));
    setIncomeEntries(prev => prev.filter(e => e.sourceId !== id));
    if (GC_IS_LOCAL) return true;
    try { await gcDeleteOne(session, "income_sources", id); return true; }
    catch (err) { console.error(err); setError(gcWriteErrorMsg(err, "excluir a fonte de receita")); await loadData(); return false; }
  };

  const saveIncomeEntry = async (entry) => {
    setIncomeEntries(prev => prev.some(e => e.id === entry.id) ? prev.map(e => e.id === entry.id ? entry : e) : [...prev, entry]);
    if (GC_IS_LOCAL) return true;
    try { await gcUpsertOne(session, "income_entries", entry); return true; }
    catch (err) { console.error(err); setError(gcWriteErrorMsg(err, "salvar a receita do mês")); await loadData(); return false; }
  };

  const deleteIncomeEntry = async (id) => {
    setIncomeEntries(prev => prev.filter(e => e.id !== id));
    if (GC_IS_LOCAL) return true;
    try { await gcDeleteOne(session, "income_entries", id); return true; }
    catch (err) { console.error(err); setError(gcWriteErrorMsg(err, "excluir a receita do mês")); await loadData(); return false; }
  };

  const saveIncomeProjection = async (projection) => {
    setIncomeProjections(prev => prev.some(p => p.id === projection.id) ? prev.map(p => p.id === projection.id ? projection : p) : [...prev, projection]);
    if (GC_IS_LOCAL) return true;
    try { await gcUpsertOne(session, "income_projections", projection); return true; }
    catch (err) { console.error(err); setError(gcWriteErrorMsg(err, "salvar a projeção")); await loadData(); return false; }
  };

  const saveExpenseTemplate = async (t) => {
    setExpenseTemplates(prev => prev.some(x => x.id === t.id) ? prev.map(x => x.id === t.id ? t : x) : [...prev, t]);
    if (GC_IS_LOCAL) return true;
    try { await gcUpsertOne(session, "expense_templates", t); return true; }
    catch (err) { console.error(err); setError(gcWriteErrorMsg(err, "salvar a recorrência")); await loadData(); return false; }
  };

  // Apagar um template não apaga o histórico já gerado: as instâncias ficam
  // órfãs (templateId null) — no Firestore isso é feito à mão aqui (não há
  // "on delete set null" automático de FK como no Postgres).
  const deleteExpenseTemplate = async (id) => {
    setExpenseTemplates(prev => prev.filter(t => t.id !== id));
    const orfas = expenseInstances.filter(i => i.templateId === id);
    setExpenseInstances(prev => prev.map(i => i.templateId === id ? { ...i, templateId: null } : i));
    if (GC_IS_LOCAL) return true;
    try {
      await gcDeleteOne(session, "expense_templates", id);
      await Promise.all(orfas.map(i => gcUpdateFields(session, "expense_instances", i.id, { templateId: null })));
      return true;
    } catch (err) {
      console.error(err); setError(gcWriteErrorMsg(err, "excluir a recorrência")); await loadData(); return false;
    }
  };

  const saveExpenseInstance = async (inst) => {
    setExpenseInstances(prev => prev.some(i => i.id === inst.id) ? prev.map(i => i.id === inst.id ? inst : i) : [...prev, inst]);
    if (GC_IS_LOCAL) return true;
    try { await gcUpsertOne(session, "expense_instances", inst); return true; }
    catch (err) { console.error(err); setError(gcWriteErrorMsg(err, "salvar a despesa")); await loadData(); return false; }
  };

  const deleteExpenseInstance = async (id) => {
    setExpenseInstances(prev => prev.filter(i => i.id !== id));
    if (GC_IS_LOCAL) return true;
    try { await gcDeleteOne(session, "expense_instances", id); return true; }
    catch (err) { console.error(err); setError(gcWriteErrorMsg(err, "excluir a despesa")); await loadData(); return false; }
  };

  const toggleExpenseInstancePago = async (id) => {
    let next = null;
    setExpenseInstances(prev => prev.map(i => { if (i.id !== id) return i; next = { ...i, pago: !i.pago }; return next; }));
    if (GC_IS_LOCAL) return true;
    if (!next) return false;
    gcQueuePendingToggle("expense_instances", id, "pago", next.pago);
    try {
      await gcUpdateFields(session, "expense_instances", id, { pago: next.pago });
      gcClearPendingToggle("expense_instances", id, "pago");
      return true;
    } catch (err) { console.error(err); setError(gcWriteErrorMsg(err, "marcar a despesa como paga")); await loadData(); return false; }
  };

  const saveInvestmentSnapshot = async (snapshot) => {
    setInvestmentSnapshots(prev => prev.some(s => s.id === snapshot.id) ? prev.map(s => s.id === snapshot.id ? snapshot : s) : [...prev, snapshot]);
    if (GC_IS_LOCAL) return true;
    try { await gcUpsertOne(session, "investment_snapshots", snapshot); return true; }
    catch (err) { console.error(err); setError(gcWriteErrorMsg(err, "salvar o saldo")); await loadData(); return false; }
  };

  const saveWishlistItem = async (item) => {
    setWishlistItems(prev => prev.some(i => i.id === item.id) ? prev.map(i => i.id === item.id ? item : i) : [...prev, item]);
    if (GC_IS_LOCAL) return true;
    try { await gcUpsertOne(session, "wishlist_items", item); return true; }
    catch (err) { console.error(err); setError(gcWriteErrorMsg(err, "salvar o item")); await loadData(); return false; }
  };

  const deleteWishlistItem = async (id) => {
    setWishlistItems(prev => prev.filter(i => i.id !== id));
    if (GC_IS_LOCAL) return true;
    try { await gcDeleteOne(session, "wishlist_items", id); return true; }
    catch (err) { console.error(err); setError(gcWriteErrorMsg(err, "excluir o item")); await loadData(); return false; }
  };

  const toggleWishlistComprado = async (id) => {
    let next = null;
    setWishlistItems(prev => prev.map(i => { if (i.id !== id) return i; next = { ...i, comprado: !i.comprado }; return next; }));
    if (GC_IS_LOCAL) return true;
    if (!next) return false;
    gcQueuePendingToggle("wishlist_items", id, "comprado", next.comprado);
    try {
      await gcUpdateFields(session, "wishlist_items", id, { comprado: next.comprado });
      gcClearPendingToggle("wishlist_items", id, "comprado");
      return true;
    } catch (err) { console.error(err); setError(gcWriteErrorMsg(err, "marcar o item como comprado")); await loadData(); return false; }
  };

  const saveWishlistSavingsSnapshot = async (snapshot) => {
    setWishlistSavingsSnapshots(prev => prev.some(s => s.id === snapshot.id) ? prev.map(s => s.id === snapshot.id ? snapshot : s) : [...prev, snapshot]);
    if (GC_IS_LOCAL) return true;
    try { await gcUpsertOne(session, "wishlist_savings_snapshots", snapshot); return true; }
    catch (err) { console.error(err); setError(gcWriteErrorMsg(err, "salvar a poupança de sonhos")); await loadData(); return false; }
  };

  const deleteWishlistSavingsSnapshot = async (id) => {
    setWishlistSavingsSnapshots(prev => prev.filter(s => s.id !== id));
    if (GC_IS_LOCAL) return true;
    try { await gcDeleteOne(session, "wishlist_savings_snapshots", id); return true; }
    catch (err) { console.error(err); setError(gcWriteErrorMsg(err, "excluir o saldo da poupança")); await loadData(); return false; }
  };

  const saveTrip = async (trip) => {
    setTrips(prev => prev.some(t => t.id === trip.id) ? prev.map(t => t.id === trip.id ? trip : t) : [...prev, trip]);
    if (GC_IS_LOCAL) return true;
    try { await gcUpsertOne(session, "trips", trip); return true; }
    catch (err) { console.error(err); setError(gcWriteErrorMsg(err, "salvar a viagem")); await loadData(); return false; }
  };

  // Apagar uma viagem apaga também os gastos dela (diferente do template de
  // recorrência, que só orfaniza): sem a viagem, um gasto solto não tem pra
  // onde voltar (não existe tela "todos os gastos de todas as viagens").
  const deleteTrip = async (id) => {
    const gastos = tripExpenses.filter(e => e.tripId === id);
    setTrips(prev => prev.filter(t => t.id !== id));
    setTripExpenses(prev => prev.filter(e => e.tripId !== id));
    if (GC_IS_LOCAL) return true;
    try {
      await gcDeleteOne(session, "trips", id);
      await Promise.all(gastos.map(e => gcDeleteOne(session, "trip_expenses", e.id)));
      return true;
    } catch (err) {
      console.error(err); setError(gcWriteErrorMsg(err, "excluir a viagem")); await loadData(); return false;
    }
  };

  const saveTripExpense = async (exp) => {
    setTripExpenses(prev => prev.some(e => e.id === exp.id) ? prev.map(e => e.id === exp.id ? exp : e) : [...prev, exp]);
    if (GC_IS_LOCAL) return true;
    try { await gcUpsertOne(session, "trip_expenses", exp); return true; }
    catch (err) { console.error(err); setError(gcWriteErrorMsg(err, "salvar o gasto da viagem")); await loadData(); return false; }
  };

  const deleteTripExpense = async (id) => {
    setTripExpenses(prev => prev.filter(e => e.id !== id));
    if (GC_IS_LOCAL) return true;
    try { await gcDeleteOne(session, "trip_expenses", id); return true; }
    catch (err) { console.error(err); setError(gcWriteErrorMsg(err, "excluir o gasto da viagem")); await loadData(); return false; }
  };

  return {
    expenseCategories, incomeSources, incomeEntries, incomeProjections, expenseTemplates, expenseInstances, investmentSnapshots, wishlistItems, wishlistSavingsSnapshots,
    trips, tripExpenses,
    loading, error, dismissError: () => setError(null),
    saveExpenseCategory, reorderExpenseCategories, deleteExpenseCategory,
    saveIncomeSource, deleteIncomeSource, saveIncomeEntry, deleteIncomeEntry, saveIncomeProjection,
    saveExpenseTemplate, deleteExpenseTemplate, saveExpenseInstance, deleteExpenseInstance, toggleExpenseInstancePago,
    saveInvestmentSnapshot, saveWishlistItem, deleteWishlistItem, toggleWishlistComprado,
    saveWishlistSavingsSnapshot, deleteWishlistSavingsSnapshot,
    saveTrip, deleteTrip, saveTripExpense, deleteTripExpense,
  };
}

/* ---------------------------------------------------------------
   PRIMITIVAS DE UI (Modal, Field, Segmented, TabBar, EmptyState) — prefixo
   lb-, copiadas do Letterborgs (fonte das versões completas, o Guitchelin
   ficou com recortes parciais). Sem dependência de i18n aqui.
----------------------------------------------------------------*/
function Field({ label, children, select, wide, headline }) {
  return (
    <label className={"lb-field" + (select ? " select" : "") + (wide ? " wide" : "") + (headline ? " headline" : "")}>
      <span className="lb-field-label">{label}</span>
      {children}
    </label>
  );
}

function Segmented({ options, value, onChange, wrap, pairs, ariaLabel }) {
  return (
    <div className={"lb-segmented" + (wrap ? " wrap" : "") + (pairs ? " pairs" : "")} role="tablist" aria-label={ariaLabel}>
      {options.map(opt => (
        <button key={opt.value} type="button" role="tab" aria-selected={value === opt.value}
          className={(value === opt.value ? "active" : "") + (opt.muted ? " muted" : "")}
          onClick={() => onChange(opt.value)}>
          {opt.icon}{opt.label}
        </button>
      ))}
    </div>
  );
}

function TabBar({ options, value, onChange, ariaLabel }) {
  return (
    <div className="lb-tabbar" role="tablist" aria-label={ariaLabel}>
      {options.map(opt => (
        <button key={opt.value} type="button" role="tab" aria-selected={value === opt.value}
          className={value === opt.value ? "active" : ""} onClick={() => onChange(opt.value)}>
          {opt.label}
        </button>
      ))}
    </div>
  );
}

function Modal({ title, onClose, onRequestClose, children, wide, flush }) {
  const panelRef = useRef(null);
  const requestClose = () => (onRequestClose ? onRequestClose() : onClose());
  const requestCloseRef = useRef(requestClose);
  requestCloseRef.current = requestClose;
  useEffect(() => {
    const onKey = (e) => { if (e.key === "Escape") requestCloseRef.current(); };
    document.addEventListener("keydown", onKey);
    const prevOverflow = document.body.style.overflow;
    document.body.style.overflow = "hidden";
    const panel = panelRef.current;
    const prevFocus = document.activeElement;
    const focusables = panel ? Array.from(panel.querySelectorAll(
      'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'
    )).filter(el => !el.disabled && el.offsetParent !== null) : [];
    if (focusables.length) focusables[0].focus();
    const trap = (e) => {
      if (e.key !== "Tab" || !focusables.length) return;
      const first = focusables[0];
      const last = focusables[focusables.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    };
    document.addEventListener("keydown", trap);
    return () => {
      document.removeEventListener("keydown", onKey);
      document.removeEventListener("keydown", trap);
      document.body.style.overflow = prevOverflow;
      if (prevFocus && typeof prevFocus.focus === "function") prevFocus.focus();
    };
  }, []);
  return ReactDOM.createPortal(
    <div className="lb-modal-overlay" onMouseDown={(e) => { if (e.target === e.currentTarget) requestClose(); }}>
      <div ref={panelRef} className={"lb-modal" + (wide ? " wide" : "")} role="dialog" aria-modal="true" aria-labelledby="lb-modal-title">
        <div className="lb-modal-header">
          <h3 id="lb-modal-title">{title}</h3>
          <button className="lb-icon-btn" onClick={requestClose} aria-label="Fechar"><X size={20} /></button>
        </div>
        <div className={"lb-modal-body" + (flush ? " flush" : "")}>{children}</div>
      </div>
    </div>,
    document.body
  );
}

function EmptyState({ icon, title, message, action }) {
  return (
    <div className="lb-empty">
      {icon}
      <h4>{title}</h4>
      <p>{message}</p>
      {action}
    </div>
  );
}

/* ---------------------------------------------------------------
   TELA: RECEITAS (Fase 1) — cards de projeção do ano + grid mensal por
   fonte de receita, com seletor de mês (mesmo padrão de mês que Despesas
   vai usar na Fase 2).
----------------------------------------------------------------*/
function GcReceitas({ sources, entries, ano, onEditSource, onSaveEntryValor }) {
  const [mesExpandido, setMesExpandido] = useState(() => gcDefaultMesExpandido(ano));
  useEffect(() => {
    setMesExpandido(gcDefaultMesExpandido(ano));
  }, [ano]);

  const ate = gcAteCompetenciaDoAno(ano);
  const rendaFixaAnual = gcRendaFixaAnualGarantida(entries, sources, ano);
  const extraYTD = gcExtraAcumuladoYTD(entries, sources, ano, ate);
  const projecaoTotal = gcProjecaoTotalAno(rendaFixaAnual, extraYTD);
  const faturamentoYTD = gcFaturamentoYTD(entries, ano, ate);
  const atual = competenciaAtual();
  const meses = gcMonthsOfYear(ano).slice().reverse();
  const ativos = sources.filter(s => s.ativo !== false).slice().sort((a, b) => (a.ordem || 0) - (b.ordem || 0));
  const ativoIds = new Set(ativos.map(s => s.id));
  const entriesAtivos = entries.filter(e => ativoIds.has(e.sourceId));
  // Oculta meses futuros sem lançamento. Meses passados vazios ficam
  // visíveis com aviso; o mês atual também (pra dar pra lançar).
  const mesesVisiveis = meses.filter(comp => {
    const total = gcMonthEntriesTotal(entriesAtivos, comp);
    if (total > 0) return true;
    return comp <= atual;
  });

  const toggleMes = (comp) => {
    setMesExpandido(prev => prev === comp ? null : comp);
  };

  return (
    <div className="gc-screen">
      <div className="gc-receitas-hero">
        <span className="gc-receitas-hero-num gc-money">{gcFmtMoney(faturamentoYTD)}</span>
        <span className="gc-receitas-hero-cap">Faturamento YTD</span>
      </div>

      <div className="gc-statcards gc-statcards-mini">
        <div className="gc-statcard">
          <span className="gc-statcard-num gc-money">{gcFmtMoney(rendaFixaAnual)}</span>
          <span className="gc-statcard-cap">Renda fixa anual</span>
        </div>
        <div className="gc-statcard">
          <span className="gc-statcard-num gc-money">{gcFmtMoney(extraYTD)}</span>
          <span className="gc-statcard-cap">Extra acumulado</span>
        </div>
        <div className="gc-statcard">
          <span className="gc-statcard-num gc-money">{gcFmtMoney(projecaoTotal)}</span>
          <span className="gc-statcard-cap">Projeção {ano}</span>
        </div>
      </div>

      {ativos.length === 0 ? (
        <EmptyState icon={<TrendingUp size={40} />} title="Nenhuma fonte de receita" message="Toque no + pra cadastrar seu salário ou uma renda extra." />
      ) : mesesVisiveis.length === 0 ? (
        <EmptyState icon={<TrendingUp size={40} />} title="Nenhum mês com receita" message="Toque no + pra cadastrar um lançamento neste ano." />
      ) : (
        <div className="gc-list gc-receitas-accordion">
          {mesesVisiveis.map(comp => {
            const aberto = mesExpandido === comp;
            const totalMes = gcMonthEntriesTotal(entriesAtivos, comp);
            const vazioPassado = totalMes <= 0 && comp < atual;
            // Extra só aparece no mês se tiver valor > 0 (ex.: Cambridge some
            // nos meses sem aula). Fonte nova via + já nasce com o mês escolhido.
            const listados = ativos.filter(s => s.tipo !== "extra" || (() => {
              const entry = gcFindIncomeEntry(entries, s.id, comp);
              return !!(entry && Number(entry.valor) > 0);
            })());
            return (
              <div className={"gc-acc-month" + (aberto ? " open" : "") + (vazioPassado ? " gc-acc-month-empty" : "")} key={comp}>
                <button type="button" className="gc-acc-head" onClick={() => toggleMes(comp)} aria-expanded={aberto}>
                  <span className="gc-acc-head-left">
                    <ChevronDown size={16} className={"gc-acc-chevron" + (aberto ? " open" : "")} />
                    <span className="gc-list-row-title">{MONTH_LABELS[Number(comp.slice(5)) - 1]}</span>
                    {vazioPassado && <span className="gc-pill gc-pill-red">vazio</span>}
                  </span>
                  <span className={"gc-money gc-acc-total" + (vazioPassado ? " gc-acc-total-empty" : "")}>
                    {totalMes > 0 ? gcFmtMoney(totalMes) : "—"}
                  </span>
                </button>
                {aberto && (
                  <div className="gc-acc-body">
                    {vazioPassado && (
                      <p className="gc-acc-empty-hint">Mês sem lançamentos — confira se faltou registrar a receita.</p>
                    )}
                    {listados.map(source => {
                      const entry = gcFindIncomeEntry(entries, source.id, comp);
                      return (
                        <div className="gc-list-row gc-acc-row" key={source.id}>
                          <button type="button" className="gc-list-row-main" onClick={() => onEditSource(source)}>
                            <span className={"gc-pill" + (source.tipo === "extra" ? " gc-pill-gold" : "")}>{source.tipo === "extra" ? "Extra" : "Fixa"}</span>
                            <span className="gc-list-row-title">{source.nome}</span>
                          </button>
                          <input
                            type="number" inputMode="decimal" step="0.01" placeholder="0,00"
                            className="gc-row-valor gc-money"
                            defaultValue={entry ? entry.valor : ""}
                            key={comp + source.id + (entry ? entry.id : "novo")}
                            onBlur={(e) => {
                              const valor = parseFloat(e.target.value.replace(",", ".")) || 0;
                              if (!entry && valor === 0) return;
                              onSaveEntryValor(source.id, comp, entry ? entry.id : null, valor);
                            }}
                          />
                        </div>
                      );
                    })}
                    <div className="gc-list-total">
                      <span>Total do mês</span>
                      <span className="gc-money">{gcFmtMoney(totalMes)}</span>
                    </div>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function GcIncomeSourceForm({ initial, defaultCompetencia, onSave, onDelete, onClose }) {
  const isNew = !initial;
  const [nome, setNome] = useState(initial ? initial.nome : "");
  const [tipo, setTipo] = useState(initial ? initial.tipo : "work");

  const [busy, setBusy] = useState(false);

  const submit = async (e) => {
    e.preventDefault();
    if (!nome.trim()) return;
    setBusy(true);
    const source = { id: initial ? initial.id : uid(), nome: nome.trim(), tipo, ativo: true, ordem: initial ? initial.ordem : 0 };
    const lancamento = isNew ? {
      competencia,
      valor: parseFloat(String(valor).replace(",", ".")) || 0,
    } : null;
    const ok = await onSave(source, lancamento);
    setBusy(false);
    if (ok !== false) onClose();
  };

  return (
    <Modal title={initial ? "Editar fonte de receita" : "Nova fonte de receita"} onClose={onClose}>
      <form onSubmit={submit} className="lb-form-grid">

        </Field>

        </Field>
        {isNew && (
          <>
            <Field label="Mês do lançamento">
              <input type="month" value={competencia} onChange={e => setCompetencia(e.target.value)} required />
            </Field>
            <Field label="Valor">
              <input type="number" inputMode="decimal" step="0.01" value={valor} onChange={e => setValor(e.target.value)} placeholder="0,00" />

          </>

                  if (ok !== false) onClose();

            </div>
            <div className="lb-form-actions-right">
              <button type="button" className="lb-btn ghost" onClick={onClose}>Cancelar</button>
              <button type="submit" className="lb-btn primary" disabled={busy}>{busy ? "Salvando..." : "Salvar"}</button>
            </div>
          </div>
        </div>
      </form>
    </Modal>
  );
}

function GcRecorrencias({ templates, categories, onEdit }) {
  const grupos = gcGroupTemplates(templates, categories);
  const orfaos = templates.filter(t => !(categories || []).some(c => c.id === t.grupo));
  const orfaosTotal = orfaos.reduce((s, t) => s + (t.valorPadrao || 0), 0);
  const orfaosCusto = orfaos.reduce((s, t) => s + gcCustoTemplate(t), 0);
  const totalGeral = grupos.reduce((s, g) => s + g.total, 0) + orfaosTotal;
  const custoGeral = grupos.reduce((s, g) => s + g.custo, 0) + orfaosCusto;
  return (
    <div className="gc-screen">
      {templates.length === 0 ? (
        <EmptyState icon={<Repeat size={40} />} title="Nenhuma recorrência" message="Toque no + pra cadastrar uma conta fixa, assinatura ou cobrança anual." />

        <>
          <div className="gc-statcards gc-statcards-2">
            <div className="gc-statcard">
              <span className="gc-statcard-num gc-money">{gcFmtMoney(totalGeral)}</span>
              <span className="gc-statcard-cap">Total das recorrências</span>
            </div>
            <div className="gc-statcard">
              <span className="gc-statcard-num gc-money gc-num-red">{gcFmtMoney(custoGeral)}</span>
              <span className="gc-statcard-cap">Meu custo (após divisão)</span>
            </div>
          </div>
          {grupos.map(g => (
            <div className="gc-group" key={g.value}>
              <div className="gc-group-header">
                <span>{g.label}</span>
                <span className="gc-money">{gcFmtMoney(g.total)}</span>
              </div>
              <div className="gc-list">
                {g.items.map(t => (
                  <button type="button" className="gc-list-row gc-list-row-btn" key={t.id} onClick={() => onEdit(t)}>

                      <span className="gc-list-row-title-line">

// ---- Gerenciar categorias de Despesas: adicionar/remover/reordenar,
// acessível pelo ícone de engrenagem na tela de Despesas. Categoria em uso
// (recorrência ou despesa lançada) não pode ser excluída - onDelete retorna
// false nesse caso e a tela mostra o aviso em vez de deixar um "grupo" órfão. ----
function GcManageCategoriesModal({ categories, onSave, onReorder, onDelete, onClose }) {
  const [novaCategoria, setNovaCategoria] = useState("");
  const [busy, setBusy] = useState(false);
  const [avisoEmUso, setAvisoEmUso] = useState(null);
  const ordenadas = categories.slice().sort((a, b) => (a.ordem || 0) - (b.ordem || 0));

  const adicionar = async (e) => {
    e.preventDefault();
    const nome = novaCategoria.trim();
    if (!nome) return;
    setBusy(true);
    const maxOrdem = ordenadas.reduce((m, c) => Math.max(m, c.ordem || 0), -1);
    await onSave({ id: uid(), nome, ordem: maxOrdem + 1 });
    setBusy(false);
    setNovaCategoria("");
  };

  const remover = async (categoria) => {
    if (!confirm(`Excluir a categoria "${categoria.nome}"?`)) return;
    setAvisoEmUso(null);
    const ok = await onDelete(categoria.id);
    if (ok === false) setAvisoEmUso(categoria.nome);
  };

  const mover = async (index, dir) => {
    const next = index + dir;
    if (next < 0 || next >= ordenadas.length) return;
    const reordered = ordenadas.slice();
    const [item] = reordered.splice(index, 1);
    reordered.splice(next, 0, item);
    setBusy(true);
    await onReorder(reordered);
    setBusy(false);
  };

  return (
    <Modal title="Categorias de despesas" onClose={onClose}>
      <div className="gc-categories-list">
        {ordenadas.map((c, i) => (
          <div className="gc-categories-row" key={c.id}>
            <span className="gc-categories-name">{c.nome}</span>
            <span className="gc-categories-actions">
              <button type="button" className="lb-icon-btn" disabled={busy || i === 0} onClick={() => mover(i, -1)} aria-label={`Subir ${c.nome}`}>
                <ChevronUp size={16} />
              </button>
              <button type="button" className="lb-icon-btn" disabled={busy || i === ordenadas.length - 1} onClick={() => mover(i, 1)} aria-label={`Descer ${c.nome}`}>
                <ChevronDown size={16} />
              </button>
              <button type="button" className="lb-icon-btn" disabled={busy} onClick={() => remover(c)} aria-label={`Excluir categoria ${c.nome}`}>
                <Trash2 size={16} />
              </button>
            </span>
          </div>
        ))}
      </div>
      {avisoEmUso && (
        <p className="lb-hint gc-categories-warning">
          "{avisoEmUso}" tem recorrências ou despesas lançadas nela — mova ou apague essas despesas antes de excluir a categoria.
        </p>
      )}
      <form onSubmit={adicionar} className="gc-categories-add">
        <input value={novaCategoria} onChange={e => setNovaCategoria(e.target.value)} placeholder="Nova categoria" disabled={busy} />
        <button type="submit" className="lb-btn primary" disabled={busy || !novaCategoria.trim()}>Adicionar</button>
      </form>
    </Modal>
  );
}

/* ---------------------------------------------------------------
   TELA: INVESTIMENTOS (Fase 3) — saldo mensal (net worth) editável inline
   pro mês selecionado + histórico + os 2 indicadores que dependem dele no
   Dashboard (Saldo em Caixa / Poder de Compra).
----------------------------------------------------------------*/
function GcInvestimentos({ snapshots, onEdit }) {
  const saldoEmCaixa = gcSaldoEmCaixa(snapshots);
  const asc = snapshots.slice().sort((a, b) => a.competencia.localeCompare(b.competencia));
  const historico = asc.slice().reverse();
  const ultimoPar = asc.length >= 2 ? gcVariacaoSnapshot(asc[asc.length - 1], asc[asc.length - 2]) : null;
  const chartItems = asc.map(s => ({
    // Eixo X do gráfico de Evolução: número do mês (1–12), não o nome
    // abreviado (Jan/Fev/...) usado no resto do app — pedido do Gui.
    label: String(Number(s.competencia.slice(5, 7))),
    value: s.saldo || 0,
    id: s.competencia,
  }));
  // Mostra, além do último saldo, o saldo de Janeiro do ano corrente (pra
  // comparar início x situação atual do ano) — pedido do Gui.
  const anoAtualJan = competenciaAtual().slice(0, 4) + "-01";
  const janIndex = asc.findIndex(s => s.competencia === anoAtualJan);

  return (
    <div className="gc-screen">
      <div className="gc-statcards gc-statcards-2">
        <div className="gc-statcard">
          <span className="gc-statcard-num gc-money">{gcFmtMoney(saldoEmCaixa)}</span>
          <span className="gc-statcard-cap">Total Investido</span>
        </div>
        <div className="gc-statcard">
          <span className={"gc-statcard-num" + (ultimoPar ? " " + gcDeltaTone(ultimoPar.delta) : "")}>
            {ultimoPar ? gcFmtSignedPct(ultimoPar.pct) : "—"}
          </span>
          <span className="gc-statcard-cap">Último mês</span>
        </div>
      </div>

      {chartItems.length >= 2 && (
        <div className="gc-dashboard-section">
          <h3 className="gc-section-title">Evolução</h3>
          <GcAreaChart items={chartItems} showValues janIndex={janIndex} />
        </div>
      )}

      {historico.length === 0 ? (
        <EmptyState icon={<TrendingUp size={40} />} title="Nenhum saldo registrado" message="Toque no + pra registrar o saldo do mês." />
      ) : (
        <div className="gc-list">
          {historico.map((s, i) => {
            // historico é desc; o anterior cronológico é o próximo na lista
            const anterior = historico[i + 1] || null;
            const variacao = gcVariacaoSnapshot(s, anterior);
            return (
              <button type="button" className="gc-list-row gc-list-row-btn" key={s.id} onClick={() => onEdit(s.competencia)}>
                <span className="gc-list-row-title" style={{ flex: 1 }}>{competenciaLabel(s.competencia)}</span>
                <span className="gc-invest-row-vals">
                  <span className="gc-row-valor-display gc-money">{gcFmtMoney(s.saldo)}</span>
                  {variacao && (
                    <small className={"gc-list-row-sub " + gcDeltaTone(variacao.delta)}>
                      {gcFmtSignedMoney(variacao.delta)} · {gcFmtSignedPct(variacao.pct)}
                    </small>
                  )}
                </span>
              </button>
            );
          })}
        </div>
      )}
    </div>
  );
}
